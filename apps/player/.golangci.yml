version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - cyclop
    - dupl
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - funlen
    - gocognit
    - gocritic
    - gosec
    - govet
    - ineffassign
    - loggercheck
    - makezero
    - misspell
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - perfsprint
    - reassign
    - recvcheck
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    cyclop:
      max-complexity: 21
    dupl:
      threshold: 100
    funlen:
      lines: 100
      statements: 60
    gocognit:
      min-complexity: 21
    nolintlint:
      allow-unused: false
      require-specific: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    generated: strict
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - funlen
          - gocognit

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

