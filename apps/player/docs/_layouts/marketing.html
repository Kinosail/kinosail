<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d0b">
<title>{{ page.title }} · Kinosail</title>
<meta name="description" content="{{ page.description | escape }}">
{% if page.url == '/' %}<meta name="google-site-verification" content="CyK7nEwl7e61vmJVjO4nsO4JpjaeKGUMffYcSNcUhFg">{% endif %}
<meta property="og:title" content="{% if page.url == '/' %}Kinosail Player · Your media, on your own server{% else %}{{ page.title | escape }} · Kinosail{% endif %}">
<meta property="og:description" content="{{ page.description | escape }}">
<meta property="og:image" content="{{ '/assets/images/kinosail-share.png' | absolute_url }}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Kinosail Player sail mark and the words Your media, on your own server">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:image" content="{{ '/assets/images/kinosail-share.png' | absolute_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/assets/images/kinosail-mark.svg' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/marketing.css' | relative_url }}">
{% include seo.html %}
</head>
<body>
<a class="skip" href="#main-content">Skip to content</a>
<header class="masthead wrap">
<a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/images/kinosail-mark.svg' | relative_url }}" width="32" height="32" alt="">Kinosail</a>
<nav aria-label="Main navigation">
<a href="{{ '/why/' | relative_url }}">Why Kinosail</a>
<a href="https://github.com/Kinosail/kinosail">GitHub <span aria-hidden="true">↗</span></a>
<a href="https://kinosail-shop.fourthwall.com/">Player merch</a>
<a class="docs-primary" href="{{ '/docs/' | relative_url }}">Docs</a>
</nav>
</header>
<main id="main-content" tabindex="-1">{{ content }}</main>
<footer class="wrap footer">
<a class="brand" href="{{ '/' | relative_url }}">Kinosail</a>
<p>Your media, on your own server.</p>
<nav aria-label="Footer"><a href="{{ '/quickstart/' | relative_url }}">Install</a><a href="{{ '/docs/' | relative_url }}">Documentation</a><a href="https://github.com/Kinosail/kinosail/issues">Report a bug</a><a href="https://github.com/Kinosail/kinosail/blob/main/LICENSING.md">License</a></nav>
<small>Source-available. <a href="{{ '/why/' | relative_url }}">Read the project story.</a></small>
</footer>
</body>
</html>
