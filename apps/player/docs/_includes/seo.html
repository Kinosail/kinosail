<meta name="robots" content="index,follow,max-image-preview:large">
<meta property="og:site_name" content="Kinosail">
<meta name="twitter:card" content="summary_large_image">
<link rel="sitemap" type="application/xml" href="{{ '/sitemap.xml' | relative_url }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {"@type":"Organization","@id":{{ '/#organization' | absolute_url | jsonify }},"name":"Kinosail","url":{{ '/' | absolute_url | jsonify }},"sameAs":["https://github.com/Kinosail"]},
    {"@type":"WebSite","@id":{{ '/#website' | absolute_url | jsonify }},"name":"Kinosail","url":{{ '/' | absolute_url | jsonify }},"publisher":{"@id":{{ '/#organization' | absolute_url | jsonify }}}},
    {"@type":"WebPage","@id":{{ page.url | absolute_url | jsonify }},"url":{{ page.url | absolute_url | jsonify }},"name":{{ page.title | jsonify }},"description":{{ page.description | default: site.description | jsonify }},"isPartOf":{"@id":{{ '/#website' | absolute_url | jsonify }}},"inLanguage":"en"}
    {% if page.url == '/' %},
    {"@type":"SoftwareApplication","@id":{{ '/#player' | absolute_url | jsonify }},"name":"Kinosail Player","applicationCategory":"MultimediaApplication","operatingSystem":"Linux server; web browser client","url":{{ '/' | absolute_url | jsonify }},"description":"A self-hosted media server and web player for movies, shows, music, audiobooks, books, comics, and photos.","license":"https://github.com/Kinosail/kinosail/blob/main/LICENSING.md","downloadUrl":{{ '/quickstart/' | absolute_url | jsonify }},"screenshot":{{ '/assets/images/player-detail.webp' | absolute_url | jsonify }},"publisher":{"@id":{{ '/#organization' | absolute_url | jsonify }}}}
    {% endif %}
  ]
}
</script>
