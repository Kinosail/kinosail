<meta name="robots" content="{% if page.search == false %}noindex,follow{% else %}index,follow,max-image-preview:large{% endif %}">
<meta property="og:site_name" content="Kinosail">
<meta name="twitter:card" content="summary_large_image">
<link rel="sitemap" type="application/xml" href="{{ '/sitemap.xml' | relative_url }}">
{% assign breadcrumb_group = nil %}{% for group in site.data.navigation %}{% if group.title == page.section %}{% assign breadcrumb_group = group %}{% endif %}{% endfor %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {"@type":"Organization","@id":{{ '/#organization' | absolute_url | jsonify }},"name":"Kinosail","description":"Kinosail makes free, source-available apps for personal media on your own hardware: Kinosail Player for browsing and playback, and Kinosail Subtitles for subtitle automation.","url":{{ '/' | absolute_url | jsonify }},"logo":{{ '/assets/images/kinosail-mark.svg' | absolute_url | jsonify }},"sameAs":["https://github.com/Kinosail"]},
    {"@type":"WebSite","@id":{{ '/#website' | absolute_url | jsonify }},"name":"Kinosail","url":{{ '/' | absolute_url | jsonify }},"publisher":{"@id":{{ '/#organization' | absolute_url | jsonify }}}},
    {"@type":"WebPage","@id":{{ page.url | absolute_url | jsonify }},"url":{{ page.url | absolute_url | jsonify }},"name":{{ page.title | jsonify }},"description":{{ page.description | default: site.description | jsonify }},"isPartOf":{"@id":{{ '/#website' | absolute_url | jsonify }}},"inLanguage":"en"{% if page.url == '/' %},"mainEntity":{"@id":{{ '/#player' | absolute_url | jsonify }}}{% endif %}{% if page.url == '/products/' %},"about":[{"@id":{{ '/#player' | absolute_url | jsonify }}},{"@id":{{ '/subtitles/#subtitles' | absolute_url | jsonify }}}]{% endif %}}
    {% if page.section %},
    {"@type":"BreadcrumbList","itemListElement":[
      {"@type":"ListItem","position":1,"name":"Docs","item":{{ '/docs/' | absolute_url | jsonify }}}
      {% if breadcrumb_group and breadcrumb_group.url != page.url %},
      {"@type":"ListItem","position":2,"name":{{ breadcrumb_group.title | jsonify }},"item":{{ breadcrumb_group.url | absolute_url | jsonify }}}
      {% endif %},
      {"@type":"ListItem","position":{% if breadcrumb_group and breadcrumb_group.url != page.url %}3{% else %}2{% endif %},"name":{{ page.title | jsonify }},"item":{{ page.url | absolute_url | jsonify }}}
    ]}
    {% endif %}
    {% if page.url == '/' %},
    {"@type":"SoftwareApplication","@id":{{ '/#player' | absolute_url | jsonify }},"name":"Kinosail Player","alternateName":["Kinosail","Kinosail Media Server"],"applicationCategory":"MultimediaApplication","applicationSubCategory":"Self-hosted media server","operatingSystem":"Linux (Docker, amd64 and arm64); web browser client","url":{{ '/' | absolute_url | jsonify }},"description":"A free, self-hosted media server and web player for movies, shows, music, audiobooks, books, comics, and photos. It reads your existing media folders read-only and installs with Docker. Remote streaming and hardware transcoding are included at no cost.","isAccessibleForFree":true,"offers":{"@type":"Offer","price":0},"license":"https://github.com/Kinosail/kinosail/blob/main/LICENSING.md","downloadUrl":{{ '/quickstart/' | absolute_url | jsonify }},"installUrl":{{ '/quickstart/' | absolute_url | jsonify }},"softwareHelp":{"@type":"CreativeWork","url":{{ '/docs/' | absolute_url | jsonify }}},"sameAs":["https://github.com/Kinosail/kinosail"],"featureList":["Movies, TV shows, music, audiobooks, books, comics, and photos in one library","Direct play first, with transcoding only when a device needs it","Hardware transcoding with Intel Quick Sync, NVIDIA, AMD, VA-API, Apple VideoToolbox, and Rockchip","Remote streaming over your own HTTPS address with no relay or subscription","Viewer Profiles with per-library access, passkeys, and multi-factor authentication","Automatic intro, outro, and credits detection with skip controls","Watch Rooms for synchronized viewing","Import watched state from Plex and Jellyfin","Compatible Jellyfin mobile apps can connect","AirPlay, Google Cast, and DLNA playback to other devices","Versioned HTTP API and Model Context Protocol (MCP) server"],"screenshot":[{{ '/assets/images/player-library.webp' | absolute_url | jsonify }},{{ '/assets/images/player-movies.webp' | absolute_url | jsonify }},{{ '/assets/images/player-watch.webp' | absolute_url | jsonify }},{{ '/assets/images/player-detail.webp' | absolute_url | jsonify }}],"publisher":{"@id":{{ '/#organization' | absolute_url | jsonify }}}}
    {% endif %}
    {% if page.faq %},
    {"@type":"FAQPage","@id":{{ page.url | append: '#questions' | absolute_url | jsonify }},"isPartOf":{"@id":{{ page.url | absolute_url | jsonify }}},"mainEntity":[{% for item in page.faq %}{"@type":"Question","name":{{ item.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ item.a | strip_html | jsonify }}}}{% unless forloop.last %},{% endunless %}{% endfor %}]}
    {% endif %}
  ]
}
</script>
