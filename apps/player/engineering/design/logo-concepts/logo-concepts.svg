<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Five Kinosail logo directions</title>
  <desc id="desc">Five dark rounded-square app icon concepts using off-white and signal green.</desc>
  <rect width="1600" height="1120" fill="#090a08"/>
  <circle cx="1320" cy="-80" r="360" fill="#c8f169" opacity=".05"/>
  <text x="90" y="105" fill="#c8f169" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="5">KINOSAIL IDENTITY STUDY</text>
  <text x="90" y="175" fill="#f6f8ef" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="760" letter-spacing="-3">Five directions. One signal.</text>
  <text x="90" y="218" fill="#9ca391" font-family="Inter,Arial,sans-serif" font-size="22">Original vector marks designed to survive app icon, favicon, and wordmark use.</text>

  <g transform="translate(90 285)">
    <rect width="440" height="350" rx="28" fill="#12140f" stroke="#2a2d26"/>
    <g transform="translate(50 34) scale(.48)">
      <rect width="512" height="512" rx="112" fill="#090a08" stroke="#32362d" stroke-width="4"/>
      <path fill="#f6f8ef" d="M134 112h46v288h-46z"/>
      <path fill="#c8f169" d="m198 252 152-140 28 140z"/>
      <path fill="#f6f8ef" d="m198 278 180 122-42-122z"/>
    </g>
    <text x="320" y="92" fill="#c8f169" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">A</text>
    <text x="320" y="132" fill="#f6f8ef" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="750">Wake K</text>
    <text x="320" y="168" fill="#9ca391" font-family="Inter,Arial,sans-serif" font-size="17">K + sail</text>
    <text x="320" y="194" fill="#9ca391" font-family="Inter,Arial,sans-serif" font-size="17">Instantly ownable</text>
  </g>

  <g transform="translate(580 285)">
    <rect width="440" height="350" rx="28" fill="#12140f" stroke="#2a2d26"/>
    <g transform="translate(50 34) scale(.48)">
      <rect width="512" height="512" rx="112" fill="#090a08" stroke="#32362d" stroke-width="4"/>
      <circle cx="256" cy="256" r="138" fill="none" stroke="#c8f169" stroke-width="34"/>
      <path fill="#f6f8ef" d="m224 168 112 88-112 88z"/>
      <path fill="#090a08" d="M155 278h202v24H155z"/>
