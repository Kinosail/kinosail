    <text x="320" y="132" fill="#f6f8ef" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="750">Double Wake</text>
    <text x="320" y="168" fill="#9ca391" font-family="Inter,Arial,sans-serif" font-size="17">Playback + motion</text>
    <text x="320" y="194" fill="#9ca391" font-family="Inter,Arial,sans-serif" font-size="17">Expressive and fluid</text>
  </g>

  <g transform="translate(825 685)">
    <rect width="440" height="350" rx="28" fill="#12140f" stroke="#2a2d26"/>
    <g transform="translate(50 34) scale(.48)">
      <rect width="512" height="512" rx="112" fill="#090a08" stroke="#32362d" stroke-width="4"/>
      <path d="M118 286a138 138 0 0 1 276 0" fill="none" stroke="#c8f169" stroke-width="34" stroke-linecap="round"/>
      <path fill="#f6f8ef" d="m256 128 90 158H256z"/>
      <path d="M112 330h288" fill="none" stroke="#f6f8ef" stroke-width="30" stroke-linecap="round"/>
      <path d="M158 382h196" fill="none" stroke="#c8f169" stroke-width="18" stroke-linecap="round"/>
