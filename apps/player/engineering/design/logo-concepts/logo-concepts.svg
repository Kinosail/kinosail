    <text x="320" y="92" fill="#c8f169" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">B</text>
    <text x="320" y="132" fill="#f6f8ef" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="750">Signal Sail</text>
    <text x="320" y="168" fill="#9ca391" font-family="Inter,Arial,sans-serif" font-size="17">Stream + horizon</text>
    <text x="320" y="194" fill="#9ca391" font-family="Inter,Arial,sans-serif" font-size="17">Clean and digital</text>
  </g>

  <g transform="translate(1070 285)">
    <rect width="440" height="350" rx="28" fill="#12140f" stroke="#2a2d26"/>
    <g transform="translate(50 34) scale(.48)">
      <rect width="512" height="512" rx="112" fill="#090a08" stroke="#32362d" stroke-width="4"/>
