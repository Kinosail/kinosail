    <text x="320" y="92" fill="#c8f169" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">E</text>
    <text x="320" y="132" fill="#f6f8ef" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="750">Open Horizon</text>
    <text x="320" y="168" fill="#9ca391" font-family="Inter,Arial,sans-serif" font-size="17">Sail + sunrise</text>
    <text x="320" y="194" fill="#9ca391" font-family="Inter,Arial,sans-serif" font-size="17">Warm and cinematic</text>
