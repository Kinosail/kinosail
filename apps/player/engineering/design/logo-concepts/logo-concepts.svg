    <text x="320" y="132" fill="#f6f8ef" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="750">North Play</text>
    <text x="320" y="168" fill="#9ca391" font-family="Inter,Arial,sans-serif" font-size="17">Navigation + media</text>
    <text x="320" y="194" fill="#9ca391" font-family="Inter,Arial,sans-serif" font-size="17">Premium and iconic</text>
