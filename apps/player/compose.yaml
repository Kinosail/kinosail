services:
  kinosail:
    build:
      context: ../..
      dockerfile: apps/player/Containerfile
    image: localhost/kinosail:dev
    restart: unless-stopped
    init: true
    pids_limit: 256
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "${KINOSAIL_MANAGEMENT_BIND:-0.0.0.0}:51821:51821/udp"
      - "${KINOSAIL_BIND:-127.0.0.1}:${KINOSAIL_PORT:-38127}:38127"
    environment:
      KINOSAIL_CONFIG_FILE: "${KINOSAIL_CONFIG_FILE:-}"
      KINOSAIL_MEDIA_DIR: "${KINOSAIL_MEDIA_DIR:-}"
      KINOSAIL_DATA_DIR: "${KINOSAIL_DATA_DIR:-}"
      KINOSAIL_CACHE_DIR: "${KINOSAIL_CACHE_DIR:-}"
      KINOSAIL_FFMPEG: "${KINOSAIL_FFMPEG:-}"
      KINOSAIL_FFPROBE: "${KINOSAIL_FFPROBE:-}"
      KINOSAIL_FPCALC: "${KINOSAIL_FPCALC:-}"
      KINOSAIL_AUTH_URL: "${KINOSAIL_AUTH_URL:-}"
      KINOSAIL_TLS_ENABLED: "${KINOSAIL_TLS_ENABLED:-}"
      KINOSAIL_TLS_HOSTS: "${KINOSAIL_TLS_HOSTS:-}"
      KINOSAIL_SERVER_NAME: "${KINOSAIL_SERVER_NAME:-}"
      KINOSAIL_SUPPORTER_ACTIVATION_URL: "${KINOSAIL_SUPPORTER_ACTIVATION_URL:-}"
      KINOSAIL_SUPPORT_URL: "${KINOSAIL_SUPPORT_URL:-}"
      KINOSAIL_REQUIRE_MFA: "${KINOSAIL_REQUIRE_MFA:-}"
      KINOSAIL_LIBRARIES: "${KINOSAIL_LIBRARIES:-}"
      KINOSAIL_PLAYBACK_MODE: "${KINOSAIL_PLAYBACK_MODE:-}"
      KINOSAIL_AUTOPLAY: "${KINOSAIL_AUTOPLAY:-}"
      KINOSAIL_SUBTITLES: "${KINOSAIL_SUBTITLES:-}"
      KINOSAIL_AUTO_SKIP: "${KINOSAIL_AUTO_SKIP:-}"
      KINOSAIL_TRANSCODE_QUALITY: "${KINOSAIL_TRANSCODE_QUALITY:-}"
      KINOSAIL_TRANSCODE_CODEC: "${KINOSAIL_TRANSCODE_CODEC:-}"
      KINOSAIL_TRANSCODE_ACCELERATOR: "${KINOSAIL_TRANSCODE_ACCELERATOR:-}"
      KINOSAIL_TONE_MAP: "${KINOSAIL_TONE_MAP:-}"
      KINOSAIL_SUBTITLE_LANGUAGE: "${KINOSAIL_SUBTITLE_LANGUAGE:-}"
      KINOSAIL_JELLYFIN_ENABLED: "${KINOSAIL_JELLYFIN_ENABLED:-}"
      KINOSAIL_HOME_ASSISTANT_ENABLED: "${KINOSAIL_HOME_ASSISTANT_ENABLED:-}"
      KINOSAIL_SCAN_INTERVAL: "${KINOSAIL_SCAN_INTERVAL:-}"
      KINOSAIL_SCAN_FREQUENCY: "${KINOSAIL_SCAN_FREQUENCY:-}"
      KINOSAIL_DLNA_URL: "${KINOSAIL_DLNA_URL:-}"
      KINOSAIL_DLNA_ENABLED: "${KINOSAIL_DLNA_ENABLED:-}"
      KINOSAIL_HOSTNAME: "${KINOSAIL_HOSTNAME:-}"
      KINOSAIL_PROXY_TOKEN: "${KINOSAIL_PROXY_TOKEN:-}"
      KINOSAIL_PROXY_TOKEN_FILE: "${KINOSAIL_PROXY_TOKEN_FILE:-}"
      KINOSAIL_REMOTE_MODE: "${KINOSAIL_REMOTE_MODE:-}"
      KINOSAIL_DUCKDNS_DOMAIN: "${KINOSAIL_DUCKDNS_DOMAIN:-}"
      KINOSAIL_DUCKDNS_TOKEN: "${KINOSAIL_DUCKDNS_TOKEN:-}"
      KINOSAIL_DUCKDNS_TOKEN_FILE: "${KINOSAIL_DUCKDNS_TOKEN_FILE:-}"
      KINOSAIL_REMOTE_LISTEN: "${KINOSAIL_REMOTE_LISTEN:-}"
      KINOSAIL_WIREGUARD_DIR: "${KINOSAIL_WIREGUARD_DIR:-}"
      KINOSAIL_WEBHOOK_URL: "${KINOSAIL_WEBHOOK_URL:-}"
      KINOSAIL_WEBHOOK_TOKEN: "${KINOSAIL_WEBHOOK_TOKEN:-}"
      KINOSAIL_WEBHOOK_TOKEN_FILE: "${KINOSAIL_WEBHOOK_TOKEN_FILE:-}"
      KINOSAIL_OIDC_ISSUER: "${KINOSAIL_OIDC_ISSUER:-}"
      KINOSAIL_OIDC_CLIENT_ID: "${KINOSAIL_OIDC_CLIENT_ID:-}"
      KINOSAIL_OIDC_CLIENT_SECRET: "${KINOSAIL_OIDC_CLIENT_SECRET:-}"
      KINOSAIL_OIDC_CLIENT_SECRET_FILE: "${KINOSAIL_OIDC_CLIENT_SECRET_FILE:-}"
      KINOSAIL_OIDC_REDIRECT_URL: "${KINOSAIL_OIDC_REDIRECT_URL:-}"
      KINOSAIL_OIDC_IDENTITY_CLAIM: "${KINOSAIL_OIDC_IDENTITY_CLAIM:-}"
      KINOSAIL_SAML_METADATA_URL: "${KINOSAIL_SAML_METADATA_URL:-}"
      KINOSAIL_SAML_METADATA_XML: "${KINOSAIL_SAML_METADATA_XML:-}"
      KINOSAIL_SAML_IDENTITY_ATTRIBUTE: "${KINOSAIL_SAML_IDENTITY_ATTRIBUTE:-}"
      KINOSAIL_SCIM_TOKEN: "${KINOSAIL_SCIM_TOKEN:-}"
      KINOSAIL_SCIM_TOKEN_FILE: "${KINOSAIL_SCIM_TOKEN_FILE:-}"
      KINOSAIL_SCIM_TOKEN_EXPIRES_AT: "${KINOSAIL_SCIM_TOKEN_EXPIRES_AT:-}"
      KINOSAIL_MCP_RESOURCE_URL: "${KINOSAIL_MCP_RESOURCE_URL:-}"
      KINOSAIL_MCP_AUTHORIZATION_SERVER: "${KINOSAIL_MCP_AUTHORIZATION_SERVER:-}"
      KINOSAIL_MCP_INTROSPECTION_URL: "${KINOSAIL_MCP_INTROSPECTION_URL:-}"
      KINOSAIL_MCP_CLIENT_ID: "${KINOSAIL_MCP_CLIENT_ID:-}"
      KINOSAIL_MCP_CLIENT_SECRET: "${KINOSAIL_MCP_CLIENT_SECRET:-}"
      KINOSAIL_MCP_CLIENT_SECRET_FILE: "${KINOSAIL_MCP_CLIENT_SECRET_FILE:-}"
      KINOSAIL_SUBDL_URL: "${KINOSAIL_SUBDL_URL:-}"
      KINOSAIL_SUBDL_API_KEY: "${KINOSAIL_SUBDL_API_KEY:-}"
      KINOSAIL_SUBDL_API_KEY_FILE: "${KINOSAIL_SUBDL_API_KEY_FILE:-}"
      KINOSAIL_TMDB_URL: "${KINOSAIL_TMDB_URL:-}"
      KINOSAIL_TMDB_IMAGE_URL: "${KINOSAIL_TMDB_IMAGE_URL:-}"
      KINOSAIL_TMDB_TOKEN: "${KINOSAIL_TMDB_TOKEN:-}"
      KINOSAIL_TMDB_TOKEN_FILE: "${KINOSAIL_TMDB_TOKEN_FILE:-}"
      KINOSAIL_BACKUP_DIR: "${KINOSAIL_BACKUP_DIR:-}"
      KINOSAIL_BACKUP_KEY: "${KINOSAIL_BACKUP_KEY:-}"
      KINOSAIL_BACKUP_KEY_FILE: "${KINOSAIL_BACKUP_KEY_FILE:-}"
      KINOSAIL_BACKUP_INTERVAL: "${KINOSAIL_BACKUP_INTERVAL:-}"
      KINOSAIL_BACKUP_RETENTION: "${KINOSAIL_BACKUP_RETENTION:-}"
      KINOSAIL_LOG_LEVEL: "${KINOSAIL_LOG_LEVEL:-}"
      KINOSAIL_AUDIT_RETENTION: "${KINOSAIL_AUDIT_RETENTION:-}"
      KINOSAIL_PLAYBACK_RETENTION: "${KINOSAIL_PLAYBACK_RETENTION:-}"
    volumes:
      - kinosail-config:/config
      - kinosail-cache:/cache
      - "${KINOSAIL_BACKUP_PATH:-kinosail-backups}:/backups"
      - "${KINOSAIL_MEDIA_PATH:-./media}:/media:ro"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m

volumes:
  kinosail-config:
  kinosail-cache:
  kinosail-backups:
