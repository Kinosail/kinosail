services:
  dashboard:
    build:
      context: ../..
      dockerfile: apps/dashboard/Containerfile
    image: localhost/kinosail-dashboard:dev
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    ports:
      - "${KINOSAIL_DASHBOARD_BIND:-127.0.0.1}:${KINOSAIL_DASHBOARD_PORT:-38400}:38400"
    environment:
      KINOSAIL_DASHBOARD_LISTEN: ":38400"
      KINOSAIL_DASHBOARD_DATA_DIR: "/config"
      KINOSAIL_DASHBOARD_PUBLIC_PROBE_HOSTS: "${KINOSAIL_DASHBOARD_PUBLIC_PROBE_HOSTS:-}"
      KINOSAIL_DASHBOARD_TRUSTED_HOSTS: "${KINOSAIL_DASHBOARD_TRUSTED_HOSTS:-}"
      KINOSAIL_DASHBOARD_SECURE_COOKIES: "${KINOSAIL_DASHBOARD_SECURE_COOKIES:-false}"
      KINOSAIL_DASHBOARD_PUBLIC_URL: "${KINOSAIL_DASHBOARD_PUBLIC_URL:-}"
      KINOSAIL_SUPPORTER_ACTIVATION_URL: "${KINOSAIL_SUPPORTER_ACTIVATION_URL:-}"
      KINOSAIL_SUPPORTER_URL: "${KINOSAIL_SUPPORTER_URL:-}"
    volumes:
      - dashboard-config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m

volumes:
  dashboard-config:
