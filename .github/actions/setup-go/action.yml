name: Set up Go from the workspace toolchain
description: Use the runner's Go to fetch the go.work toolchain from proxy.golang.org and restore module and build caches
inputs:
  go-version-file:
    description: Module or workspace file whose toolchain the checkout requires
    required: true
  cache-dependency-path:
    description: Glob of dependency files that key the Go caches
    default: "**/go.sum"
runs:
  using: composite
  steps:
    - id: paths
      shell: bash
      env:
        GOTOOLCHAIN: auto
        VERSION_FILE: ${{ inputs.go-version-file }}
      run: |
        test -f "$VERSION_FILE"
        echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "buildcache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ${{ steps.paths.outputs.modcache }}
          ${{ steps.paths.outputs.buildcache }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.work', inputs.cache-dependency-path) }}
        restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      env:
        GOTOOLCHAIN: auto
      run: go version
