name: Set up Go from the workspace toolchain
description: Put the exact go.work toolchain from go.dev first on PATH and restore the toolchain, module, and build caches saved by main
inputs:
  go-version-file:
    description: Module or workspace file whose toolchain the checkout requires
    required: true
  cache-dependency-path:
    description: Glob of dependency files that key the Go caches
    default: "**/go.sum"
  cache-scope:
    description: Job family whose main-push warm job saves the complete module and build cache
    default: shared
outputs:
  cache-key:
    description: Exact cache key for this scope and dependency set
    value: ${{ steps.key.outputs.key }}
  cache-paths:
    description: Toolchain, module, and build cache directories, one per line
    value: ${{ steps.key.outputs.paths }}
runs:
  using: composite
  steps:
    - id: paths
      shell: bash
      env:
        VERSION_FILE: ${{ inputs.go-version-file }}
      run: |
        set -euo pipefail
        test -f "$VERSION_FILE"
        version="$(sed -n 's/^go \([0-9][0-9.]*\).*/\1/p' go.work | head -n 1)"
        [[ "$version" =~ ^1\.[0-9]+(\.[0-9]+)?$ ]]
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) platform=linux-amd64; buildcache="$HOME/.cache/go-build" ;;
          Linux-aarch64) platform=linux-arm64; buildcache="$HOME/.cache/go-build" ;;
          Darwin-arm64) platform=darwin-arm64; buildcache="$HOME/Library/Caches/go-build" ;;
          Darwin-x86_64) platform=darwin-amd64; buildcache="$HOME/Library/Caches/go-build" ;;
          *) echo "unsupported runner platform" >&2; exit 1 ;;
        esac
        toolchain="$RUNNER_TOOL_CACHE/go/$version/${platform#*-}"
        modcache="$HOME/go/pkg/mod"
        printf 'GOMODCACHE=%s\nGOCACHE=%s\n' "$modcache" "$buildcache" >> "$GITHUB_ENV"
        printf '%s\n%s\n' "$toolchain/bin" "$HOME/go/bin" >> "$GITHUB_PATH"
        printf 'version=%s\nplatform=%s\ntoolchain=%s\nmodcache=%s\nbuildcache=%s\n' \
          "$version" "$platform" "$toolchain" "$modcache" "$buildcache" >> "$GITHUB_OUTPUT"
    - id: key
      shell: bash
      env:
        PREFIX: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}
        SCOPE: ${{ inputs.cache-scope }}
        DEPENDENCIES: ${{ hashFiles(inputs.cache-dependency-path) }}
        TOOLCHAIN: ${{ steps.paths.outputs.toolchain }}
        MODCACHE: ${{ steps.paths.outputs.modcache }}
        BUILDCACHE: ${{ steps.paths.outputs.buildcache }}
      run: |
        set -euo pipefail
        [[ "$SCOPE" =~ ^[a-z][a-z0-9-]{0,31}$ ]]
        [[ "$DEPENDENCIES" =~ ^[0-9a-f]{64}$ ]]
        printf 'key=%s-%s-%s\n' "$PREFIX" "$SCOPE" "$DEPENDENCIES" >> "$GITHUB_OUTPUT"
        printf 'scoped=%s-%s-\n' "$PREFIX" "$SCOPE" >> "$GITHUB_OUTPUT"
        printf 'shared=%s-\n' "$PREFIX" >> "$GITHUB_OUTPUT"
        printf 'paths<<EOF\n%s\n%s\n%s\nEOF\n' "$TOOLCHAIN" "$MODCACHE" "$BUILDCACHE" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.key.outputs.paths }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          ${{ steps.key.outputs.scoped }}
          ${{ steps.key.outputs.shared }}
    - shell: bash
      env:
        VERSION: ${{ steps.paths.outputs.version }}
        PLATFORM: ${{ steps.paths.outputs.platform }}
        TOOLCHAIN: ${{ steps.paths.outputs.toolchain }}
      run: |
        set -euo pipefail
        if [[ ! -x "$TOOLCHAIN/bin/go" ]]; then
          archive="go$VERSION.$PLATFORM.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --max-time 300 \
            --output "$RUNNER_TEMP/$archive" "https://go.dev/dl/$archive"
          expected="$(curl --fail --silent --show-error --proto '=https' --max-time 60 \
            "https://go.dev/dl/?mode=json&include=all" | python3 -c '
        import json, sys
        archive = sys.argv[1]
        print(next(file["sha256"] for release in json.load(sys.stdin) for file in release["files"] if file["filename"] == archive))' "$archive")"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$archive" | shasum -a 256 --check --status
          rm -rf "$TOOLCHAIN"
          mkdir -p "$TOOLCHAIN"
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$TOOLCHAIN" --strip-components 1
          rm -f "$RUNNER_TEMP/$archive"
        fi
        test "$(command -v go)" = "$TOOLCHAIN/bin/go"
        test "$(go env GOVERSION)" = "go$VERSION"
        go version
