version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /packages
      - /apps/player
      - /apps/subtitles
      - /scripts/quality/metrics
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /apps/player/e2e
      - /apps/subtitles/e2e
      - /engineering/documentation
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /scripts/quality
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /apps/player
      - /apps/subtitles
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 1
    exclude-paths:
      - Containerfile.test
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: bundler
    directory: /engineering/documentation
    schedule:
      interval: weekly
      day: thursday
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /apps/player/apps/android
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: org.jetbrains.kotlinx:kotlinx-coroutines-play-services
        versions: ["1.12.0"]
