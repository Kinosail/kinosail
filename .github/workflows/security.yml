name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 8 * * 1"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  secrets:
    name: Changed-commit secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: python3 scripts/ci/secrets.py

  codeql:
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    timeout-minutes: ${{ matrix.language == 'swift' && 60 || 15 }}
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: matrix.language == 'go'
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Assemble complete browser source for CodeQL
        if: matrix.language == 'javascript-typescript'
        run: |
          node scripts/ci/prepare-codeql-js.mjs
          # Generated bundles are untracked, so analyze their complete contents.
          echo 'CODEQL_ACTION_DIFF_INFORMED_QUERIES=false' >> "$GITHUB_ENV"
          echo 'CODEQL_OVERLAY_DATABASE_MODE=none' >> "$GITHUB_ENV"
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql-config.yml
          build-mode: ${{ (matrix.language == 'go' || matrix.language == 'swift') && 'manual' || 'none' }}
          queries: security-extended
      - name: Build Go modules for CodeQL
        if: matrix.language == 'go'
        run: go build ./apps/player/... ./apps/subtitles/... ./apps/dashboard/... ./packages/...
      - name: Build both Apple clients for CodeQL
        if: matrix.language == 'swift'
        run: |
          # Match the Swift extractor's supported compiler settings.
          printf '%s\n' 'ARCHS = arm64' 'ONLY_ACTIVE_ARCH = YES' \
            'COMPILATION_CACHE_ENABLE_CACHING = NO' 'SWIFT_ENABLE_COMPILE_CACHE = NO' \
            'SWIFT_USE_INTEGRATED_DRIVER = NO' 'CODE_SIGNING_ALLOWED = NO' \
            'CODE_SIGNING_REQUIRED = NO' > "$RUNNER_TEMP/codeql.xcconfig"
          # Keep bounded resource evidence for slow compiler/extractor runs.
          python3 -u -c '
          import datetime, subprocess, time
          while True:
              print(datetime.datetime.now(datetime.timezone.utc).isoformat())
              rows = subprocess.check_output(["ps", "-axo", "pid=,ppid=,pcpu=,rss=,comm="], text=True).splitlines()
              print("PID PPID CPU% RSS_KiB COMMAND")
              print("\n".join(sorted(rows, key=lambda row: int(row.split(None, 4)[3]), reverse=True)[:12]))
              subprocess.run(["sysctl", "vm.swapusage"], check=True)
              time.sleep(60)
          ' &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          # The iOS and tvOS targets use separate derived-data paths; build them
          # concurrently so the required Swift scan stays within its CI budget.
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/codeql.xcconfig" make -C apps/player -j2 client-build-ios client-build-tvos
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd

  supply-chain:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).supply
    timeout-minutes: 15
    name: Supply chain security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294

  findings:
    name: CodeQL findings policy
    needs: [changes, codeql]
    if: needs.changes.outputs.languages != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Reject open code scanning security alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/code-scanning/alerts" \
            -f state=open -f ref="$GITHUB_REF" -f tool_name=CodeQL -f per_page=100 > alerts.json
          jq -e '[.[][] | select(.rule.security_severity_level != null)] | length == 0' alerts.json

  required:
    name: Security checks
    if: always()
    needs: [changes, secrets, codeql, supply-chain, findings]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/required.py security
