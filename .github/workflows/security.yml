name: Security

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
      languages:
        required: true
        type: string

permissions:
  contents: read

jobs:

  secrets:
    name: Changed-commit secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: python3 scripts/ci/secrets.py

  codeql:
    if: inputs.languages != '[]'
    timeout-minutes: 15
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: matrix.language == 'go'
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Assemble complete browser source for CodeQL
        if: matrix.language == 'javascript-typescript'
        run: |
          node scripts/ci/prepare-codeql-js.mjs
          # Generated bundles are untracked, so analyze their complete contents.
          echo 'CODEQL_ACTION_DIFF_INFORMED_QUERIES=false' >> "$GITHUB_ENV"
          echo 'CODEQL_OVERLAY_DATABASE_MODE=none' >> "$GITHUB_ENV"
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql-config.yml
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
          queries: security-extended
      - name: Build Go modules for CodeQL
        if: matrix.language == 'go'
        run: go build ./apps/player/... ./apps/subtitles/... ./apps/dashboard/... ./packages/...
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd

  swift:
    name: CodeQL Swift (${{ matrix.platform }})
    if: fromJSON(inputs.plan).swift
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: swift
          build-mode: manual
          config-file: .github/codeql-config.yml
          queries: security-extended
      - name: Build one Apple target with bounded compiler concurrency
        env:
          PLATFORM: ${{ matrix.platform }}
        run: ./scripts/ci/build-codeql-swift.sh "$PLATFORM"
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          category: /language:swift/platform:${{ matrix.platform }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: codeql-swift-${{ matrix.platform }}
          path: ${{ runner.temp }}/codeql-swift-*.log
          if-no-files-found: ignore
          retention-days: 7

  supply-chain:
    if: fromJSON(inputs.plan).supply
    timeout-minutes: 15
    name: Supply chain security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294

  findings:
    name: CodeQL findings policy
    needs: [codeql, swift]
    if: always() && (inputs.languages != '[]' || fromJSON(inputs.plan).swift) && (needs.codeql.result == 'success' || needs.codeql.result == 'skipped') && (needs.swift.result == 'success' || needs.swift.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Reject open code scanning security alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/code-scanning/alerts" \
            -f state=open -f ref="$GITHUB_REF" -f tool_name=CodeQL -f per_page=100 > alerts.json
          jq -e '[.[][] | select(.rule.security_severity_level != null)] | length == 0' alerts.json

  required:
    name: Security checks
    if: always()
    needs: [secrets, codeql, swift, supply-chain, findings]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          RESULTS: ${{ toJSON(needs) }}
          CI_PLAN: ${{ inputs.plan }}
        run: python3 scripts/ci/required.py security
