name: App suite

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      plan:
        required: true
        type: string
      coverage_diagnostic:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  static:
    name: ${{ inputs.app }} lint and module contract
    if: fromJSON(inputs.plan)[inputs.app]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: apps/${{ inputs.app }}/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.13.1
          working-directory: apps/${{ inputs.app }}
          args: --timeout=5m --new-from-rev=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'HEAD~1' }}
      - run: make single-container tidy-check

  race:
    name: ${{ inputs.app }} Go tests
    if: fromJSON(inputs.plan)[inputs.app]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: apps/${{ inputs.app }}/go.mod
          cache-dependency-path: "**/go.sum"
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - env:
          APP: ${{ inputs.app }}
          KINOSAIL_GO_TEST_MODE: ${{ fromJSON(inputs.plan).deep && 'deep' || 'quick' }}
        run: ./scripts/ci/test-go.sh "$APP"
      - name: Summarize exact deep coverage
        if: always() && github.event_name == 'workflow_dispatch' && inputs.coverage_diagnostic && fromJSON(inputs.plan).deep
        working-directory: apps/${{ inputs.app }}
        run: go tool cover -func=.verification/coverage.out > .verification/coverage-functions.txt
      - name: Keep exact deep coverage profiles
        if: always() && github.event_name == 'workflow_dispatch' && inputs.coverage_diagnostic && fromJSON(inputs.plan).deep
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.app }}-go-coverage-${{ github.sha }}
          path: |
            apps/${{ inputs.app }}/.verification/coverage.out
            apps/${{ inputs.app }}/.verification/coverage-functions.txt
          if-no-files-found: error
          retention-days: 3

  security:
    name: ${{ inputs.app }} Go vulnerabilities
    if: fromJSON(inputs.plan)[inputs.app]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: apps/${{ inputs.app }}/go.mod
          cache-dependency-path: "**/go.sum"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  tooling:
    name: ${{ inputs.app }} installer and local pipeline
    if: fromJSON(inputs.plan)[format('{0}_tools', inputs.app)]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: apps/${{ inputs.app }}/go.mod
          cache-dependency-path: "**/go.sum"
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.22.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/${{ inputs.app }}/e2e/pnpm-lock.yaml
      - run: pnpm --dir e2e install --frozen-lockfile
      - run: make installer-test native-build local-pipeline-test

  client:
    name: Player Swift compilation
    if: inputs.app == 'player' && fromJSON(inputs.plan).client
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: make -C apps/player client-check
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.1_beta.app/Contents/Developer

  android:
    name: Player Android compilation
    if: inputs.app == 'player' && fromJSON(inputs.plan).android
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-37.0'
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :watchcore:testDebugUnitTest :wear:assembleDebug :wear:testDebugUnitTest
        working-directory: apps/player/apps/android

  system:
    name: ${{ inputs.app }} production container (${{ matrix.platform }})
    if: fromJSON(inputs.plan)[inputs.app]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(fromJSON(inputs.plan)[format('{0}_arm', inputs.app)] && '[{"platform":"linux/amd64","runner":"ubuntu-24.04"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]' || '[{"platform":"linux/amd64","runner":"ubuntu-24.04"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/${{ inputs.app }}/Containerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ inputs.app }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}-${{ matrix.platform }}
          load: true
          push: false
          tags: localhost/kinosail-${{ inputs.app }}:${{ github.sha }}
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: localhost/kinosail-${{ inputs.app }}:${{ github.sha }}
          cache-dir: ${{ runner.temp }}/trivy-${{ inputs.app }}-${{ matrix.runner }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Test production paths
        working-directory: apps/${{ inputs.app }}
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_TEST_IMAGE: localhost/kinosail-${{ inputs.app }}:${{ github.sha }}
          KINOSAIL_TEST_IMAGE_READY: "1"
        run: python3 ../../scripts/ci/e2e-artifact.py --output "${{ runner.temp }}/${{ inputs.app }}-${{ matrix.runner }}-system-e2e-artifact" -- ./scripts/test-container.sh
      - name: Keep verifiable system E2E artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.app }}-${{ matrix.runner }}-system-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/${{ inputs.app }}-${{ matrix.runner }}-system-e2e-artifact
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
  browser:
    name: ${{ inputs.app }} populated browser (${{ matrix.engine }})
    if: fromJSON(inputs.plan)[inputs.app]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(fromJSON(inputs.plan).deep && '["chromium","firefox","webkit"]' || '["chromium"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.22.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          package-manager-cache: false
      - env:
          APP: ${{ inputs.app }}
        run: pnpm --dir "apps/$APP/e2e" install --frozen-lockfile
      - env:
          APP: ${{ inputs.app }}
          BROWSERS: ${{ matrix.engine == 'full' && 'chromium firefox webkit' || matrix.engine }}
        run: |
          read -ra browsers <<< "$BROWSERS"
          pnpm --dir "apps/$APP/e2e" exec playwright install --with-deps "${browsers[@]}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/${{ inputs.app }}/Containerfile
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ inputs.app }}-linux/amd64
          load: true
          push: false
          tags: localhost/kinosail-${{ inputs.app }}:${{ github.sha }}
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
      - name: Test populated browsers
        working-directory: apps/${{ inputs.app }}
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_BROWSER_TEST: "1"
          KINOSAIL_BROWSER_MATRIX: ${{ fromJSON(inputs.plan).deep && 'full' || '' }}
          KINOSAIL_BROWSER_PROJECT: ${{ matrix.engine }}
          KINOSAIL_BROWSER_SMOKE: ${{ !fromJSON(inputs.plan).deep && '1' || '' }}
          KINOSAIL_BROWSER_WORKERS: ${{ inputs.app == 'player' && '3' || '1' }}
          KINOSAIL_E2E_OUTPUT_DIR: ${{ runner.temp }}/${{ inputs.app }}-${{ matrix.engine }}-e2e-artifact/browser-results
          KINOSAIL_TEST_IMAGE: localhost/kinosail-${{ inputs.app }}:${{ github.sha }}
          KINOSAIL_TEST_IMAGE_READY: "1"
        run: python3 ../../scripts/ci/e2e-artifact.py --output "${{ runner.temp }}/${{ inputs.app }}-${{ matrix.engine }}-e2e-artifact" -- ./scripts/test-container.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: matrix.engine == 'chromium'
        with:
          go-version-file: apps/player/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Install startup fixture codecs
        if: inputs.app == 'player' && matrix.engine == 'chromium'
        run: |
          curl --fail --location --proto '=https' --max-time 120 --output "$RUNNER_TEMP/startup-ffmpeg.deb" https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v8.1.2-5/jellyfin-ffmpeg8_8.1.2-5-noble_amd64.deb
          printf '%s  %s\n' b4e72894ad26c809ed0104805f5415a97be75212b9fcf9d60b89ad25bb3d43e3 "$RUNNER_TEMP/startup-ffmpeg.deb" | sha256sum --check
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "$RUNNER_TEMP/startup-ffmpeg.deb"
          echo /usr/lib/jellyfin-ffmpeg >> "$GITHUB_PATH"
      - name: Install public-flow runner
        if: matrix.engine == 'chromium'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          pnpm --dir scripts/e2e install --frozen-lockfile
      - name: Verify complete Player recovery suites
        if: inputs.app == 'player' && matrix.engine == 'chromium'
        env:
          KINOSAIL_E2E_VIDEO: "off"
        run: python3 scripts/ci/e2e-artifact.py --output "${{ runner.temp }}/player-recovery-e2e-artifact" -- pnpm --dir apps/player/e2e exec playwright test passkeys.spec.ts worker-message-security.spec.ts player-experience.spec.ts player-direct-fallback.spec.ts --trace off --workers=1
      - name: Keep Player recovery evidence
        if: always() && inputs.app == 'player' && matrix.engine == 'chromium'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: player-recovery-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/player-recovery-e2e-artifact/
          retention-days: 30
          if-no-files-found: error
      - name: Verify public flows with tester-army e2e
        if: matrix.engine == 'chromium'
        env:
          APP: ${{ inputs.app }}
          E2E_TELEMETRY_DISABLED: "1"
        run: scripts/e2e/run.sh "$APP"
      - name: Keep public-flow evidence
        if: always() && matrix.engine == 'chromium'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.app }}-public-flow-e2e-${{ github.sha }}
          include-hidden-files: true
          path: scripts/e2e/.e2e/runs/
          retention-days: 30
          if-no-files-found: error
      - name: Verify bounded startup and request boundary
        if: inputs.app == 'player' && matrix.engine == 'chromium'
        env:
          GOMAXPROCS: "4"
          KINOSAIL_STARTUP_BROWSER_CHANNEL: chromium
        run: python3 apps/player/scripts/test-startup-local.py
      - name: Verify bounded HLS phase evidence
        if: always() && inputs.app == 'player' && matrix.engine == 'chromium'
        run: python3 apps/player/scripts/hls-phase-evidence.py
      - name: Keep safe startup evidence
        if: always() && inputs.app == 'player' && matrix.engine == 'chromium'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: player-startup-boundary-evidence
          include-hidden-files: true
          path: |
            .verification/startup/*/receipt.json
            .verification/startup/*/hls-phases.json
            .verification/startup/*/hls-phases.sha256
            .verification/startup/*/resources.json
            .verification/startup/*/SHA256SUMS
            .verification/startup/*/results/**/startup-measurements.json
          retention-days: 7
          if-no-files-found: error
      - name: Keep verifiable E2E artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.app }}-${{ matrix.engine }}-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/${{ inputs.app }}-${{ matrix.engine }}-e2e-artifact
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true

  required:
    name: ${{ inputs.app }} suite complete
    if: always()
    needs: [static, race, security, tooling, client, android, system, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          CI_APP: ${{ inputs.app }}
          CI_PLAN: ${{ inputs.plan }}
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/required.py app
