name: App suite

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      plan:
        required: true
        type: string
      native_probe:
        type: string
        default: none
      coverage_diagnostic:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  static:
    name: ${{ inputs.app }} lint and module contract
    if: fromJSON(inputs.plan)[inputs.app]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: apps/${{ inputs.app }}/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.13.1
          working-directory: apps/${{ inputs.app }}
          args: --timeout=5m --new-from-rev=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'HEAD~1' }}
      - run: make single-container tidy-check

  race:
    name: ${{ inputs.app }} Go tests
    if: fromJSON(inputs.plan)[inputs.app]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: apps/${{ inputs.app }}/go.mod
          cache-dependency-path: "**/go.sum"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools ffmpeg
      - run: ffmpeg -version && ffprobe -version
      - env:
          APP: ${{ inputs.app }}
          KINOSAIL_GO_TEST_MODE: ${{ fromJSON(inputs.plan).deep && 'deep' || 'quick' }}
        run: ./scripts/ci/test-go.sh "$APP"
      - name: Summarize exact deep coverage
        if: always() && fromJSON(inputs.plan).deep
        working-directory: apps/${{ inputs.app }}
        run: go tool cover -func=.verification/coverage.out > .verification/coverage-functions.txt
      - name: Keep exact deep coverage profiles
        if: always() && fromJSON(inputs.plan).deep
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.app }}-go-coverage-${{ github.sha }}
          path: |
            apps/${{ inputs.app }}/.verification/coverage.out
            apps/${{ inputs.app }}/.verification/coverage-functions.txt
          if-no-files-found: error
          retention-days: 3

  security:
    name: ${{ inputs.app }} Go vulnerabilities
    if: fromJSON(inputs.plan)[inputs.app]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: apps/${{ inputs.app }}/go.mod
          cache-dependency-path: "**/go.sum"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  tooling:
    name: ${{ inputs.app }} installer and local pipeline
    if: fromJSON(inputs.plan)[format('{0}_tools', inputs.app)]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: apps/${{ inputs.app }}/go.mod
          cache-dependency-path: "**/go.sum"
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.22.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/${{ inputs.app }}/e2e/pnpm-lock.yaml
      - run: pnpm --dir e2e install --frozen-lockfile
      - run: make installer-test native-build local-pipeline-test

  client:
    name: Player Swift compilation
    if: inputs.app == 'player' && fromJSON(inputs.plan).client
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: make -C apps/player client-check
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.1_beta.app/Contents/Developer
      - name: Prepare decoded native media fixture
        if: fromJSON(inputs.plan).deep
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          media="$RUNNER_TEMP/native-media.mp4"
          ffmpeg -nostdin -v error -f lavfi -i testsrc2=s=320x180:r=12:d=12 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=12 \
            -c:v libx264 -threads 1 -preset ultrafast -crf 38 -pix_fmt yuv420p \
            -c:a aac -b:a 48k -movflags +faststart -shortest "$media"
          test "$(stat -f %z "$media")" -le 1048576
          shasum -a 256 "$media" > "$RUNNER_TEMP/native-media.sha256"
          ffprobe -v error -show_format -show_streams -of json "$media" > "$RUNNER_TEMP/native-media.json"
          for name in kinosail-appletv-task7-media.mp4 kinosail-player-buffer-bar.mp4 kinosail-landscape-task10-media.mp4; do
            ln "$media" "/tmp/$name"
          done
      - name: Execute iOS and tvOS native contracts
        if: fromJSON(inputs.plan).deep
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.1_beta.app/Contents/Developer
        run: |
          native_failed=0
          for platform in iOS tvOS; do
            device="$(xcrun simctl list devices available --json | python3 scripts/ci/select-simulator.py "$platform")"
            if ! xcodebuild test -project apps/player/apps/native/Kinosail.xcodeproj \
              -scheme "Kinosail-$platform" -destination "id=$device" \
              -derivedDataPath "apps/player/apps/native/.build/$([[ "$platform" == iOS ]] && echo ios || echo tvos)-simulator" \
              -resultBundlePath "$RUNNER_TEMP/native-$platform.xcresult" \
              -parallel-testing-enabled NO -collect-test-diagnostics never CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-; then
              native_failed=1
            fi
          done
          exit "$native_failed"
      - name: Validate focused probe
        id: probe
        if: always() && fromJSON(inputs.plan).deep && inputs.native_probe != 'none'
        env:
          NATIVE_PROBE: ${{ inputs.native_probe }}
        run: |
          [[ ${#NATIVE_PROBE} -le 7 ]]
          case "$NATIVE_PROBE" in
            AAC) selector=DownloadAACProbeTests ;;
            storage) selector=DownloadStorageAuthorizationTests ;;
            *) exit 2 ;;
          esac
          printf 'selector=%s\n' "$selector" >> "$GITHUB_OUTPUT"
      - name: Execute one iOS probe suite
        if: always() && fromJSON(inputs.plan).deep && inputs.native_probe != 'none' && steps.probe.outcome == 'success'
        env:
          SELECTOR: ${{ steps.probe.outputs.selector }}
          NATIVE_PROBE: ${{ inputs.native_probe }}
          DEVELOPER_DIR: /Applications/Xcode_27.1_beta.app/Contents/Developer
        run: |
          run="$RUNNER_TEMP/native-probe"
          mkdir "$run"
          device="$(xcrun simctl list devices available --json | python3 scripts/ci/select-simulator.py iOS)"
          command=(xcodebuild test -project apps/player/apps/native/Kinosail.xcodeproj -scheme Kinosail-iOS
            -destination "id=$device" -derivedDataPath apps/player/apps/native/.build/ios-simulator
            -resultBundlePath "$run/native.xcresult" "-only-testing:Kinosail-iOSTests/$SELECTOR"
            -parallel-testing-enabled NO -collect-test-diagnostics never CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-)
          printf '%q ' "${command[@]}" > "$run/command.txt"
          if "${command[@]}" > "$run/native.log" 2>&1; then status=0; else status=$?; fi
          export NATIVE_PROBE_EXIT="$status" NATIVE_PROBE_RUN="$run" NATIVE_PROBE_DEVICE="$device"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, re, subprocess, sys
          run = pathlib.Path(os.environ['NATIVE_PROBE_RUN'])
          suite, count, data = {'AAC': ('DownloadAACProbeTests', 2, 'Embedded 2106-byte AAC; malformed/truncated/wrong-kind/playlist/symlink/remote controls'),
              'storage': ('DownloadStorageAuthorizationTests', 1, 'Synthetic blocked journal root; 40 scoped denials, reset and authorization')}[os.environ['NATIVE_PROBE']]
          status = int(os.environ['NATIVE_PROBE_EXIT'])
          matches = re.findall(r'Test run with (\d+) tests? .*passed', (run / 'native.log').read_text())
          discovered = bool(matches and int(matches[-1]) == count)
          receipt = {'revision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'command': (run / 'command.txt').read_text(), 'probe': os.environ['NATIVE_PROBE'],
              'environment': platform.platform(), 'xcode': subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
              'simulator': os.environ['NATIVE_PROBE_DEVICE'], 'data': data,
              'fixtureSourceSHA256': hashlib.sha256(pathlib.Path('apps/player/apps/native/Tests', suite + '.swift').read_bytes()).hexdigest(),
              'expectedTests': count, 'discoveryVerified': discovered, 'exitCode': status,
              'result': 'passed' if status == 0 and discovered else 'failed',
              'boundaries': 'Focused iOS simulator regression; no physical device or full-suite proof'}
          (run / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          if status == 0 and not discovered: sys.exit('Expected native tests were not discovered')
          PY
          exit "$status"
      - name: Retain native test results
        if: always() && fromJSON(inputs.plan).deep
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: player-native-contracts-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-*.xcresult
            ${{ runner.temp }}/native-media.json
            ${{ runner.temp }}/native-media.sha256
            ${{ runner.temp }}/native-probe
          retention-days: 14
          if-no-files-found: error

  android:
    name: Player Android compilation
    if: inputs.app == 'player' && fromJSON(inputs.plan).android
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-37.0'
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :watchcore:testDebugUnitTest :wear:assembleDebug :wear:testDebugUnitTest
        working-directory: apps/player/apps/android

  system:
    name: ${{ inputs.app }} production container (${{ matrix.platform }})
    if: fromJSON(inputs.plan)[inputs.app]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(fromJSON(inputs.plan)[format('{0}_arm', inputs.app)] && '[{"platform":"linux/amd64","runner":"ubuntu-24.04"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]' || '[{"platform":"linux/amd64","runner":"ubuntu-24.04"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/${{ inputs.app }}/Containerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ inputs.app }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}-${{ matrix.platform }}
          load: true
          push: false
          tags: localhost/kinosail-${{ inputs.app }}:${{ github.sha }}
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
      # Trivy mutates checkout files; finish it before exact-revision evidence.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: localhost/kinosail-${{ inputs.app }}:${{ github.sha }}
          cache-dir: ${{ runner.temp }}/trivy-${{ inputs.app }}-${{ matrix.runner }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Test production paths
        working-directory: apps/${{ inputs.app }}
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_TEST_IMAGE: localhost/kinosail-${{ inputs.app }}:${{ github.sha }}
          KINOSAIL_TEST_IMAGE_READY: "1"
        run: python3 ../../scripts/ci/e2e-artifact.py --output "${{ runner.temp }}/${{ inputs.app }}-${{ matrix.runner }}-system-e2e-artifact" -- ./scripts/test-container.sh
      - name: Keep verifiable system E2E artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.app }}-${{ matrix.runner }}-system-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/${{ inputs.app }}-${{ matrix.runner }}-system-e2e-artifact
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
  browser:
    name: ${{ inputs.app }} populated browser (${{ matrix.engine }})
    if: fromJSON(inputs.plan)[inputs.app]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(fromJSON(inputs.plan).deep && '["chromium","firefox","webkit"]' || '["chromium"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.22.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          package-manager-cache: false
      - env:
          APP: ${{ inputs.app }}
        run: pnpm --dir "apps/$APP/e2e" install --frozen-lockfile
      - name: Verify login navigation failure diagnostics
        if: inputs.app == 'subtitles'
        run: node --test scripts/testing/subtitle-login-navigation.test.mjs scripts/testing/subtitle-dashboard-navigation.test.mjs
      - name: Verify setup navigation failure diagnostics
        if: inputs.app == 'player'
        run: node --test scripts/testing/player-setup-navigation.test.mjs scripts/testing/playback-navigation-diagnostics.test.mjs scripts/testing/player-playback-navigation.test.mjs scripts/testing/checkpoint-progress.test.mjs scripts/testing/player-login-navigation.test.mjs scripts/testing/layout-login-navigation.test.mjs scripts/testing/navigation-repeat-offer.test.mjs scripts/testing/supporter-share-availability.test.mjs scripts/testing/jellyfin-save-witness.test.mjs scripts/testing/provider-profile-fixture.test.mjs scripts/testing/browse-return-reporter.test.mjs scripts/testing/browse-return-launch.test.mjs scripts/testing/hls-fast-departure.test.mjs scripts/testing/audio-queue-fault-witness.test.mjs scripts/testing/playback-failed-save.test.mjs scripts/testing/responsive-failure-witness.test.mjs scripts/testing/offline-browser-api.test.mjs scripts/e2e/tests/fixture-boundary.test.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - parallel:
          - env:
              APP: ${{ inputs.app }}
              BROWSERS: ${{ matrix.engine == 'full' && 'chromium firefox webkit' || matrix.engine }}
            run: |
              read -ra browsers <<< "$BROWSERS"
              pnpm --dir "apps/$APP/e2e" exec playwright install --with-deps "${browsers[@]}"
          - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
            with:
              context: .
              file: apps/${{ inputs.app }}/Containerfile
              platforms: linux/amd64
              cache-from: type=gha,scope=${{ inputs.app }}-linux/amd64
              load: true
              push: false
              tags: localhost/kinosail-${{ inputs.app }}:${{ github.sha }}
              build-args: |
                VERSION=ci
                REVISION=${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: matrix.engine == 'chromium'
        with:
          go-version-file: apps/player/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Install startup fixture codecs
        if: inputs.app == 'player'
        run: |
          curl --fail --location --proto '=https' --max-time 120 --output "$RUNNER_TEMP/startup-ffmpeg.deb" https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v8.1.2-5/jellyfin-ffmpeg8_8.1.2-5-noble_amd64.deb
          printf '%s  %s\n' b4e72894ad26c809ed0104805f5415a97be75212b9fcf9d60b89ad25bb3d43e3 "$RUNNER_TEMP/startup-ffmpeg.deb" | sha256sum --check
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "$RUNNER_TEMP/startup-ffmpeg.deb"
          echo /usr/lib/jellyfin-ffmpeg >> "$GITHUB_PATH"
      - name: Verify certified first-fragment regeneration and cold reopen
        if: inputs.app == 'player' && matrix.engine == 'chromium'
        timeout-minutes: 3
        env:
          GOMAXPROCS: "2"
          KINOSAIL_COPIED_RECOVERY_MEDIA: "1"
        run: timeout --kill-after=5s 180s go -C apps/player test -p=1 ./internal/server -run '^TestCopiedRecoveryRealFirstFragmentRegenerationReopens$' -count=1 -timeout=170s -v
      - name: Test populated browsers
        working-directory: apps/${{ inputs.app }}
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_BROWSER_TEST: "1"
          KINOSAIL_BROWSER_MATRIX: ${{ fromJSON(inputs.plan).deep && 'full' || '' }}
          KINOSAIL_BROWSER_PROJECT: ${{ matrix.engine }}
          KINOSAIL_BROWSER_SMOKE: ${{ !fromJSON(inputs.plan).deep && '1' || '' }}
          KINOSAIL_BROWSER_WORKERS: ${{ inputs.app == 'player' && '3' || '1' }}
          KINOSAIL_E2E_OUTPUT_DIR: ${{ runner.temp }}/${{ inputs.app }}-${{ matrix.engine }}-e2e-artifact/browser-results
          KINOSAIL_TEST_IMAGE: localhost/kinosail-${{ inputs.app }}:${{ github.sha }}
          KINOSAIL_TEST_IMAGE_READY: "1"
        run: python3 ../../scripts/ci/e2e-artifact.py --output "${{ runner.temp }}/${{ inputs.app }}-${{ matrix.engine }}-e2e-artifact" -- ./scripts/test-container.sh
      - name: Install Subtitles public-flow codecs
        if: inputs.app == 'subtitles' && matrix.engine == 'chromium'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install public-flow runner
        if: matrix.engine == 'chromium'
        run: |
          ffmpeg -version
          ffprobe -version
          ffmpeg -hide_banner -encoders > "$RUNNER_TEMP/public-flow-encoders.txt"
          grep -Eq '[[:space:]]libx264[[:space:]]' "$RUNNER_TEMP/public-flow-encoders.txt"
          grep -Eq '[[:space:]]aac[[:space:]]' "$RUNNER_TEMP/public-flow-encoders.txt"
          pnpm --dir scripts/e2e install --frozen-lockfile
      - name: Verify complete Player recovery suites
        if: inputs.app == 'player' && matrix.engine == 'chromium'
        env:
          KINOSAIL_E2E_VIDEO: "off"
        run: python3 scripts/ci/e2e-artifact.py --output "${{ runner.temp }}/player-recovery-e2e-artifact" -- pnpm --dir apps/player/e2e exec playwright test passkeys.spec.ts worker-message-security.spec.ts player-experience.spec.ts player-direct-fallback.spec.ts --trace off --workers=1
      - name: Keep Player recovery evidence
        if: always() && inputs.app == 'player' && matrix.engine == 'chromium'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: player-recovery-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/player-recovery-e2e-artifact/
          retention-days: 30
          if-no-files-found: error
      - name: Verify public flows with tester-army e2e
        if: matrix.engine == 'chromium'
        env:
          APP: ${{ inputs.app }}
          E2E_TELEMETRY_DISABLED: "1"
        run: scripts/e2e/run.sh "$APP"
      - name: Keep public-flow evidence
        if: always() && matrix.engine == 'chromium'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.app }}-public-flow-e2e-${{ github.sha }}
          include-hidden-files: true
          path: scripts/e2e/.e2e/runs/
          retention-days: 30
          if-no-files-found: error
      - name: Verify cold and damaged HLS cache reopen
        if: always() && inputs.app == 'player' && matrix.engine == 'chromium'
        env:
          GOMAXPROCS: "2"
        run: python3 apps/player/scripts/test-hls-cache-reopen.py
      - name: Keep safe HLS cache reopen evidence
        if: always() && inputs.app == 'player' && matrix.engine == 'chromium'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: player-hls-cache-reopen-evidence
          include-hidden-files: true
          path: |
            .verification/hls-cache-reopen/*/receipt.json
            .verification/hls-cache-reopen/*/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
      - name: Verify prepared copied-video timeline
        if: always() && inputs.app == 'player' && matrix.engine == 'chromium'
        env:
          GOMAXPROCS: "2"
        run: |
          python3 -B apps/player/scripts/test_hls_timeline_packets.py
          python3 apps/player/scripts/test-hls-prepared-timeline.py
      - name: Keep safe prepared timeline evidence
        if: always() && inputs.app == 'player' && matrix.engine == 'chromium'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: player-prepared-timeline-evidence
          include-hidden-files: true
          path: |
            .verification/hls-prepared-timeline/*/receipt.json
            .verification/hls-prepared-timeline/*/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
      - name: Verify copied-video audio and legacy preparation
        if: always() && inputs.app == 'player' && matrix.engine == 'chromium'
        timeout-minutes: 10
        env:
          GOMAXPROCS: "2"
        run: |
          python3 -m unittest discover -s apps/player/scripts -p test_hls_followon_frames.py
          python3 apps/player/scripts/test-hls-followon.py --suite audio
      - name: Keep safe copied-video audio evidence
        if: always() && inputs.app == 'player' && matrix.engine == 'chromium'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: player-hls-audio-conversion-evidence
          include-hidden-files: true
          path: |
            .verification/hls-followon/*/receipt.json
            .verification/hls-followon/*/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
      - name: Verify complete HEVC preparation
        if: always() && inputs.app == 'player' && matrix.engine == 'chromium'
        timeout-minutes: 10
        env:
          GOMAXPROCS: "2"
        run: python3 apps/player/scripts/test-hls-followon.py --suite hevc
      - name: Keep safe complete HEVC preparation evidence
        if: always() && inputs.app == 'player' && matrix.engine == 'chromium'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: player-hls-hevc-preparation-evidence
          include-hidden-files: true
          path: |
            .verification/hls-hevc-startup/*/receipt.json
            .verification/hls-hevc-startup/*/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
      - name: Verify HLS source-version freshness
        if: inputs.app == 'player' && matrix.engine == 'chromium'
        env:
          GOMAXPROCS: "4"
        run: python3 apps/player/scripts/test-hls-source-version.py
      - name: Keep safe HLS source-version evidence
        if: always() && inputs.app == 'player' && matrix.engine == 'chromium'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: player-hls-source-version-evidence
          include-hidden-files: true
          path: |
            .verification/hls-source-version/*/receipt.json
            .verification/hls-source-version/*/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
      - name: Verify bounded startup and request boundary
        if: inputs.app == 'player' && matrix.engine == 'chromium'
        env:
          GOMAXPROCS: "4"
          KINOSAIL_STARTUP_BROWSER_CHANNEL: chromium
        run: python3 apps/player/scripts/test-startup-local.py
      - name: Verify bounded HLS phase evidence
        if: always() && inputs.app == 'player' && matrix.engine == 'chromium'
        run: python3 apps/player/scripts/hls-phase-evidence.py
      - name: Keep safe startup evidence
        if: always() && inputs.app == 'player' && matrix.engine == 'chromium'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: player-startup-boundary-evidence
          include-hidden-files: true
          path: |
            .verification/startup/*/receipt.json
            .verification/startup/*/hls-phases.json
            .verification/startup/*/hls-phases.sha256
            .verification/startup/*/resources.json
            .verification/startup/*/SHA256SUMS
            .verification/startup/*/results/**/startup-measurements.json
          retention-days: 7
          if-no-files-found: error
      - name: Keep verifiable E2E artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.app }}-${{ matrix.engine }}-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/${{ inputs.app }}-${{ matrix.engine }}-e2e-artifact
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true

  required:
    name: ${{ inputs.app }} suite complete
    if: always()
    needs: [static, race, security, tooling, client, android, system, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          CI_APP: ${{ inputs.app }}
          CI_PLAN: ${{ inputs.plan }}
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/required.py app
