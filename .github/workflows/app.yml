name: App suite

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  static:
    name: ${{ inputs.app }} lint and module contract
    if: fromJSON(inputs.plan)[inputs.app]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: apps/${{ inputs.app }}/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.13.1
          working-directory: apps/${{ inputs.app }}
          args: --timeout=5m --new-from-rev=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'HEAD~1' }}
      - run: make single-container tidy-check

  race:
    name: ${{ inputs.app }} race and coverage
    if: fromJSON(inputs.plan)[inputs.app]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: apps/${{ inputs.app }}/go.mod
          cache-dependency-path: "**/go.sum"
      - env:
          APP: ${{ inputs.app }}
        run: ./scripts/ci/test-go.sh "$APP"

  security:
    name: ${{ inputs.app }} Go vulnerabilities
    if: fromJSON(inputs.plan)[inputs.app]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: apps/${{ inputs.app }}/go.mod
          cache-dependency-path: "**/go.sum"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  tooling:
    name: ${{ inputs.app }} installer and local pipeline
    if: inputs.app != 'dashboard' && fromJSON(inputs.plan)[format('{0}_tools', inputs.app)]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: apps/${{ inputs.app }}/go.mod
          cache-dependency-path: "**/go.sum"
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.22.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/${{ inputs.app }}/e2e/pnpm-lock.yaml
      - run: pnpm --dir e2e install --frozen-lockfile
      - run: make installer-test native-build local-pipeline-test

  client:
    name: Player Swift compilation
    if: inputs.app == 'player' && fromJSON(inputs.plan).client
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: make -C apps/player client-check

  system:
    name: ${{ inputs.app }} container and browser (${{ matrix.platform }})
    if: fromJSON(inputs.plan)[inputs.app]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(fromJSON(inputs.plan)[format('{0}_arm', inputs.app)] && '[{"platform":"linux/amd64","runner":"ubuntu-24.04"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]' || '[{"platform":"linux/amd64","runner":"ubuntu-24.04"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        if: matrix.platform == 'linux/amd64'
        with:
          version: 11.22.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: matrix.platform == 'linux/amd64'
        with:
          node-version: 26
          package-manager-cache: false
      - if: matrix.platform == 'linux/amd64'
        env:
          APP: ${{ inputs.app }}
        run: pnpm --dir "apps/$APP/e2e" install --frozen-lockfile
      - if: matrix.platform == 'linux/amd64'
        env:
          APP: ${{ inputs.app }}
          BROWSERS: ${{ fromJSON(inputs.plan)[format('{0}_browsers', inputs.app)] && 'chromium firefox webkit' || 'chromium' }}
        run: |
          read -ra browsers <<< "$BROWSERS"
          pnpm --dir "apps/$APP/e2e" exec playwright install --with-deps "${browsers[@]}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/${{ inputs.app }}/Containerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ inputs.app }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}-${{ matrix.platform }}
          load: true
          push: false
          tags: localhost/kinosail-${{ inputs.app }}:${{ github.sha }}
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: localhost/kinosail-${{ inputs.app }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Test Player and Subtitles production paths
        if: inputs.app != 'dashboard'
        working-directory: apps/${{ inputs.app }}
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_BROWSER_MATRIX: ${{ fromJSON(inputs.plan)[format('{0}_browsers', inputs.app)] && 'full' || '' }}
          KINOSAIL_BROWSER_WORKERS: ${{ inputs.app == 'player' && '3' || '1' }}
          KINOSAIL_E2E_OUTPUT_DIR: ${{ runner.temp }}/${{ inputs.app }}-browser-results
          KINOSAIL_PLATFORM: ${{ matrix.platform }}
          KINOSAIL_TEST_IMAGE: localhost/kinosail-${{ inputs.app }}:${{ github.sha }}
          KINOSAIL_TEST_IMAGE_READY: "1"
        run: |
          if [[ "$KINOSAIL_PLATFORM" == linux/arm64 ]]; then
            ./scripts/test-container.sh
          else
            status=0
            ./scripts/test-container.sh &
            production_pid=$!
            KINOSAIL_BROWSER_TEST=1 ./scripts/test-container.sh &
            browser_pid=$!
            wait "$production_pid" || status=$?
            wait "$browser_pid" || status=$?
            exit "$status"
          fi
      - name: Test Dashboard production image
        if: inputs.app == 'dashboard' && matrix.platform == 'linux/amd64'
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_DASHBOARD_TEST_IMAGE: localhost/kinosail-dashboard:${{ github.sha }}
          KINOSAIL_TEST_IMAGE_READY: "1"
        run: make -C apps/dashboard container-test
      - name: Test Dashboard browsers
        if: inputs.app == 'dashboard' && matrix.platform == 'linux/amd64'
        env:
          CI: "1"
          PROJECT: ${{ fromJSON(inputs.plan)[format('{0}_browsers', inputs.app)] && 'full' || 'chromium' }}
        run: |
          args=()
          [[ "$PROJECT" == full ]] || args+=(--project=chromium)
          pnpm --dir apps/dashboard/e2e exec playwright test "${args[@]}"
      - name: Keep browser failure evidence
        if: failure() && matrix.platform == 'linux/amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.app }}-browser-failures
          path: |
            ${{ runner.temp }}/${{ inputs.app }}-browser-results-*
            apps/dashboard/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  required:
    name: ${{ inputs.app }} suite complete
    if: always()
    needs: [static, race, security, tooling, client, system]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          CI_APP: ${{ inputs.app }}
          CI_PLAN: ${{ inputs.plan }}
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/required.py app
