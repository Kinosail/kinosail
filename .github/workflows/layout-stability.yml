  hls-navigation:
    name: Fixed real HLS departure (WebKit)
    needs: selection-admission
    if: github.event_name == 'workflow_dispatch' && inputs.campaign_proof == 'HLS-navigation'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: test ! -e .gates-disabled
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.22.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Verify isolated owned-resource cleanup
        run: node --test scripts/testing/hls-navigation-fixture.test.mjs
      - name: Prepare fixed WebKit fixture dependencies
        timeout-minutes: 6
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pnpm --dir apps/player/e2e install --frozen-lockfile
          pnpm --dir apps/player/e2e exec playwright install --with-deps webkit
      - name: Record exact source and tool recipe
        env:
          PROOF_REVISION: ${{ github.sha }}
        run: |
          mkdir -p .verification/hls-navigation
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          paths = ['apps/player/e2e/player-hls-navigation.spec.ts', 'apps/player/e2e/player-hls-navigation-fixture.ts',
                   'apps/player/e2e/playwright.config.ts', 'apps/player/e2e/pnpm-lock.yaml',
                   'apps/player/internal/server/static/hls.min.js', 'packages/webassets/static/player-progress-navigation.js']
          receipt = {'revision': os.environ['PROOF_REVISION'],
                     'command': ['pnpm', '--dir', 'apps/player/e2e', 'exec', 'playwright', 'test', 'player-hls-navigation.spec.ts', '--project=webkit', '--workers=1', '--retries=0'],
                     'discoveryOnly': True,
                     'discoveryCommand': ['pnpm', '--dir', 'apps/player/e2e', 'exec', 'playwright', 'test', 'player-hls-navigation.spec.ts', '--project=webkit', '--workers=1', '--retries=0', '--list', '--reporter=json'],
                     'discoveryBounds': {'seconds': 60, 'bytes': 2097152},
                     'data': 'synthetic real H264 TS and fMP4, fixed held-byte and fast Watched303/Library200 profiles',
                     'environment': {'platform': 'ubuntu-24.04', 'browser': 'webkit', 'workers': 1, 'retries': 0},
                     'sourceSHA256': {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in paths},
                     'tools': {name: subprocess.check_output(argv, text=True, timeout=10).splitlines()[0][:512] for name, argv in (
                         ('node', ['node', '--version']), ('pnpm', ['pnpm', '--version']), ('ffmpeg', ['ffmpeg', '-version']),
                         ('playwright', ['pnpm', '--dir', 'apps/player/e2e', 'exec', 'playwright', '--version']))},
                     'boundary': 'HTTP fixture/pinned Hls.js/real decoder, no Go storage, production TLS or fullscreen proof'}
          pathlib.Path('.verification/hls-navigation/source-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Discover exact WebKit HLS titles
        env:
          KINOSAIL_BROWSER_MATRIX: full
          KINOSAIL_BROWSER_PROJECT: webkit
        run: |
          timeout --kill-after=2s 60s pnpm --dir apps/player/e2e exec playwright test player-hls-navigation.spec.ts --project=webkit --workers=1 --retries=0 --list --reporter=json | head -c 2097153 > .verification/hls-navigation/list-webkit.json
          test "$(wc -c < .verification/hls-navigation/list-webkit.json)" -le 2097152
      - name: Run exact strict HLS navigation file
        env:
          KINOSAIL_BROWSER_MATRIX: full
          KINOSAIL_BROWSER_PROJECT: webkit
          KINOSAIL_BROWSER_WORKERS: "1"
          KINOSAIL_E2E_VIDEO: "off"
          KINOSAIL_E2E_ARTIFACT_DIR: ../../../.verification/hls-navigation
          KINOSAIL_E2E_OUTPUT_DIR: ../../../.verification/hls-navigation/test-results
        run: pnpm --dir apps/player/e2e exec playwright test player-hls-navigation.spec.ts --project=webkit --workers=1 --retries=0
      - name: Admit complete one-attempt HLS results
        run: python3 scripts/ci/check-hls-navigation-result.py
      - name: Retain exact source, results and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hls-navigation-webkit-${{ github.sha }}
          path: |
            .verification/hls-navigation/source-receipt.json
            .verification/hls-navigation/list-webkit.json
            .verification/hls-navigation/results-webkit.json
            .verification/hls-navigation/test-results/**/trace.zip
            .verification/hls-navigation/test-results/**/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  literal-verify:
    needs: selection-admission
    name: Literal Player and Subtitles verification
    if: github.event_name == 'workflow_dispatch' && inputs.campaign_proof == 'Verify-changed'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_SELECTION: both
      CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit closed selection before tool and app effects
        run: bash scripts/ci/run-verify-changed.sh "$APP_SELECTION" --admit-only
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.22.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install existing pinned verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools ffmpeg
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          tools="$RUNNER_TEMP/verify-tools"
          mkdir "$tools"
          curl --proto '=https' --tlsv1.2 --fail --location --max-time 120 --max-filesize 16777216 --output "$tools/shellcheck.tar.gz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          curl --proto '=https' --tlsv1.2 --fail --location --max-time 120 --max-filesize 16777216 --output "$tools/actionlint.tar.gz" https://github.com/kjanat/actionlint/releases/download/v1.17.0/actionlint_1.17.0_linux_amd64.tar.gz
          printf '%s  %s\n' b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 "$tools/shellcheck.tar.gz" 620abd485a12b6ab1125b844a876414e1d5bd2af8a3125b27f82b01d0d9d6e5a "$tools/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$tools/shellcheck.tar.gz" -C "$tools" shellcheck-v0.11.0/shellcheck
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          printf '%s\n' "$tools/shellcheck-v0.11.0" "$tools" >> "$GITHUB_PATH"
          for app in player subtitles; do
            if [ "$APP_SELECTION" = both ] || [ "$APP_SELECTION" = "$app" ]; then
              pnpm --dir "apps/$app/e2e" install --frozen-lockfile
            fi
          done
      - name: Record the installed verification environment
        run: |
          {
            go version
            node --version
            pnpm --version
            golangci-lint --version
            govulncheck -version
            shellcheck --version
            actionlint --version
            ffmpeg -version
            ffprobe -version
            docker version
          } > "$RUNNER_TEMP/verify-tool-versions.txt"
      - name: Run selected literal targets serially
        run: bash scripts/ci/run-verify-changed.sh "$APP_SELECTION"
      - name: Keep revision and actual verification stage logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: literal-verify-changed-${{ github.sha }}
          path: |
            ${{ runner.temp }}/verify-tool-versions.txt
            .verification/verify-changed/receipt.json
            .verification/verify-changed/revisions.txt
            .verification/verify-changed/results.txt
            .verification/verify-changed/fetch.log
            .verification/verify-changed/player.log
            .verification/verify-changed/player-stages.tar.gz
            .verification/verify-changed/subtitles.log
            .verification/verify-changed/subtitles-stages.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
