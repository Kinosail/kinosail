name: Bounded AAC startup readiness evidence

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Expected written-first or corrected readiness result
        type: choice
        options: [red, red-long, green, projection]
        default: red

permissions:
  contents: read

jobs:
  readiness-contracts:
    name: Asset-backed AAC readiness contracts
    if: inputs.phase != 'projection'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: test ! -e .gates-disabled
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        timeout-minutes: 3
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Run unchanged and captured readiness controls
        env:
          READINESS_PHASE: ${{ inputs.phase }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          command=['go','-C','apps/player','test','-count=1','-json','-run','TestRemainingInitialAAC|TestRemainingRoundedAAC','./internal/server']
          process=subprocess.run(command,capture_output=True,text=True,timeout=300)
          assert len(process.stdout.encode()) <= 8 << 20
          events=[json.loads(line) for line in process.stdout.splitlines()]
          failures=sorted(e['Test'] for e in events if e.get('Test') and e.get('Action')=='fail')
          expected=sorted(['TestRemainingRoundedAACWindowUsesAvailableAssets','TestRemainingRoundedAACWindowUsesAvailableAssets/captured-eight-second-window','TestRemainingRoundedAACWindowUsesAvailableAssets/missing-cut-number'])
          phase=os.environ['READINESS_PHASE']
          if phase=='red-long':
              expected=sorted(['TestRemainingRoundedAACWindowUsesAvailableAssets','TestRemainingRoundedAACWindowUsesAvailableAssets/captured-window-for-long-source'])
          accepted=(phase in ['red','red-long'] and process.returncode==1 and failures==expected) or (phase=='green' and process.returncode==0 and not failures)
          paths=['apps/player/internal/server/'+n for n in ['startup_window.go','hls_remaining_startup.go','hls_remaining_completion_test.go']]
          result={'revision':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'phase':phase,'result':'expected-red' if accepted and phase in ['red','red-long'] else 'passed' if accepted else 'failed',
              'command':command,'testExitCode':process.returncode,'failures':failures,
              'passedTests':sorted(e['Test'] for e in events if e.get('Test') and e.get('Action')=='pass'),
              'sourceSHA256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths if Path(p).is_file()},
              'boundary':'Asset-backed captured prefix regression; populated public proof is separate.'}
          target=Path('.verification/startup-readiness')
          target.mkdir(parents=True)
          raw=json.dumps(result,separators=(',',':'))+'\n'
          (target/'contracts.json').write_text(raw)
          (target/'SHA256SUMS').write_text(hashlib.sha256(raw.encode()).hexdigest()+'  contracts.json\n')
          print(json.dumps(result,separators=(',',':')))
          if not accepted:
              for e in events:
                  if e.get('Test') in failures and e.get('Output'):
                      print(e['Output'][:600])
              print(process.stderr[:1000])
          raise SystemExit(0 if accepted else 1)
          PY
      - name: Preserve bounded safe regression receipt
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: startup-readiness-contracts-${{ github.sha }}
          path: .verification/startup-readiness/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  public-readiness:
    name: Bounded authenticated AAC readiness
    if: inputs.phase == 'green'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: test ! -e .gates-disabled
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        timeout-minutes: 3
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Install pinned public-media codecs
        run: |
          curl --fail --location --proto '=https' --max-time 120 --output "$RUNNER_TEMP/hls-ffmpeg.deb" https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v8.1.2-5/jellyfin-ffmpeg8_8.1.2-5-noble_amd64.deb
          printf '%s  %s\n' b4e72894ad26c809ed0104805f5415a97be75212b9fcf9d60b89ad25bb3d43e3 "$RUNNER_TEMP/hls-ffmpeg.deb" | sha256sum --check
          apt_options=(-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=0)
          if ! timeout --kill-after=5s 90s sudo apt-get "${apt_options[@]}" update --error-on=any; then
            python3 - "$RUNNER_TEMP/hls-ubuntu.sources" <<'PY'
          import pathlib, sys
          source = pathlib.Path('/etc/apt/sources.list.d/ubuntu.sources')
          with source.open('rb') as stream:
              data = stream.read(65537)
          assert len(data) <= 65536, 'runner_ubuntu_sources_bound'
          lines = data.decode().splitlines(keepends=True)
          changed = False
          for index, line in enumerate(lines):
              if line.rstrip('\r\n') in ['URIs: http://azure.archive.ubuntu.com/ubuntu/', 'URIs: http://azure.archive.ubuntu.com/ubuntu']:
                  lines[index] = 'URIs: https://archive.ubuntu.com/ubuntu/\n'
                  changed = True
          assert changed, 'runner_ubuntu_mirror_not_supported'
          pathlib.Path(sys.argv[1]).write_text(''.join(lines))
          PY
            sudo install -m 0644 "$RUNNER_TEMP/hls-ubuntu.sources" /etc/apt/sources.list.d/ubuntu.sources
            timeout --kill-after=5s 90s sudo apt-get "${apt_options[@]}" update --error-on=any
          fi
          timeout --kill-after=5s 180s sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "$RUNNER_TEMP/hls-ffmpeg.deb"
          echo /usr/lib/jellyfin-ffmpeg >> "$GITHUB_PATH"
      - name: Verify preparation without changing historical assertions
        run: timeout --kill-after=5s 650s python3 apps/player/scripts/test-hls-startup-readiness.py
      - name: Preserve original failures and separate readiness receipt
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: startup-readiness-public-${{ github.sha }}
          path: |
            .verification/hls-followon/*/receipt.json
            .verification/hls-followon/*/startup-readiness.json
            .verification/hls-followon/*/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  source-verifier:
    name: Verify integrated Player source after commit
    if: inputs.phase == 'green'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: test ! -e .gates-disabled
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        timeout-minutes: 3
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: timeout --kill-after=5s 300s make -C apps/player verify-changed BASE=origin/main

  canonical-atlas:
    name: Generate canonical Player atlas Git blob
    if: inputs.phase != 'projection'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: test ! -e .gates-disabled
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        timeout-minutes: 3
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Generate exact-source canonical output
        run: python3 scripts/tooling/generate-architecture-explorer.py player
      - name: Publish only an unreferenced generated Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          path='apps/player/docs/architecture-explorer/index.html'
          raw=Path(path).read_bytes()
          assert 0 < len(raw) < 4 << 20
          result=subprocess.run(['gh','api','repos/Kinosail/kinosail/git/blobs','--method','POST','--input','-'],
              input=json.dumps({'content':raw.decode(),'encoding':'utf-8'}),text=True,capture_output=True,check=True,timeout=30)
          blob=json.loads(result.stdout)
          print(json.dumps({'revision':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'path':path,'blob':blob['sha'],'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}))
          PY

  preserved-public-projection:
    name: Read preserved public readiness boundary
    if: inputs.phase == 'projection'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        timeout-minutes: 2
        with:
          artifact-ids: 11527910191
          run-id: 37725058538
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/readiness-projection
      - name: Emit only the bounded safe receipt projection
        env:
          PROJECTION_ROOT: ${{ runner.temp }}/readiness-projection
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          paths=list(Path(os.environ['PROJECTION_ROOT']).rglob('receipt.json'))
          assert len(paths)==1
          raw=paths[0].read_bytes()
          assert 0 < len(raw) <= 4 << 20
          assert hashlib.sha256(raw).hexdigest()=='c3304a05781890fcf41bfd6dda9f168c5c51838a555d9dec3a29783a26452d3a'
          data=json.loads(raw)
          assert data['revision']=='3e87585d01aecc8e446994b6d554f49275d85e74' and len(data['cases'])==2
          cases=[]
          for case in data['cases']:
              before=case.get('physicalBeforeFirstGET') or {}
              cases.append({'name':case['name'],'result':case['result'],'failures':case['failures'],
                  'preparation':{k:case['preparationAttempt'].get(k) for k in ['posts','publicState','completionState','ownedFFmpeg','joinedSamples']},
                  'prefix':{k:before.get(k) for k in ['segments','packetCount','firstPacket','lastPacket']},
                  'prefixEndlist':before.get('manifest',{}).get('endlist'),
                  'workerBound':case.get('workerBound'),'sourceUnchanged':case.get('sourceUnchanged'),
                  'encoderLifecycle':case.get('encoderLifecycle'),'ownedProcessJoin':case.get('ownedProcessJoin'),
                  'originWitnessFailure':case.get('originWitnessFailure'),'failureClass':case.get('failureClass'),
                  'diagnosticFailureClass':case.get('diagnosticFailureClass'),
                  'nativePCM':{k:case.get('nativePCMQualification',{}).get('public',{}).get(k) for k in ['frames','samples','completeEOFAccounted','decodedClockOrderValid']},
                  'publicPCMSHA256':case.get('fullEOFNativeSamples',{}).get('publicSHA256'),
                  'coldReopenResult':case.get('installationColdReopen',{}).get('result')})
          print(json.dumps({'revision':data['revision'],'originalResult':data['result'],
              'originalReceiptSHA256':hashlib.sha256(raw).hexdigest(),'cases':cases,
              'sameCompletePacketRows':data['cases'][0].get('joinedPublicPacketPayloads')==data['cases'][1].get('joinedPublicPacketPayloads'),
              'originalQualification':data.get('originProductionQualification')},separators=(',',':')))
          PY
