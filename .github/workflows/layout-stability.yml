name: Bounded copied-probe lifetime proof
on:
  workflow_dispatch:
    inputs:
      candidate: {description: Exact reviewed source SHA, required: true, type: string}
permissions: {contents: read}
jobs:
  owned-lifetime:
    name: Owned probe lifetime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    steps:
      - timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env: {GIT_CONFIG_COUNT: '1', GIT_CONFIG_KEY_0: core.autocrlf, GIT_CONFIG_VALUE_0: 'false'}
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact reviewed source
        env: {TARGET_SHA: "${{ inputs.candidate }}"}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test ! -e .gates-disabled
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        timeout-minutes: 3
        with: {go-version-file: go.work, cache: false}
      - name: Run real configured-probe controls
        timeout-minutes: 8
        working-directory: apps/player
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.verification/copied-probe"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/.verification/copied-probe/SOURCE"
          go env GOOS GOARCH GOVERSION
          gofmt -d internal/server/hls_copied_lines*go > "$GITHUB_WORKSPACE/.verification/copied-probe/format.diff"
          go test -json ./internal/server -run '^TestCopiedHLSLines' -count=1 -timeout=2m > "$GITHUB_WORKSPACE/.verification/copied-probe/receipt.jsonl"
      - name: Project bounded safe lifetime facts
        if: always()
        timeout-minutes: 1
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          directory = pathlib.Path('.verification/copied-probe')
          diff = directory / 'format.diff'
          print(json.dumps({'formatDiffBytes': diff.stat().st_size if diff.exists() else -1,
              'CRLFFiles': [p.name for p in pathlib.Path('apps/player/internal/server').glob('hls_copied_lines*go') if b'\r\n' in p.read_bytes()]}))
          path = directory / 'receipt.jsonl'
          with path.open('rb') as stream: raw = stream.read((1 << 20) + 1)
          assert 0 < len(raw) <= (1 << 20), 'probe_receipt_bound'
          rows = [json.loads(line) for line in raw.splitlines()]
          assert not any(r.get('Action') == 'skip' for r in rows), 'probe_no_skip'
          required = ['TestCopiedHLSLinesOwnedLifetime', 'TestCopiedHLSLinesHealthy', 'TestCopiedHLSLinesCancelledBeforeStart']
          assert all(any(r.get('Action') == 'run' and r.get('Test') == name for r in rows) for name in required), 'probe_controls_executed'
          outcomes = {r.get('Test'): r['Action'] for r in rows if r.get('Test') and r.get('Action') in ['pass', 'fail']}
          controls = ['TestCopiedHLSLinesCancelledBeforeStart', 'TestCopiedHLSLinesHealthy', 'TestCopiedHLSLinesHealthy/healthy', 'TestCopiedHLSLinesHealthy/healthy-closed']
          print(json.dumps({'receiptSHA256': hashlib.sha256(raw).hexdigest(), 'bytes': len(raw), 'noSkip': True}))
          for row in rows:
              test = row.get('Test', '')
              output = row.get('Output', '')
              if test.startswith('TestCopiedHLSLines') and (row.get('Action') in ['pass', 'fail'] or 'nonkey owned probe' in output):
                  assert len(output) <= 1024, 'probe_projection_bound'
                  print(json.dumps(row, separators=(',', ':')))
          assert all(outcomes.get(name) == 'pass' for name in controls), 'probe_healthy_controls_pass'
          cases = ['held_stdout', 'early_stdout_closure', 'parent_exits_before_descendant', 'scanner_rejection', 'explicit_cancellation', 'byte_limit_rejection', 'line_limit_rejection']
          assert all(outcomes.get('TestCopiedHLSLinesOwnedLifetime/' + name) in ['pass', 'fail'] for name in cases), 'probe_all_lifetime_results'
          new_controls = ['TestCopiedHLSLinesMissingExecutable', 'TestCopiedHLSLinesInsufficientBudget', 'TestCopiedHLSLinesImmediateExit']
          assert all(outcomes.get(name) in ['pass', 'fail'] for name in new_controls), 'probe_added_controls_terminal'
          PY
      - name: Preserve exact safe receipt including failed controls
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: copied-probe-lifetime-${{ matrix.os }}-${{ inputs.candidate }}
          path: .verification/copied-probe/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
