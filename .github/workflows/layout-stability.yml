name: Bounded Go patch image-version proof
on:
  workflow_dispatch:
    inputs:
      candidate: {description: Exact reviewed security candidate SHA, required: true, type: string}
permissions: {contents: read}
jobs:
  compiler-image:
    name: Pinned compiler version (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux/amd64}
          - {os: ubuntu-24.04-arm, platform: linux/arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with: {ref: "${{ inputs.candidate }}", fetch-depth: 0, persist-credentials: false}
      - name: Verify immutable old and fixed compiler images
        timeout-minutes: 7
        env: {GO_PATCH_SHA: "${{ inputs.candidate }}", GO_PATCH_PLATFORM: "${{ matrix.platform }}"}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, resource, subprocess, tempfile, time
          source = os.environ['GO_PATCH_SHA']
          assert re.fullmatch('[0-9a-f]{40}', source), 'source_shape'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source, 'source_binding'
          assert not pathlib.Path('.gates-disabled').exists(), 'required_gates_enabled'
          assert not subprocess.check_output(['git', 'diff', '--name-only'], text=True).strip(), 'tracked_source_clean'
          old = 'docker.io/library/golang:1.27-alpine@sha256:8a5910f31396cd4d89662f56c68b3ae31d374308270a1c3bd96672ee5ed43414'
          fixed = 'docker.io/library/golang:1.27.2-alpine@sha256:85dc1069ac644ea3c527b177303a406eb3358192816cd7f9e5848eb658851673'
          for app in ['player', 'subtitles']:
              first = pathlib.Path('apps', app, 'Containerfile').read_text().splitlines()[0]
              assert first == 'FROM --platform=$BUILDPLATFORM ' + fixed + ' AS build', 'source_image_pin'
          for name in ['go.work', 'packages/go.mod', 'apps/player/go.mod', 'apps/subtitles/go.mod', 'scripts/quality/metrics/go.mod']:
              assert pathlib.Path(name).read_text().splitlines().count('go 1.27.2') == 1, 'source_patch_minimum'
          platform = os.environ['GO_PATCH_PLATFORM']
          assert platform in ['linux/amd64', 'linux/arm64'], 'platform_shape'
          started = time.monotonic()
          deadline = started + 360
          rows = []
          cleanup = []
          cleanup_failure = None
          owned = []
          run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
          assert run_id.isdecimal() and attempt.isdecimal(), 'run_identity_shape'
          output_limit = 2 << 20
          def command(arguments, until, allow_failure=False):
              remaining = until - time.monotonic()
              assert remaining > 0, 'shared_image_deadline'
              def child_limit():
                  resource.setrlimit(resource.RLIMIT_FSIZE, (output_limit, output_limit))
              with tempfile.TemporaryFile() as out, tempfile.TemporaryFile() as err:
                  result = subprocess.run(arguments, stdout=out, stderr=err,
                      preexec_fn=child_limit, timeout=remaining)
                  assert os.fstat(out.fileno()).st_size < output_limit, 'image_output_bound'
                  assert os.fstat(err.fileno()).st_size < output_limit, 'image_output_bound'
                  out.seek(0)
                  value = out.read(output_limit)
              assert allow_failure or result.returncode == 0, 'image_operation_failed'
              return value
          result = 'failed'
          failure = None
          try:
              for label, image, expected in [('preserved-old', old, '1.27.1'), ('fixed', fixed, '1.27.2')]:
                  name = 'kin-go-patch-' + run_id + '-' + attempt + '-' + platform.split('/')[1] + '-' + label
                  command(['docker', 'pull', '--platform', platform, image], deadline - 30)
                  existing = command(['docker', 'ps', '-a', '--filter', 'name=^/' + name + '$',
                      '--format', '{{.ID}}'], deadline - 30)
                  assert not existing.strip(), 'owned_container_name_absent'
                  owned.append(name)
                  version = command(['docker', 'run', '--rm', '--name', name, '--platform', platform, '--network', 'none',
                      '--cap-drop', 'ALL', '--security-opt', 'no-new-privileges', '--read-only',
                      '--memory', '256m', '--cpus', '1', '--pids-limit', '64', '--user', '65534:65534',
                      image, 'go', 'version'], deadline - 30)
                  shape = re.fullmatch(rb'go version go1\.27\.[0-9]+ linux/(amd64|arm64)\n', version)
                  rows.append({'label': label, 'image': image,
                      'version': version.decode().strip() if shape else 'unexpected-output',
                      'versionSHA256': hashlib.sha256(version).hexdigest(), 'platform': platform})
                  wanted = ('go version go' + expected + ' ' + platform + '\n').encode()
                  assert version == wanted, 'actual_compiler_patch_version'
              result = 'pass'
          except subprocess.TimeoutExpired:
              failure = 'shared_image_deadline'
          except AssertionError as error:
              failure = str(error)
          except Exception:
              failure = 'image_operation_exception'
          finally:
              for name in owned:
                  settled = False
                  try:
                      command(['docker', 'rm', '--force', name], deadline, allow_failure=True)
                      remaining = command(['docker', 'ps', '-a', '--filter', 'name=^/' + name + '$',
                          '--format', '{{.ID}}'], deadline)
                      settled = not remaining.strip()
                      assert settled, 'owned_container_unsettled'
                  except (subprocess.TimeoutExpired, AssertionError, OSError):
                      cleanup_failure = 'owned_container_cleanup_unproved'
                      result = 'failed'
                  cleanup.append({'name': name, 'settled': settled})
              value = {'source': source, 'platform': platform, 'elapsedSeconds': time.monotonic()-started,
                  'result': result, 'failureClass': failure, 'cleanupFailureClass': cleanup_failure, 'ownedContainerCleanup': cleanup,
                  'scope': 'immutable compiler-image version only; app build, vulnerability, publication and runtime gates separate',
                  'images': rows}
              directory = pathlib.Path('.verification/go-patch-images')
              directory.mkdir(parents=True)
              raw = (json.dumps(value, sort_keys=True) + '\n').encode()
              assert len(raw) <= 8192, 'safe_image_receipt_bound'
              directory.joinpath('receipt.json').write_bytes(raw)
              print(json.dumps({'source': source, 'platform': platform, 'result': result, 'failureClass': failure,
                  'receiptSHA256': hashlib.sha256(raw).hexdigest(), 'images': rows, 'cleanupFailureClass': cleanup_failure, 'ownedContainerCleanup': cleanup, 'scope': value['scope']}))
          raise SystemExit(0 if result == 'pass' else 1)
          PY
      - name: Preserve safe image-version receipt
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: go-patch-compiler-version-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ inputs.candidate }}
          path: .verification/go-patch-images/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
