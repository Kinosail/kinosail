name: Bounded non-key presentation observation

on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [public, observe, mux, boundary, aac-edit, cutoff]
        default: public

permissions:
  contents: read

jobs:
  nonkey-public:
    if: inputs.phase == 'public' || inputs.phase == 'observe'
    name: Strict source-bound non-key public regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: test ! -e .gates-disabled
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        timeout-minutes: 3
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Install pinned public-media codecs
        run: |
          curl --fail --location --proto '=https' --max-time 120 --output "$RUNNER_TEMP/hls-ffmpeg.deb" https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v8.1.2-5/jellyfin-ffmpeg8_8.1.2-5-noble_amd64.deb
          printf '%s  %s\n' b4e72894ad26c809ed0104805f5415a97be75212b9fcf9d60b89ad25bb3d43e3 "$RUNNER_TEMP/hls-ffmpeg.deb" | sha256sum --check
          apt_options=(-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=0)
          if ! timeout --kill-after=5s 90s sudo apt-get "${apt_options[@]}" update --error-on=any; then
            python3 - "$RUNNER_TEMP/hls-ubuntu.sources" <<'PY'
          import pathlib, sys
          source = pathlib.Path('/etc/apt/sources.list.d/ubuntu.sources')
          with source.open('rb') as stream:
              data = stream.read(65537)
          assert len(data) <= 65536, 'runner_ubuntu_sources_bound'
          lines = data.decode().splitlines(keepends=True)
          changed = False
          for index, line in enumerate(lines):
              if line.rstrip('\r\n') in ['URIs: http://azure.archive.ubuntu.com/ubuntu/', 'URIs: http://azure.archive.ubuntu.com/ubuntu']:
                  lines[index] = 'URIs: https://archive.ubuntu.com/ubuntu/\n'
                  changed = True
          assert changed, 'runner_ubuntu_mirror_not_supported'
          pathlib.Path(sys.argv[1]).write_text(''.join(lines))
          PY
            sudo install -m 0644 "$RUNNER_TEMP/hls-ubuntu.sources" /etc/apt/sources.list.d/ubuntu.sources
            timeout --kill-after=5s 90s sudo apt-get "${apt_options[@]}" update --error-on=any
          fi
          timeout --kill-after=5s 180s sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "$RUNNER_TEMP/hls-ffmpeg.deb"
          echo /usr/lib/jellyfin-ffmpeg >> "$GITHUB_PATH"
      - name: Verify strict initialization and fragment parsers
        run: python3 -m unittest discover -s apps/player/scripts -p 'test_hls_remaining_nonkey_*.py'
      - name: Capture full public frames, packets, edits and native PCM
        run: timeout --kill-after=90s 750s python3 apps/player/scripts/test-hls-nonkey-observation.py
      - name: Project bounded public diagnostic facts
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths=list(Path('.verification/hls-nonkey').glob('*/receipt.json'))
          assert len(paths)==1
          with paths[0].open('rb') as stream:
              raw=stream.read((16<<20)+1)
          assert 0<len(raw)<16<<20
          receipt=json.loads(raw)
          for case in receipt['cases']:
              value=case.get('observations',{})
              mapping=value.get('mapping',{})
              pcm=value.get('nativePCM',{})
              facts={'case':case['name'],'result':case['result'],'failures':case['failures'],
                  'failureClass':case.get('failureClass'),'requestedSourcePTS':case.get('referenceClock',{}).get('requestedSourcePTS'),
                  'expectedFrames':len(mapping.get('expectedSourceIndices',[])),
                  'actualFrames':len(mapping.get('actualSourceIndices',[])),
                  'actualFirstIndices':mapping.get('actualSourceIndices',[])[:16],
                  'actualLastIndices':mapping.get('actualSourceIndices',[])[-3:],
                  'precedingFrames':mapping.get('precedingSourceFrames',[]),
                  'exactRequestedSequence':mapping.get('exactRequestedSequence'),
                  'packetClockQualification':value.get('packetClockQualification'),
                  'init':value.get('initialization'),'fragmentCount':len(value.get('physicalFragments',[])),
                  'firstRawFragment':[{'trackID':t['trackID'],'samples':len(t['samples']),
                      'firstSamples':t['samples'][:4],'lastSamples':t['samples'][-2:]}
                      for t in next(iter(value.get('physicalFragments',[])),{}).get('tracks',[])],
                  'nativePCM':{k:{field:v.get(field) for field in ['samples','sha256','decodedFrameSampleSum','completeEOFAccounted']}
                      for k,v in pcm.items() if k in ['source','public','referenceSeek']},
                  'wholePublicCorrespondence':pcm.get('wholePublicCorrespondence'),
                  'wholePublicEqualsReference':pcm.get('wholePublicEqualsReference'),
                  'publicMinusReferenceSamples':pcm.get('publicMinusReferenceSamples'),
                  'completedStages':value.get('completedStages'),'currentStage':value.get('currentStage'),
                  'ownedProcessJoin':case.get('ownedProcessJoin'),'workerBound':case.get('workerBound'),'sourceUnchanged':case.get('sourceUnchanged')}
              print(json.dumps(facts,separators=(',',':')))
          PY
      - name: Preserve complete safe evidence including failed regression
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nonkey-presentation-observation-${{ github.sha }}
          path: |
            .verification/hls-nonkey/*/receipt.json
            .verification/hls-nonkey/*/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  accepted-aac-control:
    if: inputs.phase == 'public'
    name: Unchanged accepted AAC packet and native PCM control
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: test ! -e .gates-disabled
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        timeout-minutes: 3
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Install pinned public-media codecs
        run: |
          curl --fail --location --proto '=https' --max-time 120 --output "$RUNNER_TEMP/hls-ffmpeg.deb" https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v8.1.2-5/jellyfin-ffmpeg8_8.1.2-5-noble_amd64.deb
          printf '%s  %s\n' b4e72894ad26c809ed0104805f5415a97be75212b9fcf9d60b89ad25bb3d43e3 "$RUNNER_TEMP/hls-ffmpeg.deb" | sha256sum --check
          apt_options=(-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=0)
          if ! timeout --kill-after=5s 90s sudo apt-get "${apt_options[@]}" update --error-on=any; then
            python3 - "$RUNNER_TEMP/hls-ubuntu.sources" <<'PY'
          import pathlib, sys
          source = pathlib.Path('/etc/apt/sources.list.d/ubuntu.sources')
          with source.open('rb') as stream:
              data = stream.read(65537)
          assert len(data) <= 65536, 'runner_ubuntu_sources_bound'
          lines = data.decode().splitlines(keepends=True)
          changed = False
          for index, line in enumerate(lines):
              if line.rstrip('\r\n') in ['URIs: http://azure.archive.ubuntu.com/ubuntu/', 'URIs: http://azure.archive.ubuntu.com/ubuntu']:
                  lines[index] = 'URIs: https://archive.ubuntu.com/ubuntu/\n'
                  changed = True
          assert changed, 'runner_ubuntu_mirror_not_supported'
          pathlib.Path(sys.argv[1]).write_text(''.join(lines))
          PY
            sudo install -m 0644 "$RUNNER_TEMP/hls-ubuntu.sources" /etc/apt/sources.list.d/ubuntu.sources
            timeout --kill-after=5s 90s sudo apt-get "${apt_options[@]}" update --error-on=any
          fi
          timeout --kill-after=5s 180s sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "$RUNNER_TEMP/hls-ffmpeg.deb"
          echo /usr/lib/jellyfin-ffmpeg >> "$GITHUB_PATH"
      - name: Preserve the accepted control and original strict worker failures
        run: timeout --kill-after=90s 750s python3 apps/player/scripts/test-hls-startup-readiness.py
      - name: Preserve unchanged control receipts
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nonkey-unchanged-aac-control-${{ github.sha }}
          path: |
            .verification/hls-followon/*/receipt.json
            .verification/hls-followon/*/startup-readiness.json
            .verification/hls-followon/*/uninterrupted-cold-control.json
            .verification/hls-followon/*/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  nonkey-mux:
    if: inputs.phase == 'mux' || inputs.phase == 'boundary' || inputs.phase == 'aac-edit'
    name: Fixed inner and outer mux timestamp counterfactuals
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: test ! -e .gates-disabled
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        timeout-minutes: 3
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Install pinned public-media codecs
        run: |
          curl --fail --location --proto '=https' --max-time 120 --output "$RUNNER_TEMP/hls-ffmpeg.deb" https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v8.1.2-5/jellyfin-ffmpeg8_8.1.2-5-noble_amd64.deb
          printf '%s  %s\n' b4e72894ad26c809ed0104805f5415a97be75212b9fcf9d60b89ad25bb3d43e3 "$RUNNER_TEMP/hls-ffmpeg.deb" | sha256sum --check
          apt_options=(-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=0)
          if ! timeout --kill-after=5s 90s sudo apt-get "${apt_options[@]}" update --error-on=any; then
            python3 - "$RUNNER_TEMP/hls-ubuntu.sources" <<'PY'
          import pathlib, sys
          source = pathlib.Path('/etc/apt/sources.list.d/ubuntu.sources')
          with source.open('rb') as stream:
              data = stream.read(65537)
          assert len(data) <= 65536, 'runner_ubuntu_sources_bound'
          lines = data.decode().splitlines(keepends=True)
          changed = False
          for index, line in enumerate(lines):
              if line.rstrip('\r\n') in ['URIs: http://azure.archive.ubuntu.com/ubuntu/', 'URIs: http://azure.archive.ubuntu.com/ubuntu']:
                  lines[index] = 'URIs: https://archive.ubuntu.com/ubuntu/\n'
                  changed = True
          assert changed, 'runner_ubuntu_mirror_not_supported'
          pathlib.Path(sys.argv[1]).write_text(''.join(lines))
          PY
            sudo install -m 0644 "$RUNNER_TEMP/hls-ubuntu.sources" /etc/apt/sources.list.d/ubuntu.sources
            timeout --kill-after=5s 90s sudo apt-get "${apt_options[@]}" update --error-on=any
          fi
          timeout --kill-after=5s 180s sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "$RUNNER_TEMP/hls-ffmpeg.deb"
          echo /usr/lib/jellyfin-ffmpeg >> "$GITHUB_PATH"
      - name: Verify all strict diagnostic controls
        run: python3 -m unittest discover -s apps/player/scripts -p 'test_hls_remaining_nonkey_*.py'
      - name: Observe fixed counterfactuals without production admission
        if: inputs.phase == 'mux'
        run: timeout --kill-after=90s 420s python3 apps/player/scripts/test-hls-nonkey-mux-observation.py
      - name: Observe edit, demux and native boundary clocks
        if: inputs.phase == 'boundary'
        run: timeout --kill-after=90s 300s python3 apps/player/scripts/test-hls-nonkey-boundary.py
      - name: Observe generated-copy audio edit field causality
        if: inputs.phase == 'aac-edit'
        run: timeout --kill-after=90s 300s python3 apps/player/scripts/test-hls-nonkey-aac-edit.py
      - name: Preserve complete safe counterfactual receipt
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nonkey-mux-observation-${{ github.sha }}
          path: |
            .verification/hls-nonkey-mux/*/receipt.json
            .verification/hls-nonkey-mux/*/SHA256SUMS
            .verification/hls-nonkey-boundary/*/receipt.json
            .verification/hls-nonkey-boundary/*/SHA256SUMS
            .verification/hls-nonkey-aac-edit/*/receipt.json
            .verification/hls-nonkey-aac-edit/*/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  cutoff-contracts:
    if: inputs.phase == 'cutoff'
    name: Handled real SIGTERM and internal deadline owned joins
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: test ! -e .gates-disabled
      - name: Verify all strict parser, evidence and deadline controls
        run: python3 -m unittest discover -s apps/player/scripts -p 'test_hls_remaining_nonkey_*.py'
      - name: Prove real cutoff joins and receipt flush
        run: timeout --kill-after=30s 90s python3 apps/player/scripts/test-hls-nonkey-cutoff.py
      - name: Preserve safe cutoff receipts
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nonkey-cutoff-contracts-${{ github.sha }}
          path: .verification/hls-nonkey-cutoff/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
