name: Preserved AAC cold receipt projection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserved-public-projection:
    name: Compare retained complete AAC packet receipts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        timeout-minutes: 2
        with:
          artifact-ids: 11528526609
          run-id: 37727797685
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/readiness-projection
      - name: Emit checksum-bound safe complete comparison
        env:
          PROJECTION_ROOT: ${{ runner.temp }}/readiness-projection
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re
          from decimal import Decimal
          from pathlib import Path
          root=Path(os.environ['PROJECTION_ROOT'])
          def read(name,limit,sha):
              paths=list(root.rglob(name))
              assert len(paths)==1
              with paths[0].open('rb') as stream: raw=stream.read(limit+1)
              assert 0 < len(raw) <= limit and hashlib.sha256(raw).hexdigest()==sha
              return json.loads(raw)
          original=read('receipt.json',4<<20,'6e1e481439f5fdc146ce11b5a4f0e98e965091ac7a7dff0e355f2cd88c268f18')
          cold=read('uninterrupted-cold-control.json',2<<20,'66a5104017189bb5c70e51e493d3944b1c1f4375bfeb8b95df88ce5f6b8f8ed7')
          side=read('startup-readiness.json',1<<20,'be57e5bb5ce7cdb3d52752240e254e1c4590707d02c37f0b55362542a02dc0e2')
          revision='3d8d53268be53d22dcc6d32b4a3461aa2e3e6b39'
          assert original['revision']==cold['revision']==side['revision']==revision
          assert len(original['cases'])==2
          cases=original['cases']+[cold['case']]
          assert [c['name'] for c in cases]==['origin-refill','origin-control','uninterrupted-cold-control']
          fields={'pts_time','dts_time','duration_time','size','data_hash','side_data_list'}
          for c in cases:
              rows=c['joinedPublicPacketPayloads']
              assert 0 < len(rows) < 4096 and all(set(r)<=fields for r in rows)
              for r in rows:
                  assert re.fullmatch('SHA256:[a-f0-9]{64}',r['data_hash'])
                  assert re.fullmatch('[0-9]{1,8}',r['size'])
                  assert all(re.fullmatch('-?[0-9]{1,12}\\.[0-9]{1,12}',r[k]) for k in ['pts_time','dts_time','duration_time'])
                  assert len(r.get('side_data_list',[]))<=8
                  for s in r.get('side_data_list',[]):
                      assert set(s)<={'side_data_type','skip_samples','discard_padding','skip_reason','discard_reason'}
                      assert s.get('side_data_type')=='Skip Samples'
                      assert all(type(v) is int and 0<=v<=1<<20 for k,v in s.items() if k!='side_data_type')
          def comparison(a,b):
              ra,rb=a['joinedPublicPacketPayloads'],b['joinedPublicPacketPayloads']
              mismatches=[i for i,(x,y) in enumerate(zip(ra,rb)) if x!=y]
              payload=[i for i,(x,y) in enumerate(zip(ra,rb)) if x['data_hash']!=y['data_hash'] or x['size']!=y['size']]
              return {'names':[a['name'],b['name']],'counts':[len(ra),len(rb)],'exactEqual':ra==rb,
                  'mismatchCount':len(mismatches),'firstMismatch':mismatches[0] if mismatches else None,
                  'lastMismatch':mismatches[-1] if mismatches else None,'payloadMismatchCount':len(payload),
                  'fieldMismatchCounts':{k:sum(x.get(k)!=y.get(k) for x,y in zip(ra,rb)) for k in sorted(fields)},
                  'firstRows':[{'index':i,'a':ra[i],'b':rb[i]} for i in mismatches[:4]],
                  'payloadIndexShiftMatches':{str(shift):sum(ra[i]['data_hash']==rb[i+shift]['data_hash'] for i in range(len(ra)) if 0<=i+shift<len(rb)) for shift in range(-2,3)}}
          safe=[]
          for c in cases:
              rows=c['joinedPublicPacketPayloads']
              gaps=[Decimal(b['pts_time'])-Decimal(a['pts_time'])-Decimal(a['duration_time']) for a,b in zip(rows,rows[1:])]
              native=c['nativePCMQualification']
              pcm=c['fullEOFNativeSamples']
              physical=c.get('physicalAfterPublicDelivery',{})
              safe.append({'name':c['name'],'result':c['result'],'failures':c['failures'],
                  'packetCount':len(rows),'firstPacket':rows[0],'lastPacket':rows[-1],
                  'maxGap':str(max([Decimal(0)]+gaps)),'maxOverlap':str(max([Decimal(0)]+[-v for v in gaps])),
                  'initSHA256':c['initializationSHA256'],'fixtureSHA256':c['fixture']['sha256'],
                  'PCM':{k:pcm.get(k) for k in ['public','source','publicSHA256','sourceSHA256','decodedToEOF','trimmed','rateConversionApplied','channelConversionApplied']},
                  'nativePublic':{k:native['public'].get(k) for k in ['frames','samples','completeEOFAccounted','decodedClockOrderValid']},
                  'nativeSource':{k:native['source'].get(k) for k in ['frames','samples','completeEOFAccounted','decodedClockOrderValid']},
                  'endlist':physical.get('manifest',{}).get('endlist'),'sourceUnchanged':c.get('sourceUnchanged'),
                  'workerBound':c.get('workerBound'),'encoderLifecycle':c.get('encoderLifecycle'),
                  'emptyCacheBeforeFirstGET':c.get('emptyCacheBeforeFirstGET'),'preparationPosts':c.get('preparationPosts')})
          print(json.dumps({'revision':revision,'projectionResult':'passed','originalReceiptSHA256':side['originalReceiptSHA256'],
              'coldControlReceiptSHA256':side['coldControlReceiptSHA256'],'readinessFailures':side['failures'],
              'cases':safe,'comparisons':[comparison(cases[0],cases[1]),comparison(cases[0],cases[2])]},separators=(',',':')))
          PY
