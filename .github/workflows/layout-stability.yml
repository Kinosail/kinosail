name: Layout stability evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "apps/player/internal/server/**"
      - "apps/subtitles/internal/server/**"
      - "apps/player/e2e/layout-stability*"
      - "apps/player/e2e/login-readiness.spec.ts"
      - "apps/player/e2e/layout-audit-helpers.ts"
      - "packages/playerweb/**"
      - "packages/webassets/**"
      - "scripts/testing/*layout-stability*"
      - ".github/workflows/layout-stability.yml"
  schedule:
    - cron: "47 8 * * 1"
  workflow_dispatch:
    inputs:
      populated_suite:
        description: Run one populated Player suite instead of layout diagnosis
        type: choice
        options: [none, admission, selected, browse, configuration, beta]
        default: none

permissions:
  contents: read

concurrency:
  group: layout-evidence-${{ github.ref }}-${{ inputs.populated_suite || 'none' }}
  cancel-in-progress: true

jobs:
  native:
    name: Native layout (${{ matrix.browser }})
    if: >-
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'layout-evidence')) ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.populated_suite == 'none')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            quick: false
          - browser: webkit
            quick: true
          - browser: firefox
            quick: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: test ! -e .gates-disabled
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e
        with:
          version: 12.15.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: apps/player/e2e/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm --dir apps/player/e2e install --frozen-lockfile
      - run: pnpm --dir apps/player/e2e exec playwright install --with-deps "${{ matrix.browser }}"
      - name: Check pending geometry and keyboard fixtures
        env:
          KINOSAIL_BROWSER_MATRIX: full
          KINOSAIL_TEST_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ../../../.verification/layout-fixtures/results.json
        run: pnpm --dir apps/player/e2e exec playwright test --config layout-stability.config.ts --project "${{ matrix.browser }}" --reporter=list,json layout-stability.spec.ts skeleton-layout.spec.ts player-apple-intent.spec.ts player-apple-launch.spec.ts login-readiness.spec.ts layout-auth-navigation.spec.ts
      - name: Measure disposable native Servers
        env:
          KINOSAIL_LAYOUT_BROWSER: ${{ matrix.browser }}
          KINOSAIL_LAYOUT_QUICK: ${{ matrix.quick && '1' || '' }}
          KINOSAIL_LAYOUT_ENFORCE: "1"
          KINOSAIL_LAYOUT_VARIANTS: "1"
          KINOSAIL_LAYOUT_APPLE_SHIM: "1"
          KINOSAIL_LAYOUT_FLOWS: "1"
        run: python3 scripts/testing/test-layout-stability-local.py
      - name: Preserve safe measurements and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: layout-evidence-${{ matrix.browser }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .verification/layout/*/receipt.json
            .verification/layout/*/*/measurements.json
            .verification/layout/*/*/failure.json
            .verification/layout/*/*/*.png
            .verification/layout/*/*/failure-trace.zip
            .verification/layout/*/*/login-original-navigation-trace.zip
            .verification/layout/*/*/firefox-auth-form-navigation-recovery.json
            .verification/layout-fixtures/results.json
            .verification/layout-fixtures/**/login-original-navigation-trace.zip
            .verification/layout-fixtures/**/firefox-auth-form-navigation-recovery.json
            .verification/layout-fixtures/**/layout-login-rejection.json
            .verification/layout-fixtures/**/apple-intent-receipt.json
            .verification/layout-fixtures/**/native-pause-after-interruption.png
            .verification/layout-fixtures/**/trace.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14


  populated-instance:
    name: Populated Player admission
    if: github.event_name == 'workflow_dispatch' && inputs.populated_suite != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.populated_suite != 'admission' && 40 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: test ! -e .gates-disabled
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e
        with:
          version: 12.15.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: apps/player/e2e/pnpm-lock.yaml
      - run: pnpm --dir apps/player/e2e install --frozen-lockfile
      - run: pnpm --dir apps/player/e2e exec playwright install --with-deps chromium
      - name: Build the existing synthetic-catalog base image
        timeout-minutes: 15
        run: |
          revision="$(git rev-parse HEAD)"
          docker build --file apps/player/Containerfile --tag localhost/kinosail:dev --build-arg VERSION=qa --build-arg "REVISION=$revision" .
      - name: Install Chromium fixture trust tools
        run: sudo apt-get update && sudo apt-get install -y libnss3-tools
      - name: Admit the populated instance with retained evidence
        timeout-minutes: ${{ inputs.populated_suite != 'admission' && 24 || 12 }}
        working-directory: apps/player
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_TEST_IMAGE: localhost/kinosail:dev
          KINOSAIL_TEST_IMAGE_READY: '1'
          KINOSAIL_BROWSER_PROJECT: chromium
          KINOSAIL_E2E_VIDEO: 'off'
          KINOSAIL_POPULATED_SUITE: ${{ inputs.populated_suite }}
        run: >-
          python3 ../../scripts/ci/e2e-artifact.py
          --output "$GITHUB_WORKSPACE/.verification/populated-instance"
          -- bash ./scripts/test-populated-instance-hosted.sh
      - name: Retain the populated admission result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: populated-instance-${{ github.sha }}
          path: .verification/populated-instance/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
