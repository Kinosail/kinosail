name: Deep quality diagnostics

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-quality
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          package-manager-cache: false
      - run: go -C apps/subtitles mod download
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - run: ./scripts/quality/check-static.sh

  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [player, subtitles, dashboard, packages]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: ./scripts/quality/check-mutation.sh "${{ matrix.app }}"
