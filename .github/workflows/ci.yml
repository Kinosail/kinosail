name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select affected components
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      codeql: ${{ steps.select.outputs.codeql }}
      compiled: ${{ steps.select.outputs.compiled }}
      modules: ${{ steps.select.outputs.modules }}
      apps: ${{ steps.select.outputs.apps }}
      shards: ${{ steps.select.outputs.shards }}
      arm: ${{ steps.select.outputs.arm }}
      tools: ${{ steps.select.outputs.tools }}
      verified: ${{ steps.select.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: test ! -e .gates-disabled
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          CI_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/ci/plan.py

  repository:
    name: Repository policy and tooling
    needs: plan
    if: needs.plan.outputs.verified != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          version: 11.28.5
          install: false
          node-version-file: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: scripts/quality/pnpm-lock.yaml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: golangci-lint-${{ runner.os }}-
      - parallel:
          - name: Lint new Go issues in every module
            env:
              KINOSAIL_LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD~1' }}
            run: |
              curl --fail --location --proto '=https' --max-time 120 --output "$RUNNER_TEMP/golangci-lint.tar.gz" https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-linux-amd64.tar.gz
              printf '%s  %s\n' ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab "$RUNNER_TEMP/golangci-lint.tar.gz" | sha256sum --check
              tar -xzf "$RUNNER_TEMP/golangci-lint.tar.gz" -C "$RUNNER_TEMP" golangci-lint-2.14.0-linux-amd64/golangci-lint
              PATH="$RUNNER_TEMP/golangci-lint-2.14.0-linux-amd64:$PATH" ./scripts/quality/check-lint.sh
          - name: Check Go vulnerabilities in selected modules
            env:
              MODULES: ${{ needs.plan.outputs.modules }}
            run: |
              for directory in $(jq -r '.[].directory' <<< "$MODULES"); do
                go -C "$directory" run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
              done
          - run: make max-loc
          - run: make comments-check
          - run: python3 scripts/quality/check-dependency-integrity.py --browser-only
          - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
          - run: ./scripts/ci/validate-workflows.sh
          - run: ./scripts/ci/check-source-tools.sh
          - name: Check shared scripts and repository tooling
            env:
              WEB: ${{ fromJSON(needs.plan.outputs.plan).web }}
              TOOLING: ${{ fromJSON(needs.plan.outputs.plan).tooling }}
            run: |
              if [[ "$WEB" == true ]]; then
                pnpm --dir scripts/quality install --frozen-lockfile
                ./scripts/quality/check-script-lint.sh
              fi
              if [[ "$TOOLING" == true ]]; then make tooling-check; fi

  go:
    name: Go (${{ matrix.module }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    needs: plan
    if: needs.plan.outputs.verified != 'true' && needs.plan.outputs.modules != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: ${{ matrix.directory }}/go.mod
          cache-dependency-path: "**/go.sum"
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Install media fixture codecs
        env:
          MEDIA: ${{ matrix.media }}
        run: |
          [[ "$MEDIA" == true ]] || exit 0
          curl --fail --location --proto '=https' --max-time 120 --output "$RUNNER_TEMP/deep-ffmpeg.deb" https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v8.1.3-1/jellyfin-ffmpeg8_8.1.3-1-noble_amd64.deb
          printf '%s  %s\n' 188fa8b31f7e0ded9dadd1d11d1cd05482a7f03cec4e5c0af80aae21fde44ce4 "$RUNNER_TEMP/deep-ffmpeg.deb" | sha256sum --check
          sudo apt-get install -y --no-install-recommends "$RUNNER_TEMP/deep-ffmpeg.deb"
          echo /usr/lib/jellyfin-ffmpeg >> "$GITHUB_PATH"
      - name: Check the module contract
        env:
          DIRECTORY: ${{ matrix.directory }}
          CONTRACT: ${{ matrix.contract }}
        run: |
          read -ra targets <<< "$CONTRACT"
          make -C "$DIRECTORY" "${targets[@]}"
      - name: Run quick Go tests
        env:
          MODULE: ${{ matrix.module }}
          KINOSAIL_GO_TEST_MODE: quick
          KINOSAIL_GO_SHARD: ${{ matrix.shard }}
        run: ./scripts/ci/test-go.sh "$MODULE"
      - name: Verify certified first-fragment regeneration and cold reopen
        if: matrix.fragment == 'true'
        timeout-minutes: 3
        env:
          GOMAXPROCS: "2"
          KINOSAIL_COPIED_RECOVERY_MEDIA: "1"
        run: timeout --kill-after=5s 180s go -C apps/player test -p=1 ./internal/server -run '^TestCopiedRecoveryRealFirstFragmentRegenerationReopens$' -count=1 -timeout=170s -v
      - name: Check dependency integrity across consumers
        if: matrix.module == 'packages'
        run: go -C apps/subtitles mod download && python3 scripts/quality/check-dependency-integrity.py

  e2e:
    name: E2E (${{ matrix.app }} ${{ matrix.phase }})
    needs: plan
    if: needs.plan.outputs.verified != 'true' && needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/${{ matrix.app }}/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - parallel:
          - uses: ./.github/actions/setup-e2e
            with:
              app: ${{ matrix.app }}
          - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
            with:
              context: .
              file: apps/${{ matrix.app }}/Containerfile
              platforms: linux/amd64
              cache-from: type=gha,scope=${{ matrix.app }}-linux/amd64
              cache-to: type=gha,mode=max,scope=${{ matrix.app }}-linux/amd64
              load: true
              push: false
              tags: localhost/kinosail-${{ matrix.app }}:${{ github.sha }}
              build-args: |
                VERSION=sha-${{ github.sha }}
                REVISION=${{ github.sha }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.75.0
          image-ref: localhost/kinosail-${{ matrix.app }}:${{ github.sha }}
          cache-dir: ${{ runner.temp }}/trivy-${{ matrix.app }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Test production paths
        if: matrix.system == 'true'
        working-directory: apps/${{ matrix.app }}
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_TEST_IMAGE: localhost/kinosail-${{ matrix.app }}:${{ github.sha }}
          KINOSAIL_TEST_IMAGE_READY: "1"
        run: python3 ../../scripts/ci/e2e-artifact.py --output "${{ runner.temp }}/${{ matrix.app }}-system-e2e-artifact" -- ./scripts/test-container.sh
      - name: Test populated browser journeys
        working-directory: apps/${{ matrix.app }}
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_BROWSER_TEST: "1"
          KINOSAIL_BROWSER_PROJECT: chromium
          KINOSAIL_BROWSER_SMOKE: "1"
          KINOSAIL_BROWSER_PHASE: ${{ matrix.phase }}
          KINOSAIL_BROWSER_WORKERS: ${{ matrix.workers }}
          KINOSAIL_E2E_OUTPUT_DIR: ${{ runner.temp }}/${{ matrix.app }}-${{ matrix.phase }}-e2e-artifact/browser-results
          KINOSAIL_TEST_IMAGE: localhost/kinosail-${{ matrix.app }}:${{ github.sha }}
          KINOSAIL_TEST_IMAGE_READY: "1"
        run: python3 ../../scripts/ci/e2e-artifact.py --output "${{ runner.temp }}/${{ matrix.app }}-${{ matrix.phase }}-e2e-artifact" -- ./scripts/test-container.sh
      - name: Keep verifiable system E2E artifact
        if: always() && matrix.system == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.app }}-system-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.app }}-system-e2e-artifact
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
      - name: Keep verifiable E2E artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.app }}-${{ matrix.phase }}-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.app }}-${{ matrix.phase }}-e2e-artifact
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true

  proofs:
    name: Media proof (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.verified != 'true' && fromJSON(needs.plan.outputs.plan).player
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/player/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: ./.github/actions/setup-e2e
        with:
          app: player
          browsers: ${{ matrix.browser && 'chromium' || '' }}
      - name: Run the media proof shard
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/ci/proof_shard.py run player "$SHARD" --evidence-dir "$RUNNER_TEMP/proof-evidence"
      - name: Keep safe media proof evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: player-proof-${{ matrix.shard }}-evidence
          path: ${{ runner.temp }}/proof-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  arm:
    name: Production container (${{ matrix.app }} arm64)
    needs: plan
    if: needs.plan.outputs.verified != 'true' && needs.plan.outputs.arm != '[]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.arm) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/${{ matrix.app }}/Containerfile
          platforms: linux/arm64
          cache-from: type=gha,scope=${{ matrix.app }}-linux/arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-linux/arm64
          load: true
          push: false
          tags: localhost/kinosail-${{ matrix.app }}:${{ github.sha }}
          build-args: |
            VERSION=sha-${{ github.sha }}
            REVISION=${{ github.sha }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.75.0
          image-ref: localhost/kinosail-${{ matrix.app }}:${{ github.sha }}
          cache-dir: ${{ runner.temp }}/trivy-${{ matrix.app }}-arm64
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Test production paths
        working-directory: apps/${{ matrix.app }}
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_TEST_IMAGE: localhost/kinosail-${{ matrix.app }}:${{ github.sha }}
          KINOSAIL_TEST_IMAGE_READY: "1"
        run: python3 ../../scripts/ci/e2e-artifact.py --output "${{ runner.temp }}/${{ matrix.app }}-arm64-system-e2e-artifact" -- ./scripts/test-container.sh
      - name: Keep verifiable system E2E artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.app }}-arm64-system-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.app }}-arm64-system-e2e-artifact
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true

  tools:
    name: Installer and local pipeline (${{ matrix.app }})
    needs: plan
    if: needs.plan.outputs.verified != 'true' && needs.plan.outputs.tools != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.tools) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/${{ matrix.app }}/go.mod
          cache-dependency-path: "**/go.sum"
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          version: 11.28.5
          install: false
          node-version-file: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/${{ matrix.app }}/e2e/pnpm-lock.yaml
      - run: pnpm --dir e2e install --frozen-lockfile
      - run: make installer-test native-build local-pipeline-test

  client:
    name: Player Swift compilation
    needs: plan
    if: needs.plan.outputs.verified != 'true' && fromJSON(needs.plan.outputs.plan).client
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: make -C apps/player client-check
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

  android:
    name: Player Android compilation
    needs: plan
    if: needs.plan.outputs.verified != 'true' && fromJSON(needs.plan.outputs.plan).android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/player/apps/android/**/*.gradle*
            apps/player/apps/android/**/gradle.properties
            apps/player/apps/android/**/gradle-wrapper.properties
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-37.0'
      - run: ./gradlew --continue :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :watchcore:testDebugUnitTest :wear:assembleDebug :wear:testDebugUnitTest
        working-directory: apps/player/apps/android
      - name: Keep Android lint evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-lint-evidence
          path: apps/player/apps/android/app/build/reports/lint-results-debug.xml
          retention-days: 14
      - name: Keep Android unit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-unit-evidence
          path: |
            apps/player/apps/android/app/build/test-results/testDebugUnitTest/*.xml
            apps/player/apps/android/wear/build/test-results/testDebugUnitTest/*.xml
          retention-days: 14

  docs:
    name: Documentation build
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).docs && (needs.plan.outputs.verified != 'true' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: engineering/documentation
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: engineering/documentation/package-lock.json
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: |
          python3 scripts/tooling/generate-architecture-explorer.py player
          python3 scripts/tooling/generate-architecture-explorer.py subtitles
      - run: npm ci --prefix engineering/documentation --ignore-scripts
      - run: npm test --prefix engineering/documentation
      - run: python3 -m unittest discover -s engineering/documentation -p 'test_*.py'
      - run: python3 engineering/documentation/build.py --output "$RUNNER_TEMP/kinosail-docs"
      - run: python3 engineering/documentation/check.py "$RUNNER_TEMP/kinosail-docs"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/kinosail-docs

  security:
    name: Security scans
    needs: plan
    if: needs.plan.outputs.verified != 'true' && github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Scan every introduced commit for secrets
        env:
          KINOSAIL_REAL_SCANNER: gitleaks
        run: |
          go install -ldflags="-X github.com/zricethezav/gitleaks/v8/version.Version=8.30.1" github.com/zricethezav/gitleaks/v8@v8.30.1
          python3 -m unittest scripts.ci.test_receipt_fingerprints
          python3 scripts/ci/secrets.py
      - if: fromJSON(needs.plan.outputs.plan).supply
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.75.0
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - if: fromJSON(needs.plan.outputs.plan).supply && github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
      - if: contains(needs.plan.outputs.codeql, 'javascript-typescript')
        run: |
          echo 'CODEQL_ACTION_DIFF_INFORMED_QUERIES=false' >> "$GITHUB_ENV"
          echo 'CODEQL_OVERLAY_DATABASE_MODE=none' >> "$GITHUB_ENV"
      - if: needs.plan.outputs.codeql != ''
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: ${{ needs.plan.outputs.codeql }}
          config-file: .github/codeql-config.yml
          build-mode: none
          queries: security-extended
      - if: needs.plan.outputs.codeql != ''
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
      - name: Require zero open security findings on this ref
        if: needs.plan.outputs.codeql != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/code-scanning/alerts" \
            -f state=open -f ref="$GITHUB_REF" -f tool_name=CodeQL -f per_page=100 > alerts.json
          jq -e '[.[][] | select(.rule.security_severity_level != null)] | length == 0' alerts.json

  codeql-compiled:
    name: CodeQL compiled languages
    needs: plan
    if: needs.plan.outputs.verified != 'true' && github.event_name != 'merge_group' && needs.plan.outputs.compiled != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - if: contains(needs.plan.outputs.compiled, 'go')
        uses: ./.github/actions/setup-go
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - if: contains(needs.plan.outputs.compiled, 'java-kotlin')
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/player/apps/android/**/*.gradle*
            apps/player/apps/android/**/gradle.properties
            apps/player/apps/android/**/gradle-wrapper.properties
      - if: contains(needs.plan.outputs.compiled, 'java-kotlin')
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-37.0'
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: ${{ needs.plan.outputs.compiled }}
          config-file: .github/codeql-config.yml
          build-mode: manual
          queries: security-extended
      - if: contains(needs.plan.outputs.compiled, 'go')
        run: go build ./apps/player/... ./apps/subtitles/... ./packages/...
      - if: contains(needs.plan.outputs.compiled, 'java-kotlin')
        run: ./gradlew :app:assembleDebug :wear:assembleDebug
        working-directory: apps/player/apps/android
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
      - name: Require zero open security findings on this ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/code-scanning/alerts" \
            -f state=open -f ref="$GITHUB_REF" -f tool_name=CodeQL -f per_page=100 > alerts.json
          jq -e '[.[][] | select(.rule.security_severity_level != null)] | length == 0' alerts.json

  repository-required:
    name: Repository checks
    if: always()
    needs: [plan, repository, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: test ! -e .gates-disabled
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/required.py repository

  player-required:
    name: Player checks
    if: always()
    needs: [plan, go, e2e, proofs, arm, tools, client, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: test ! -e .gates-disabled
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/required.py app

  subtitles-required:
    name: Subtitles checks
    if: always()
    needs: [plan, go, e2e, proofs, arm, tools, client, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: test ! -e .gates-disabled
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/required.py app

  security-required:
    name: Security checks
    if: always()
    needs: [plan, security, codeql-compiled]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: test ! -e .gates-disabled
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/required.py security

  publish:
    name: Publish verified containers
    needs: [plan, repository-required, player-required, subtitles-required, security-required]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.plan.result == 'success' &&
      needs.repository-required.result == 'success' &&
      needs.player-required.result == 'success' &&
      needs.subtitles-required.result == 'success' &&
      needs.security-required.result == 'success' &&
      (fromJSON(needs.plan.outputs.plan).player || fromJSON(needs.plan.outputs.plan).subtitles)
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      plan: ${{ needs.plan.outputs.plan }}
      results: ${{ toJSON(needs) }}

  publish-docs:
    name: Publish verified documentation
    needs: [plan, docs, repository-required, player-required, subtitles-required, security-required]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.plan.result == 'success' &&
      needs.docs.result == 'success' &&
      needs.repository-required.result == 'success' &&
      needs.player-required.result == 'success' &&
      needs.subtitles-required.result == 'success' &&
      needs.security-required.result == 'success' &&
      fromJSON(needs.plan.outputs.plan).docs
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  notify-indexnow:
    name: Notify IndexNow of changed documentation
    needs: publish-docs
    if: needs.publish-docs.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Submit changed public URLs
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 engineering/documentation/indexnow.py "$BEFORE" "$AFTER"
