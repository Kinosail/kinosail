name: Deep verification

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      scan_diagnostic:
        description: Keep metadata-only full-history scan evidence
        type: boolean
        default: false
      native_probe:
        description: Add one isolated native regression suite after the complete deep run
        type: choice
        options: [none, AAC, storage, reader]
        default: none
      coverage_diagnostic:
        description: Keep exact deep Go coverage profiles
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deep-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    name: Select every component
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      shards: ${{ steps.select.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: test ! -e .gates-disabled
      - id: select
        env:
          CI_FULL: "true"
          CI_DEEP: "true"
        run: python3 scripts/ci/plan.py

  race:
    name: Go race and coverage (${{ matrix.module }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: player
            directory: apps/player
          - module: subtitles
            directory: apps/subtitles
          - module: packages
            directory: packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: ${{ matrix.directory }}/go.mod
          cache-dependency-path: "**/go.sum"
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Install media fixture codecs
        run: |
          curl --fail --location --proto '=https' --max-time 120 --output "$RUNNER_TEMP/deep-ffmpeg.deb" https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v8.1.3-1/jellyfin-ffmpeg8_8.1.3-1-noble_amd64.deb
          printf '%s  %s\n' 188fa8b31f7e0ded9dadd1d11d1cd05482a7f03cec4e5c0af80aae21fde44ce4 "$RUNNER_TEMP/deep-ffmpeg.deb" | sha256sum --check
          sudo apt-get install -y --no-install-recommends "$RUNNER_TEMP/deep-ffmpeg.deb"
          echo /usr/lib/jellyfin-ffmpeg >> "$GITHUB_PATH"
      - env:
          APP: ${{ matrix.module }}
          KINOSAIL_GO_TEST_MODE: deep
          KINOSAIL_COPIED_RECOVERY_MEDIA: "1"
          KINOSAIL_TRANSCODE_REFILL_EVIDENCE: ${{ matrix.module == 'player' && format('{0}/transcode-refill', runner.temp) || '' }}
        run: ./scripts/ci/test-go.sh "$APP"
      - name: Checksum public transcode refill evidence
        if: always() && matrix.module == 'player'
        run: |
          git diff --quiet
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$RUNNER_TEMP/transcode-refill/revision.txt"
          cd "$RUNNER_TEMP/transcode-refill"
          sha256sum -- *.jsonl revision.txt > SHA256SUMS
      - name: Keep public transcode refill evidence
        if: always() && matrix.module == 'player'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: player-transcode-refill-${{ github.sha }}
          path: ${{ runner.temp }}/transcode-refill/
          if-no-files-found: error
          retention-days: 30
      - name: Verify CLI startup latency
        id: cli_startup
        if: matrix.module != 'packages'
        env:
          APP: ${{ matrix.module }}
        run: python3 scripts/testing/test-cli-startup.py --app "$APP" --output "$RUNNER_TEMP/cli-startup"
      - name: Keep CLI startup evidence
        if: always() && matrix.module != 'packages' && (steps.cli_startup.outcome == 'success' || steps.cli_startup.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.module }}-cli-startup-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cli-startup/*.json
            ${{ runner.temp }}/cli-startup/*.log
          if-no-files-found: error
          retention-days: 30
      - name: Summarize exact deep coverage
        if: always() && github.event_name == 'workflow_dispatch' && inputs.coverage_diagnostic
        working-directory: ${{ matrix.directory }}
        run: go tool cover -func=.verification/coverage.out > .verification/coverage-functions.txt
      - name: Keep exact deep coverage profiles
        if: always() && github.event_name == 'workflow_dispatch' && inputs.coverage_diagnostic
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.module }}-go-coverage-${{ github.sha }}
          path: |
            ${{ matrix.directory }}/.verification/coverage.out
            ${{ matrix.directory }}/.verification/coverage-functions.txt
          if-no-files-found: error
          retention-days: 3

  browser:
    name: Complete browser suite (${{ matrix.app }} ${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [player, subtitles]
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/${{ matrix.app }}/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - parallel:
          - uses: ./.github/actions/setup-e2e
            with:
              app: ${{ matrix.app }}
              browsers: ${{ matrix.engine }}
          - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
            with:
              context: .
              file: apps/${{ matrix.app }}/Containerfile
              platforms: linux/amd64
              cache-from: type=gha,scope=${{ matrix.app }}-linux/amd64
              cache-to: type=gha,mode=max,scope=${{ matrix.app }}-linux/amd64
              load: true
              push: false
              tags: localhost/kinosail-${{ matrix.app }}:${{ github.sha }}
              build-args: |
                VERSION=sha-${{ github.sha }}
                REVISION=${{ github.sha }}
      - name: Test complete browser journeys
        working-directory: apps/${{ matrix.app }}
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_BROWSER_TEST: "1"
          KINOSAIL_BROWSER_MATRIX: full
          KINOSAIL_BROWSER_PROJECT: ${{ matrix.engine }}
          KINOSAIL_BROWSER_WORKERS: ${{ matrix.app == 'player' && '3' || '1' }}
          KINOSAIL_E2E_OUTPUT_DIR: ${{ runner.temp }}/${{ matrix.app }}-${{ matrix.engine }}-e2e-artifact/browser-results
          KINOSAIL_TEST_IMAGE: localhost/kinosail-${{ matrix.app }}:${{ github.sha }}
          KINOSAIL_TEST_IMAGE_READY: "1"
        run: python3 ../../scripts/ci/e2e-artifact.py --output "${{ runner.temp }}/${{ matrix.app }}-${{ matrix.engine }}-e2e-artifact" -- ./scripts/test-container.sh
      - name: Keep verifiable E2E artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.app }}-${{ matrix.engine }}-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.app }}-${{ matrix.engine }}-e2e-artifact
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true

  system:
    name: Production container (${{ matrix.app }} ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [player, subtitles]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/${{ matrix.app }}/Containerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.platform }}
          load: true
          push: false
          tags: localhost/kinosail-${{ matrix.app }}:${{ github.sha }}
          build-args: |
            VERSION=sha-${{ github.sha }}
            REVISION=${{ github.sha }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          image-ref: localhost/kinosail-${{ matrix.app }}:${{ github.sha }}
          cache-dir: ${{ runner.temp }}/trivy-${{ matrix.app }}-${{ matrix.runner }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Test production paths
        working-directory: apps/${{ matrix.app }}
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_TEST_IMAGE: localhost/kinosail-${{ matrix.app }}:${{ github.sha }}
          KINOSAIL_TEST_IMAGE_READY: "1"
        run: python3 ../../scripts/ci/e2e-artifact.py --output "${{ runner.temp }}/${{ matrix.app }}-${{ matrix.runner }}-system-e2e-artifact" -- ./scripts/test-container.sh
      - name: Keep verifiable system E2E artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.app }}-${{ matrix.runner }}-system-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.app }}-${{ matrix.runner }}-system-e2e-artifact
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true

  proofs:
    name: Media proof (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/player/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: ./.github/actions/setup-e2e
        with:
          app: player
          browsers: ${{ matrix.browser && 'chromium' || '' }}
      - name: Run the media proof shard
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/ci/proof_shard.py run player "$SHARD" --evidence-dir "$RUNNER_TEMP/proof-evidence"
      - name: Keep safe media proof evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: player-proof-${{ matrix.shard }}-evidence
          path: ${{ runner.temp }}/proof-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  tools:
    name: Installer and local pipeline (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [player, subtitles]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/${{ matrix.app }}/go.mod
          cache-dependency-path: "**/go.sum"
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          version: 12.15.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/${{ matrix.app }}/e2e/pnpm-lock.yaml
      - run: pnpm --dir e2e install --frozen-lockfile
      - run: make installer-test native-build local-pipeline-test

  client:
    name: Player native contracts
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: make -C apps/player client-check
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      - name: Prepare decoded native media fixture
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          media="$RUNNER_TEMP/native-media.mp4"
          ffmpeg -nostdin -v error -f lavfi -i testsrc2=s=320x180:r=12:d=12 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=12 \
            -c:v libx264 -threads 1 -preset ultrafast -crf 38 -pix_fmt yuv420p \
            -c:a aac -b:a 48k -movflags +faststart -shortest "$media"
          test "$(stat -f %z "$media")" -le 1048576
          shasum -a 256 "$media" > "$RUNNER_TEMP/native-media.sha256"
          ffprobe -v error -show_format -show_streams -of json "$media" > "$RUNNER_TEMP/native-media.json"
          for name in kinosail-appletv-task7-media.mp4 kinosail-player-buffer-bar.mp4 kinosail-landscape-task10-media.mp4; do
            ln "$media" "/tmp/$name"
          done
      - name: Execute iOS and tvOS native contracts
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
        run: |
          native_failed=0
          for contract in iOS-backup iOS tvOS; do
            platform="${contract%%-*}"
            device="$(xcrun simctl list devices available --json | python3 scripts/ci/select-simulator.py "$platform")"
            command=(xcodebuild test -project apps/player/apps/native/Kinosail.xcodeproj
              -scheme "Kinosail-$platform" -destination "id=$device"
              -derivedDataPath "apps/player/apps/native/.build/$([[ "$platform" == iOS ]] && echo ios || echo tvos)-simulator"
              -resultBundlePath "$RUNNER_TEMP/native-$contract.xcresult"
              -parallel-testing-enabled NO -collect-test-diagnostics never CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-)
            if [[ "$contract" == iOS-backup ]]; then
              command+=(-only-testing:Kinosail-iOSTests/OfflineCatalogBackupTests)
              printf 'TEST_RUNNER_KINOSAIL_FRESH_BACKUP_TEST=1 ' > "$RUNNER_TEMP/native-$contract-command.txt"
              printf '%q ' "${command[@]}" >> "$RUNNER_TEMP/native-$contract-command.txt"
              shasum -a 256 apps/player/apps/native/Sources/Platform/OfflineCatalogStore.swift \
                apps/player/apps/native/Tests/OfflineCatalogBackupTests.swift > "$RUNNER_TEMP/native-$contract-sources.sha256"
              if ! TEST_RUNNER_KINOSAIL_FRESH_BACKUP_TEST=1 "${command[@]}"; then native_failed=1; fi
            elif ! "${command[@]}"; then
              native_failed=1
            fi
          done
          exit "$native_failed"
      - name: Inspect native contract results
        if: always()
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
        run: |
          native_failed=0
          for contract in iOS-backup iOS tvOS; do
            summary="$RUNNER_TEMP/native-$contract-summary.json"
            if ! xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/native-$contract.xcresult" --compact \
              > "$summary" 2> "$RUNNER_TEMP/native-$contract-summary.stderr"; then
              native_failed=1
              continue
            fi
            if ! python3 scripts/ci/inspect-native-results.py "$contract" "$summary" "$GITHUB_SHA" \
              > "$RUNNER_TEMP/native-$contract-receipt.json"; then
              native_failed=1
            fi
          done
          exit "$native_failed"
      - name: Validate focused probe
        id: probe
        if: always() && inputs.native_probe != 'none'
        env:
          NATIVE_PROBE: ${{ inputs.native_probe }}
        run: |
          [[ ${#NATIVE_PROBE} -le 7 ]]
          case "$NATIVE_PROBE" in
            AAC) selector=DownloadAACProbeTests ;;
            storage) selector=DownloadStorageAuthorizationTests ;;
            reader) selector='NativePreferencesUXTests/readerPendingMatchesLoadedColumnAndClearsAtTerminalStates(light:fontSize:)' ;;
            *) exit 2 ;;
          esac
          printf 'selector=%s\n' "$selector" >> "$GITHUB_OUTPUT"
      - name: Execute one iOS probe suite
        if: always() && inputs.native_probe != 'none' && steps.probe.outcome == 'success'
        env:
          SELECTOR: ${{ steps.probe.outputs.selector }}
          NATIVE_PROBE: ${{ inputs.native_probe }}
          DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
        run: |
          run="$RUNNER_TEMP/native-probe"
          mkdir "$run"
          device="$(xcrun simctl list devices available --json | python3 scripts/ci/select-simulator.py iOS)"
          command=(xcodebuild test -project apps/player/apps/native/Kinosail.xcodeproj -scheme Kinosail-iOS
            -destination "id=$device" -derivedDataPath apps/player/apps/native/.build/ios-simulator
            -resultBundlePath "$run/native.xcresult" "-only-testing:Kinosail-iOSTests/$SELECTOR"
            -parallel-testing-enabled NO -collect-test-diagnostics never CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-)
          if [[ "$NATIVE_PROBE" == reader ]]; then command+=(-test-iterations 3); fi
          printf '%q ' "${command[@]}" > "$run/command.txt"
          if "${command[@]}" > "$run/native.log" 2>&1; then status=0; else status=$?; fi
          export NATIVE_PROBE_EXIT="$status" NATIVE_PROBE_RUN="$run" NATIVE_PROBE_DEVICE="$device"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, re, subprocess, sys
          run = pathlib.Path(os.environ['NATIVE_PROBE_RUN'])
          suite, count, data = {'AAC': ('DownloadAACProbeTests', 2, 'Embedded 2106-byte AAC; malformed/truncated/wrong-kind/playlist/symlink/remote controls'),
              'storage': ('DownloadStorageAuthorizationTests', 1, 'Synthetic blocked journal root; 40 scoped denials, reset and authorization'),
              'reader': ('NativeReaderSurfaceJourneys', 1, 'Held loopback metadata; light/dark appearance and 20/32 point font; pending/loaded/empty/failed states')}[os.environ['NATIVE_PROBE']]
          iterations = 3 if os.environ['NATIVE_PROBE'] == 'reader' else 1
          status = int(os.environ['NATIVE_PROBE_EXIT'])
          matches = re.findall(r'Test run with (\d+) tests? .*passed', (run / 'native.log').read_text())
          discovered = bool(matches and int(matches[-1]) == count)
          if iterations > 1:
              discovered = matches == [str(count)]
              try:
                  raw = subprocess.check_output(['xcrun', 'xcresulttool', 'get', 'test-results', 'test-details',
                      '--path', str(run / 'native.xcresult'), '--test-id', os.environ['SELECTOR'], '--compact'], text=True)
                  (run / 'test-details.json').write_text(raw)
                  details = json.loads(raw)
                  groups = details['testRuns']
                  discovered = discovered and details['testIdentifier'] == os.environ['SELECTOR'] and details['testResult'] == 'Passed'
                  discovered = discovered and len(groups) == 4 and {group['name'] for group in groups} == {'false, 20', 'false, 32', 'true, 20', 'true, 32'}
                  for group in groups:
                      repeats = [child for child in group['children'] if child['nodeType'] == 'Repetition']
                      discovered = discovered and group['nodeType'] == 'Arguments' and group['result'] == 'Passed'
                      discovered = discovered and len(repeats) == iterations and {item['nodeIdentifier'] for item in repeats} == {'1', '2', '3'}
                      discovered = discovered and all(item['result'] == 'Passed' for item in repeats)
              except (OSError, subprocess.CalledProcessError, ValueError, KeyError, TypeError):
                  discovered = False
          receipt = {'revision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'command': (run / 'command.txt').read_text(), 'probe': os.environ['NATIVE_PROBE'],
              'environment': platform.platform(), 'xcode': subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
              'simulator': os.environ['NATIVE_PROBE_DEVICE'], 'data': data,
              'fixtureSourceSHA256': hashlib.sha256(pathlib.Path('apps/player/apps/native/Tests', suite + '.swift').read_bytes()).hexdigest(),
              'expectedTests': count, 'expectedIterations': iterations, 'discoveryVerified': discovered, 'exitCode': status,
              'result': 'passed' if status == 0 and discovered else 'failed',
              'boundaries': 'Focused iOS simulator regression; no physical device or full-suite proof'}
          (run / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          if status == 0 and not discovered: sys.exit('Expected native tests were not discovered')
          PY
          exit "$status"
      - name: Retain native test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: player-native-contracts-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-*.xcresult
            ${{ runner.temp }}/native-*-summary.json
            ${{ runner.temp }}/native-*-summary.stderr
            ${{ runner.temp }}/native-*-receipt.json
            ${{ runner.temp }}/native-*-command.txt
            ${{ runner.temp }}/native-*-sources.sha256
            ${{ runner.temp }}/native-media.json
            ${{ runner.temp }}/native-media.sha256
            ${{ runner.temp }}/native-probe
          retention-days: 14
          if-no-files-found: error

  android:
    name: Player Android runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/player/apps/android/**/*.gradle*
            apps/player/apps/android/**/gradle.properties
            apps/player/apps/android/**/gradle-wrapper.properties
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-37.0 emulator system-images;android-36;google_apis;x86_64'
      - run: ./gradlew --continue :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :watchcore:testDebugUnitTest :wear:assembleDebug :wear:testDebugUnitTest
        working-directory: apps/player/apps/android
      - name: Build Android UI test APK
        run: ./gradlew :app:assembleDebugAndroidTest
        working-directory: apps/player/apps/android
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: apps/player/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Exercise native Android caption safe areas
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        env:
          GOMAXPROCS: "2"
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          test -c /dev/kvm
          sudo chown "$USER" /dev/kvm
          python3 apps/player/scripts/test-android-captions.py --output "${{ runner.temp }}/android-caption-qa"
      - name: Keep safe Android caption evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-caption-evidence
          path: ${{ runner.temp }}/android-caption-qa/safe
          retention-days: 14
          if-no-files-found: error

  wear:
    name: Player Wear journeys (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [small-round, large-round]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/player/apps/android/**/*.gradle*
            apps/player/apps/android/**/gradle.properties
            apps/player/apps/android/**/gradle-wrapper.properties
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-37.0 emulator system-images;android-36;android-wear-signed;x86_64'
      - name: Build Wear app and instrumentation APKs
        run: ./gradlew :wear:assembleDebug :wear:assembleDebugAndroidTest
        working-directory: apps/player/apps/android
      - name: Exercise Wear launch and recreation
        run: |
          test -c /dev/kvm
          sudo chown "$USER" /dev/kvm
          python3 apps/player/scripts/test-wear-journeys.py --profile "${{ matrix.profile }}" --output "${{ runner.temp }}/wear-journey-qa"
      - name: Keep safe Wear evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wear-journey-evidence-${{ matrix.profile }}
          path: ${{ runner.temp }}/wear-journey-qa/safe
          retention-days: 14
          if-no-files-found: error

  security:
    name: Complete security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - id: scanner_install
        run: go install -ldflags="-X github.com/zricethezav/gitleaks/v8/version.Version=8.30.1" github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Test exact receipt digest exceptions with the pinned scanner
        env:
          KINOSAIL_REAL_SCANNER: gitleaks
        run: python3 -m unittest scripts.ci.test_receipt_fingerprints
      - run: python3 scripts/ci/secrets.py
      - name: Keep full-history finding locations
        if: always() && github.event_name == 'workflow_dispatch' && inputs.scan_diagnostic && steps.scanner_install.outcome == 'success'
        run: python3 scripts/ci/scan-diagnostic.py --output "$RUNNER_TEMP/scan-safe.json"
      - name: Upload only validated finding locations
        if: always() && github.event_name == 'workflow_dispatch' && inputs.scan_diagnostic && steps.scanner_install.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: full-history-scan-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scan-safe.json
          if-no-files-found: error
          retention-days: 3
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - run: |
          echo 'CODEQL_ACTION_DIFF_INFORMED_QUERIES=false' >> "$GITHUB_ENV"
          echo 'CODEQL_OVERLAY_DATABASE_MODE=none' >> "$GITHUB_ENV"
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: javascript-typescript,python,actions
          config-file: .github/codeql-config.yml
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
      - name: Require zero open security findings on this ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/code-scanning/alerts" \
            -f state=open -f ref="$GITHUB_REF" -f tool_name=CodeQL -f per_page=100 > alerts.json
          jq -e '[.[][] | select(.rule.security_severity_level != null)] | length == 0' alerts.json

