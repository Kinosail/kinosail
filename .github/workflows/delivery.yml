name: Continuous container delivery

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verified:
    name: Require all CI for this main commit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      apps: ${{ steps.verify.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: verify
        run: python3 scripts/ci/delivery.py
        env:
          CI_PLAN: ${{ inputs.plan }}
          GH_TOKEN: ${{ github.token }}

  images:
    name: Build, test, and scan ${{ matrix.app }} (${{ matrix.arch }})
    needs: verified
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.verified.outputs.apps) }}
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
        # Explicit architecture axis makes one independent build per app/platform.
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: apps/${{ matrix.app }}/Containerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/kinosail/kinosail-${{ matrix.app }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          build-args: |
            VERSION=sha-${{ github.sha }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}-linux/${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-linux/${{ matrix.arch }}
          sbom: true
          provenance: mode=max
      - name: Test the production image by digest
        env:
          APP: ${{ matrix.app }}
          IMAGE: ghcr.io/kinosail/kinosail-${{ matrix.app }}@${{ steps.build.outputs.digest }}
        run: ./scripts/ci/test-image.sh "$APP" "$IMAGE"
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/kinosail/kinosail-${{ matrix.app }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Export tested and scanned digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.app }}-digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1
          if-no-files-found: error

  manifest:
    name: Publish ${{ matrix.app }} container
    needs: [verified, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.verified.outputs.apps) }}
    env:
      IMAGE: ghcr.io/kinosail/kinosail-${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: ${{ matrix.app }}-digest-*
          path: digests
          merge-multiple: true
      - id: manifest
        name: Assemble and verify both architectures
        run: |
          sources=()
          for digest in digests/*; do
            digest="${digest##*/}"
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          [[ ${#sources[@]} -eq 2 ]]
          candidate="$IMAGE:candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools create --tag "$candidate" "${sources[@]}"
          docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' manifest.json
          digest="$(jq -r .digest manifest.json)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign tested image digest
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify --certificate-identity https://github.com/Kinosail/kinosail/.github/workflows/delivery.yml@refs/heads/main --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE@$DIGEST"
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Publish deployable commit tag
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE@$DIGEST"
          # shellcheck disable=SC2016 # Markdown backticks are literal.
          printf '### Deployable container\n\n`%s@%s`\n\nCommit tag: `%s:sha-%s`\n' "$IMAGE" "$DIGEST" "$IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Advance ${{ matrix.app }} production tags
    needs: [verified, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: container-promotion-${{ matrix.app }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.verified.outputs.apps) }}
    env:
      IMAGE: ghcr.io/kinosail/kinosail-${{ matrix.app }}
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the signed commit image without rebuilding
        run: |
          DIGEST="$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -er .digest)"
          export DIGEST
          python3 scripts/ci/promote.py
