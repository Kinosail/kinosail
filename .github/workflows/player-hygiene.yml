name: Player Hygiene

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  merge_group:
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

concurrency:
  group: player-hygiene-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read # Gitleaks reads pull-request metadata.

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      full: ${{ inputs.full || false }}

  static:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).player
    timeout-minutes: 20
    name: Player static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/player
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/player/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          working-directory: apps/player
          args: --timeout=5m --new-from-rev=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'HEAD~1' }}
      - name: Install archive test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - name: Check module and container boundary
        run: make single-container tidy-check

  race:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).player
    timeout-minutes: 20
    name: Player race tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/player
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/player/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Install archive test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - run: ../../scripts/ci/test-go.sh player

  security:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).player
    timeout-minutes: 20
    name: Player security checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/player
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/player/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  tooling:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).player_tools
    timeout-minutes: 20
    name: Player installer, native, and local pipeline checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/player
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/player/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Install archive test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/player/e2e/pnpm-lock.yaml
      - run: pnpm --dir e2e install --frozen-lockfile
      - run: make installer-test native-build local-pipeline-test

  client:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).client
    timeout-minutes: 20
    name: Player Swift client compilation
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/player
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: make client-check

  scheduled:
    name: Player scheduled ${{ matrix.check }}
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).deep
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/player
    strategy:
      fail-fast: false
      matrix:
        check: [performance, fuzz, deadcode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/player/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Measure Player performance
        if: matrix.check == 'performance'
        run: make performance-test
      - name: Fuzz backup restore boundary
        if: matrix.check == 'fuzz'
        run: |
          ../../scripts/tooling/with-go-module.sh go test -list '^FuzzRestoreWritesOnlyConfigurationState$' ./internal/backup | grep -Fx FuzzRestoreWritesOnlyConfigurationState
          ../../scripts/tooling/with-go-module.sh go test -run '^$' -fuzz '^FuzzRestoreWritesOnlyConfigurationState$' -fuzztime 30s ./internal/backup
      - name: Report unreachable Go functions
        if: matrix.check == 'deadcode'
        run: make deadcode

  system:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).player
    timeout-minutes: 20
    name: Player system (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/player
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(fromJSON(needs.changes.outputs.plan).player_arm && '[{"platform":"linux/amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]' || '[{"platform":"linux/amd64","runner":"ubuntu-latest"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: matrix.platform == 'linux/amd64'
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: matrix.platform == 'linux/amd64'
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install browser-test dependencies
        if: matrix.platform == 'linux/amd64'
        working-directory: apps/player/e2e
        run: pnpm install --frozen-lockfile
      - name: Install browser-test runtime
        if: matrix.platform == 'linux/amd64'
        working-directory: apps/player/e2e
        run: |
          read -ra browsers <<< "$BROWSERS"
          pnpm exec playwright install --with-deps "${browsers[@]}"
        env:
          BROWSERS: ${{ fromJSON(needs.changes.outputs.plan).player_browsers && 'chromium firefox webkit' || 'chromium' }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build Player test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/player/Containerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=player-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=player-${{ matrix.platform }}
          load: true
          push: false
          tags: localhost/kinosail-player:${{ github.sha }}
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
      - name: Test ARM64 production container and restart persistence
        if: matrix.platform == 'linux/arm64'
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_PLATFORM: ${{ matrix.platform }}
          KINOSAIL_TEST_IMAGE: localhost/kinosail-player:${{ github.sha }}
          KINOSAIL_TEST_IMAGE_READY: "1"
        run: ./scripts/test-container.sh
      - name: Test AMD64 production and browser paths
        if: matrix.platform == 'linux/amd64'
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_BROWSER_MATRIX: ${{ fromJSON(needs.changes.outputs.plan).player_browsers && 'full' || '' }}
          KINOSAIL_BROWSER_WORKERS: "3"
          KINOSAIL_PLATFORM: ${{ matrix.platform }}
          KINOSAIL_TEST_IMAGE: localhost/kinosail-player:${{ github.sha }}
          KINOSAIL_TEST_IMAGE_READY: "1"
        run: |
          status=0
          ./scripts/test-container.sh &
          production_pid=$!
          KINOSAIL_BROWSER_TEST=1 ./scripts/test-container.sh &
          browser_pid=$!
          wait "$production_pid" || status=$?
          wait "$browser_pid" || status=$?
          exit "$status"


  required:
    name: Player checks
    if: always()
    needs: [changes, static, race, security, system, tooling, scheduled, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/required.py player
