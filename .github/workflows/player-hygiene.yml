name: Player Hygiene

on:
  pull_request:
    paths:
      - "apps/player/**"
      - "packages/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/player-hygiene.yml"
      - ".github/workflows/player-release.yml"
      - "scripts/ci/**"
      - "scripts/tooling/**"
      - ".containerignore"
      - ".dockerignore"
  push:
    branches: [main]
    paths:
      - "apps/player/**"
      - "packages/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/player-hygiene.yml"
      - ".github/workflows/player-release.yml"
      - "scripts/ci/**"
      - "scripts/tooling/**"
      - ".containerignore"
      - ".dockerignore"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: player-hygiene-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # Gitleaks reads pull-request metadata.

jobs:
  gates:
    name: Check temporary gate pause
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.state.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: state
        run: |
          if [ -f .gates-disabled ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  static:
    needs: gates
    if: needs.gates.outputs.enabled == 'true'
    name: Player static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/player
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/player/go.mod
          cache-dependency-path: apps/player/go.sum
      - name: Check shared Player-baseline packages
        working-directory: packages
        run: make tidy-check coverage test-race
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          working-directory: apps/player
          args: --timeout=5m --new-from-rev=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'HEAD~1' }}
      - name: Install archive test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - name: Check module, coverage, size, and container boundary
        run: make max-loc single-container tidy-check coverage
      - name: Check shell scripts and workflows with verified tools
        working-directory: .
        run: ./scripts/ci/check-source-tools.sh
      - name: Check monorepo workflow boundaries
        working-directory: .
        run: ./scripts/ci/validate-workflows.sh

  race:
    needs: gates
    if: needs.gates.outputs.enabled == 'true'
    name: Player race tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/player
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/player/go.mod
          cache-dependency-path: apps/player/go.sum
      - name: Install archive test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - run: go test -race ./...

  security:
    needs: gates
    if: needs.gates.outputs.enabled == 'true'
    name: Player security checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/player
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/player/go.mod
          cache-dependency-path: apps/player/go.sum
      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Scan secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tooling:
    needs: gates
    if: needs.gates.outputs.enabled == 'true'
    name: Player installer, native, and local pipeline checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/player
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/player/go.mod
          cache-dependency-path: apps/player/go.sum
      - name: Install archive test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - run: make installer-test native-build local-pipeline-test

  client:
    needs: gates
    if: needs.gates.outputs.enabled == 'true'
    name: Player Swift client compilation
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/player
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: make client-check

  scheduled:
    needs: gates
    name: Player scheduled ${{ matrix.check }}
    if: ${{ needs.gates.outputs.enabled == 'true' && (github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/player
    strategy:
      fail-fast: false
      matrix:
        check: [performance, fuzz, deadcode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/player/go.mod
          cache-dependency-path: apps/player/go.sum
      - name: Measure Player performance
        if: matrix.check == 'performance'
        run: make performance-test
      - name: Fuzz backup restore boundary
        if: matrix.check == 'fuzz'
        run: |
          ../../scripts/tooling/with-go-module.sh go test -list '^FuzzRestoreWritesOnlyConfigurationState$' ./internal/backup | grep -Fx FuzzRestoreWritesOnlyConfigurationState
          ../../scripts/tooling/with-go-module.sh go test -run '^$' -fuzz '^FuzzRestoreWritesOnlyConfigurationState$' -fuzztime 30s ./internal/backup
      - name: Report unreachable Go functions
        if: matrix.check == 'deadcode'
        run: make deadcode

  system:
    needs: gates
    if: needs.gates.outputs.enabled == 'true'
    name: Player system (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/player
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: matrix.platform == 'linux/amd64'
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: matrix.platform == 'linux/amd64'
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install browser-test dependencies
        if: matrix.platform == 'linux/amd64'
        working-directory: apps/player/e2e
        run: pnpm install --frozen-lockfile
      - name: Install browser-test runtime
        if: matrix.platform == 'linux/amd64'
        working-directory: apps/player/e2e
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build Player test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/player/Containerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: localhost/kinosail-player:${{ github.sha }}
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
      - name: Test ARM64 production container and restart persistence
        if: matrix.platform == 'linux/arm64'
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_PLATFORM: ${{ matrix.platform }}
          KINOSAIL_TEST_IMAGE: localhost/kinosail-player:${{ github.sha }}
          KINOSAIL_TEST_IMAGE_READY: "1"
        run: ./scripts/test-container.sh
      - name: Test AMD64 production and browser paths
        if: matrix.platform == 'linux/amd64'
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_BROWSER_MATRIX: full
          KINOSAIL_BROWSER_WORKERS: "3"
          KINOSAIL_PLATFORM: ${{ matrix.platform }}
          KINOSAIL_TEST_IMAGE: localhost/kinosail-player:${{ github.sha }}
          KINOSAIL_TEST_IMAGE_READY: "1"
        run: |
          status=0
          ./scripts/test-container.sh &
          production_pid=$!
          KINOSAIL_BROWSER_TEST=1 ./scripts/test-container.sh &
          browser_pid=$!
          wait "$production_pid" || status=$?
          wait "$browser_pid" || status=$?
          exit "$status"

  auto-revert:
    name: Revert failing Player change on current main
    if: ${{ needs.gates.outputs.enabled == 'true' && (always() && github.event_name == 'push' && contains(needs.*.result, 'failure')) }}
    needs: [gates, static, race, security, tooling, client, system]
    runs-on: ubuntu-latest
    permissions:
      actions: read # The job checks the parent Player Hygiene result.
      contents: write # The job can revert only the failing main commit.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a green Player parent before automatic rollback
        id: parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          parent="$(git rev-parse "$GITHUB_SHA^")"
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow player-hygiene.yml --commit "$parent" --event push --limit 1 --json conclusion --jq '.[0].conclusion')"
          [[ "$conclusion" == success ]] && echo eligible=true >>"$GITHUB_OUTPUT" || echo "SKIP auto-revert: parent Player Hygiene result is ${conclusion:-missing}"
      - if: steps.parent.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          ./apps/player/scripts/auto-revert-main.sh origin main "$GITHUB_SHA"
