name: Subtitles Hygiene

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "47 7 * * 1"
  workflow_dispatch:

concurrency:
  group: subtitles-hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # Gitleaks reads pull-request metadata.

jobs:
  static:
    name: Subtitles static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/subtitles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/subtitles/go.mod
          cache-dependency-path: apps/subtitles/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          working-directory: apps/subtitles
          args: --timeout=5m --new-from-rev=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'HEAD~1' }}
      - name: Install archive test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - name: Check module, coverage, size, and container boundary
        run: make max-loc single-container tidy-check coverage
      - name: Check shell scripts and workflows with verified tools
        working-directory: .
        run: ./scripts/ci/check-source-tools.sh
      - name: Check monorepo workflow boundaries
        working-directory: .
        run: ./scripts/ci/validate-workflows.sh

  race:
    name: Subtitles race tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/subtitles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/subtitles/go.mod
          cache-dependency-path: apps/subtitles/go.sum
      - name: Install archive test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - run: go test -race ./...

  security:
    name: Subtitles security checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/subtitles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/subtitles/go.mod
          cache-dependency-path: apps/subtitles/go.sum
      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  tooling:
    name: Subtitles installer, native, and local pipeline checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/subtitles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/subtitles/go.mod
          cache-dependency-path: apps/subtitles/go.sum
      - name: Install archive test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - run: make installer-test native-build local-pipeline-test

  scheduled:
    name: Subtitles scheduled ${{ matrix.check }}
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/subtitles
    strategy:
      fail-fast: false
      matrix:
        check: [performance, fuzz, deadcode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/subtitles/go.mod
          cache-dependency-path: apps/subtitles/go.sum
      - name: Measure Subtitles performance
        if: matrix.check == 'performance'
        run: make performance-test
      - name: Fuzz backup restore boundary
        if: matrix.check == 'fuzz'
        run: |
          ../../scripts/tooling/with-go-module.sh go test -list '^FuzzRestoreWritesOnlyConfigurationState$' ./internal/backup | grep -Fx FuzzRestoreWritesOnlyConfigurationState
          ../../scripts/tooling/with-go-module.sh go test -run '^$' -fuzz '^FuzzRestoreWritesOnlyConfigurationState$' -fuzztime 30s ./internal/backup
      - name: Report unreachable Go functions
        if: matrix.check == 'deadcode'
        run: make deadcode

  system:
    name: Subtitles system (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/subtitles
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: matrix.platform == 'linux/amd64'
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: matrix.platform == 'linux/amd64'
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install browser-test dependencies
        if: matrix.platform == 'linux/amd64'
        working-directory: apps/subtitles/e2e
        run: pnpm install --frozen-lockfile
      - name: Install browser-test runtime
        if: matrix.platform == 'linux/amd64'
        working-directory: apps/subtitles/e2e
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Subtitles test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/subtitles/Containerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=subtitles-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=subtitles-${{ matrix.platform }}
          load: true
          push: false
          tags: localhost/kinosail-subtitles:${{ github.sha }}
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
      - name: Test ARM64 production container and restart persistence
        if: matrix.platform == 'linux/arm64'
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_PLATFORM: ${{ matrix.platform }}
          KINOSAIL_TEST_IMAGE: localhost/kinosail-subtitles:${{ github.sha }}
          KINOSAIL_TEST_IMAGE_READY: "1"
        run: ./scripts/test-container.sh
      - name: Test AMD64 production and browser paths
        if: matrix.platform == 'linux/amd64'
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_BROWSER_MATRIX: full
          KINOSAIL_BROWSER_WORKERS: "3"
          KINOSAIL_PLATFORM: ${{ matrix.platform }}
          KINOSAIL_TEST_IMAGE: localhost/kinosail-subtitles:${{ github.sha }}
          KINOSAIL_TEST_IMAGE_READY: "1"
        run: |
          status=0
          ./scripts/test-container.sh &
          production_pid=$!
          KINOSAIL_BROWSER_TEST=1 ./scripts/test-container.sh &
          browser_pid=$!
          wait "$production_pid" || status=$?
          wait "$browser_pid" || status=$?
          exit "$status"


  required:
    name: Subtitles checks
    if: always()
    needs: [static, race, security, tooling, system]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$RESULTS"
