name: Subtitles Hygiene

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "47 7 * * 1"
  merge_group:
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

concurrency:
  group: subtitles-hygiene-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read # Gitleaks reads pull-request metadata.

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      full: ${{ inputs.full || false }}

  static:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).subtitles
    timeout-minutes: 20
    name: Subtitles static checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/subtitles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/subtitles/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          working-directory: apps/subtitles
          args: --timeout=5m --new-from-rev=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'HEAD~1' }}
      - name: Install archive test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - name: Check module and container boundary
        run: make single-container tidy-check

  race:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).subtitles
    timeout-minutes: 20
    name: Subtitles race tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/subtitles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/subtitles/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Install archive test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - run: ../../scripts/ci/test-go.sh subtitles

  security:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).subtitles
    timeout-minutes: 20
    name: Subtitles security checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/subtitles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/subtitles/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  tooling:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).subtitles_tools
    timeout-minutes: 20
    name: Subtitles installer, native, and local pipeline checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/subtitles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/subtitles/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Install archive test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: 11.22.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/subtitles/e2e/pnpm-lock.yaml
      - run: pnpm --dir e2e install --frozen-lockfile
      - run: make installer-test native-build local-pipeline-test

  scheduled:
    name: Subtitles scheduled ${{ matrix.check }}
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).deep
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/subtitles
    strategy:
      fail-fast: false
      matrix:
        check: [performance, fuzz, deadcode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/subtitles/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Measure Subtitles performance
        if: matrix.check == 'performance'
        run: make performance-test
      - name: Fuzz backup restore boundary
        if: matrix.check == 'fuzz'
        run: |
          ../../scripts/tooling/with-go-module.sh go test -list '^FuzzRestoreWritesOnlyConfigurationState$' ./internal/backup | grep -Fx FuzzRestoreWritesOnlyConfigurationState
          ../../scripts/tooling/with-go-module.sh go test -run '^$' -fuzz '^FuzzRestoreWritesOnlyConfigurationState$' -fuzztime 30s ./internal/backup
      - name: Report unreachable Go functions
        if: matrix.check == 'deadcode'
        run: make deadcode

  system:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).subtitles
    timeout-minutes: 20
    name: Subtitles system (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/subtitles
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(fromJSON(needs.changes.outputs.plan).subtitles_arm && '[{"platform":"linux/amd64","runner":"ubuntu-24.04"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]' || '[{"platform":"linux/amd64","runner":"ubuntu-24.04"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        if: matrix.platform == 'linux/amd64'
        with:
          version: 11.22.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: matrix.platform == 'linux/amd64'
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install browser-test dependencies
        if: matrix.platform == 'linux/amd64'
        working-directory: apps/subtitles/e2e
        run: pnpm install --frozen-lockfile
      - name: Install browser-test runtime
        if: matrix.platform == 'linux/amd64'
        working-directory: apps/subtitles/e2e
        run: |
          read -ra browsers <<< "$BROWSERS"
          pnpm exec playwright install --with-deps "${browsers[@]}"
        env:
          BROWSERS: ${{ fromJSON(needs.changes.outputs.plan).subtitles_browsers && 'chromium firefox webkit' || 'chromium' }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Subtitles test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/subtitles/Containerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=subtitles-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=subtitles-${{ matrix.platform }}
          load: true
          push: false
          tags: localhost/kinosail-subtitles:${{ github.sha }}
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
      - name: Scan the production image before merge
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: localhost/kinosail-subtitles:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Test ARM64 production container and restart persistence
        if: matrix.platform == 'linux/arm64'
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_PLATFORM: ${{ matrix.platform }}
          KINOSAIL_TEST_IMAGE: localhost/kinosail-subtitles:${{ github.sha }}
          KINOSAIL_TEST_IMAGE_READY: "1"
        run: ./scripts/test-container.sh
      - name: Test AMD64 production and browser paths
        if: matrix.platform == 'linux/amd64'
        env:
          CONTAINER_ENGINE: docker
          KINOSAIL_BROWSER_MATRIX: ${{ fromJSON(needs.changes.outputs.plan).subtitles_browsers && 'full' || '' }}
          # Browser projects mutate settings on the same Server fixture.
          KINOSAIL_BROWSER_WORKERS: "1"
          KINOSAIL_E2E_OUTPUT_DIR: ${{ runner.temp }}/subtitles-browser-results
          KINOSAIL_PLATFORM: ${{ matrix.platform }}
          KINOSAIL_TEST_IMAGE: localhost/kinosail-subtitles:${{ github.sha }}
          KINOSAIL_TEST_IMAGE_READY: "1"
        run: |
          status=0
          ./scripts/test-container.sh &
          production_pid=$!
          KINOSAIL_BROWSER_TEST=1 ./scripts/test-container.sh &
          browser_pid=$!
          wait "$production_pid" || status=$?
          wait "$browser_pid" || status=$?
          exit "$status"
      - name: Retain browser failure evidence
        if: failure() && matrix.platform == 'linux/amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: subtitles-browser-failures
          path: ${{ runner.temp }}/subtitles-browser-results
          retention-days: 7
          if-no-files-found: ignore

  required:
    name: Subtitles checks
    if: always()
    needs: [changes, static, race, security, system, tooling, scheduled]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/required.py subtitles
