name: Subtitles Release

on:
  push:
    tags: ["subtitles-v*"]

permissions:
  contents: read

concurrency:
  group: subtitles-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Verify release prerequisites
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      container_version: ${{ steps.version.outputs.container_version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
    defaults:
      run:
        working-directory: apps/subtitles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require enabled gates
        run: test ! -e ../../.gates-disabled
      - id: version
        name: Validate and split Subtitles release tag
        run: |
          if [[ ${#GITHUB_REF_NAME} -gt 80 || "$GITHUB_REF_NAME" != subtitles-v* ]]; then
            printf 'invalid Subtitles release tag: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#subtitles-}"
          if [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Subtitles release tag must be subtitles-vMAJOR.MINOR.PATCH\n' >&2
            exit 1
          fi
          container_version="${version#v}"
          major="${container_version%%.*}"
          remainder="${container_version#*.}"
          minor="${remainder%%.*}"
          printf 'version=%s\ncontainer_version=%s\nmajor_minor=%s.%s\n' \
            "$version" "$container_version" "$major" "$minor" >>"$GITHUB_OUTPUT"
      - name: Require successful CI for the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          git merge-base --is-ancestor "$commit" origin/main
          for workflow in quality.yml subtitles-hygiene.yml security.yml; do
            conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$commit" --event push --limit 1 --json conclusion --jq '.[0].conclusion')"
            [[ "$conclusion" == success ]] || { echo "Required $workflow is not successful for $commit" >&2; exit 1; }
          done

  images:
    name: Build and scan Subtitles (${{ matrix.platform }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/subtitles/Containerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/kinosail/kinosail-subtitles:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.quality.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=subtitles-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=subtitles-${{ matrix.platform }}
          sbom: true
          provenance: mode=max
      - name: Scan candidate Subtitles image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/kinosail/kinosail-subtitles@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Export verified digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: subtitles-digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [quality, images]
    name: Publish signed Subtitles multi-architecture release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: apps/subtitles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/kinosail/kinosail-subtitles
          tags: |
            type=raw,value=${{ needs.quality.outputs.container_version }}
            type=raw,value=${{ needs.quality.outputs.major_minor }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: subtitles-digest-*
          path: digests
          merge-multiple: true
      - id: build
        name: Assemble and verify both native architectures
        env:
          IMAGE: ghcr.io/kinosail/kinosail-subtitles
        run: |
          sources=()
          for digest in ../../digests/*; do
            digest="${digest##*/}"
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          [[ ${#sources[@]} -eq 2 ]]
          candidate="$IMAGE:candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools create --tag "$candidate" "${sources[@]}"
          docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' manifest.json
          digest="$(jq -r .digest manifest.json)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign Subtitles image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/kinosail/kinosail-subtitles@$IMAGE_DIGEST"
      - name: Attest Subtitles image provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/kinosail/kinosail-subtitles
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Package and sign Subtitles installers
        env:
          APP_VERSION: ${{ needs.quality.outputs.version }}
        run: |
          tar --create --gzip --file kinosail-subtitles-install.tar.gz scripts/install.sh scripts/uninstall.sh scripts/setup-remote-access.sh scripts/disable-remote-access.sh compose.release.yaml compose.config.yaml compose.gpu.yaml compose.rkmpp.yaml compose.remote-https.yaml kinosail.example.yaml .env.example README.md LICENSE LICENSING.md THIRD_PARTY_NOTICES.md SECURITY.md CONTRIBUTING.md CLA.md CCLA.md TRADEMARKS.md third_party/hls.js/LICENSE third_party/htmx/LICENSE
          sha256sum kinosail-subtitles-install.tar.gz > kinosail-subtitles-install.tar.gz.sha256
          cosign sign-blob --yes --bundle kinosail-subtitles-install.tar.gz.sigstore.json kinosail-subtitles-install.tar.gz
          ./scripts/package-native-release.sh "$APP_VERSION" native-release
          cosign sign-blob --yes --bundle native-release/kinosail-release.json.sigstore.json native-release/kinosail-release.json
      - name: Attest Subtitles installer provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: apps/subtitles/kinosail-subtitles-install.tar.gz
      - name: Promote verified image to release tags
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || args+=(--tag "$tag")
          done <<<"$IMAGE_TAGS"
          docker buildx imagetools create "${args[@]}" "ghcr.io/kinosail/kinosail-subtitles@$IMAGE_DIGEST"
      - name: Publish Subtitles release
        env:
          APP_VERSION: ${{ needs.quality.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Kinosail Subtitles $APP_VERSION" kinosail-subtitles-install.tar.gz kinosail-subtitles-install.tar.gz.sha256 kinosail-subtitles-install.tar.gz.sigstore.json native-release/*
