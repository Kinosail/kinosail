name: Subtitles Release

on:
  push:
    tags: ["subtitles-v*"]

permissions:
  contents: read

concurrency:
  group: subtitles-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  release:
    needs: quality
    name: Publish signed Subtitles container and installers
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    defaults:
      run:
        working-directory: apps/subtitles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require enabled gates
        run: test ! -e ../../.gates-disabled
      - id: version
        name: Validate and split Subtitles release tag
        run: |
          if [[ ${#GITHUB_REF_NAME} -gt 80 || "$GITHUB_REF_NAME" != subtitles-v* ]]; then
            printf 'invalid Subtitles release tag: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#subtitles-}"
          if [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Subtitles release tag must be subtitles-vMAJOR.MINOR.PATCH\n' >&2
            exit 1
          fi
          container_version="${version#v}"
          major="${container_version%%.*}"
          remainder="${container_version#*.}"
          minor="${remainder%%.*}"
          printf 'version=%s\ncontainer_version=%s\nmajor_minor=%s.%s\n' \
            "$version" "$container_version" "$major" "$minor" >>"$GITHUB_OUTPUT"
      - name: Require successful Subtitles Hygiene run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow subtitles-hygiene.yml --commit "$commit" --event push --limit 1 --json conclusion --jq '.[0].conclusion')"
          if [[ "$conclusion" != success ]]; then
            printf 'tagged commit %s does not have a successful Subtitles Hygiene run\n' "$commit" >&2
            exit 1
          fi
      - name: Require successful security checks on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          git merge-base --is-ancestor "$commit" origin/main
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow security.yml --commit "$commit" --event push --limit 1 --json conclusion --jq '.[0].conclusion')"
          [[ "$conclusion" == success ]]
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/kinosail/kinosail-subtitles
          tags: |
            type=raw,value=${{ steps.version.outputs.container_version }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/subtitles/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kinosail/kinosail-subtitles:candidate-${{ github.sha }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=subtitles-release-container
          cache-to: type=gha,mode=max,scope=subtitles-release-container
          sbom: true
          provenance: mode=max
      - name: Scan candidate Subtitles image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/kinosail/kinosail-subtitles@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign Subtitles image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/kinosail/kinosail-subtitles@$IMAGE_DIGEST"
      - name: Attest Subtitles image provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/kinosail/kinosail-subtitles
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Package and sign Subtitles installers
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar --create --gzip --file kinosail-subtitles-install.tar.gz scripts/install.sh scripts/uninstall.sh scripts/setup-remote-access.sh scripts/disable-remote-access.sh compose.release.yaml compose.config.yaml compose.gpu.yaml compose.rkmpp.yaml compose.remote-https.yaml kinosail.example.yaml .env.example README.md LICENSE LICENSING.md THIRD_PARTY_NOTICES.md SECURITY.md CONTRIBUTING.md CLA.md CCLA.md TRADEMARKS.md third_party/hls.js/LICENSE third_party/htmx/LICENSE
          sha256sum kinosail-subtitles-install.tar.gz > kinosail-subtitles-install.tar.gz.sha256
          cosign sign-blob --yes --bundle kinosail-subtitles-install.tar.gz.sigstore.json kinosail-subtitles-install.tar.gz
          ./scripts/package-native-release.sh "$APP_VERSION" native-release
          cosign sign-blob --yes --bundle native-release/kinosail-release.json.sigstore.json native-release/kinosail-release.json
      - name: Attest Subtitles installer provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: apps/subtitles/kinosail-subtitles-install.tar.gz
      - name: Promote verified image to release tags
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || args+=(--tag "$tag")
          done <<<"$IMAGE_TAGS"
          docker buildx imagetools create "${args[@]}" "ghcr.io/kinosail/kinosail-subtitles@$IMAGE_DIGEST"
      - name: Publish Subtitles release
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Kinosail Subtitles $APP_VERSION" kinosail-subtitles-install.tar.gz kinosail-subtitles-install.tar.gz.sha256 kinosail-subtitles-install.tar.gz.sigstore.json native-release/*
