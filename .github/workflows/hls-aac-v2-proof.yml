name: Indexed copied AAC V2 recovery contracts
on:
  push:
    branches: [codex/hls-aac-v2-r17-20261009]
permissions: {contents: read}
jobs:
  contracts:
    name: Test-first AAC producer and cache boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with: {fetch-depth: 0, persist-credentials: false}
      - run: test ! -e .gates-disabled
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        timeout-minutes: 3
        with: {go-version-file: go.work, cache-dependency-path: "**/go.sum"}
      - name: Install pinned public-media codecs
        timeout-minutes: 9
        run: |
          curl --fail --location --proto '=https' --max-time 120 --output "$RUNNER_TEMP/hls-ffmpeg.deb" https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v8.1.2-5/jellyfin-ffmpeg8_8.1.2-5-noble_amd64.deb
          printf '%s  %s\n' b4e72894ad26c809ed0104805f5415a97be75212b9fcf9d60b89ad25bb3d43e3 "$RUNNER_TEMP/hls-ffmpeg.deb" | sha256sum --check
          apt_options=(-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=0)
          if ! timeout --kill-after=5s 90s sudo apt-get "${apt_options[@]}" update --error-on=any; then
            python3 - "$RUNNER_TEMP/hls-ubuntu.sources" <<'PY'
          import pathlib, sys
          source = pathlib.Path('/etc/apt/sources.list.d/ubuntu.sources')
          with source.open('rb') as stream:
              data = stream.read(65537)
          assert len(data) <= 65536, 'runner_ubuntu_sources_bound'
          lines = data.decode().splitlines(keepends=True)
          changed = False
          for index, line in enumerate(lines):
              if line.rstrip('\r\n') in ['URIs: http://azure.archive.ubuntu.com/ubuntu/', 'URIs: http://azure.archive.ubuntu.com/ubuntu']:
                  lines[index] = 'URIs: https://archive.ubuntu.com/ubuntu/\n'
                  changed = True
          assert changed, 'runner_ubuntu_mirror_not_supported'
          pathlib.Path(sys.argv[1]).write_text(''.join(lines))
          PY
            sudo install -m 0644 "$RUNNER_TEMP/hls-ubuntu.sources" /etc/apt/sources.list.d/ubuntu.sources
            timeout --kill-after=5s 90s sudo apt-get "${apt_options[@]}" update --error-on=any
          fi
          timeout --kill-after=5s 180s sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "$RUNNER_TEMP/hls-ffmpeg.deb"
          echo /usr/lib/jellyfin-ffmpeg >> "$GITHUB_PATH"
      - name: Execute source and cache contracts before production
        id: contracts
        timeout-minutes: 7
        run: |
          mkdir -p .verification/hls-aac-v2
          set -o pipefail
          python3 -m unittest discover -s apps/player/scripts -p 'test_hls_aac_v2_evidence.py'
          KINOSAIL_COPIED_RECOVERY_MEDIA=1 go -C apps/player test ./internal/server -run '^TestCopiedAAC|^TestCopiedHLS(VideoPrerollDoesNotSuppressCopiedAudio|PrerollScopeKeepsLegacyAndAdmission)$' -v -count=1 -timeout=4m 2>&1 | tee .verification/hls-aac-v2/contracts.txt
      - name: Preserve exact-source contract outcome
        if: always()
        env:
          CONTRACT_OUTCOME: ${{ steps.contracts.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root=pathlib.Path('.verification/hls-aac-v2')
          root.mkdir(parents=True,exist_ok=True)
          data={'revision':os.environ['GITHUB_SHA'],'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'contractOutcome':os.environ['CONTRACT_OUTCOME'],'publicAcceptance':False,'nativeAcceptance':False}
          receipt=root/'receipt.json'
          receipt.write_text(json.dumps(data,sort_keys=True,indent=2)+'\n')
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(path.read_bytes()).hexdigest()+'  '+path.name+'\n' for path in [receipt,root/'contracts.txt'] if path.exists()))
          print(receipt.read_text())
          PY
      - name: Preserve formatting proposal after exact-source execution
        if: always()
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess
          paths=subprocess.check_output(['git','diff','--name-only','4720d3f56e4e069c329b6b58f220aee874077586','HEAD','--','*.go'],text=True).splitlines()
          for name in paths:
              path=pathlib.Path(name)
              result=subprocess.run(['gofmt',str(path)],capture_output=True,timeout=10)
              if result.returncode:
                  print(json.dumps({'formatFailure':name}))
                  continue
              if result.stdout!=path.read_bytes():
                  print(json.dumps({'formattedPath':name,'base64':base64.b64encode(result.stdout).decode()}))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        timeout-minutes: 2
        with:
          name: aac-v2-contracts-${{ github.sha }}
          path: .verification/hls-aac-v2
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
