          for app in ('player', 'subtitles'):
              subprocess.run([sys.executable, 'scripts/tooling/generate-architecture-explorer.py', app], check=True)
              subprocess.run([sys.executable, 'scripts/tooling/generate-architecture-explorer.py', app, '--check'], check=True)
              body = pathlib.Path('apps/' + app + '/docs/architecture-explorer/index.html').read_bytes()
              if len(body) > 2 * 1024 * 1024: raise SystemExit('canonical source exceeds bound')
              encoded = base64.b64encode(body).decode('ascii')
              chunks = [encoded[i:i + 4096] for i in range(0, len(encoded), 4096)]
              metadata = {'app': app, 'sourceCommit': source, 'bytes': len(body), 'sha256': hashlib.sha256(body).hexdigest(), 'blob': hashlib.sha1(('blob ' + str(len(body)) + '\0').encode() + body).hexdigest(), 'chunks': len(chunks)}
              print('R18_CANONICAL_HEADER ' + json.dumps(metadata, separators=(',', ':')), flush=True)
              for index, chunk in enumerate(chunks): print('R18_CANONICAL_CHUNK ' + app + ' ' + str(index) + ' ' + chunk, flush=True)
