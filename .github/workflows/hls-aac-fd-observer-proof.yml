name: Retained-input observer written-first contracts
on:
  push:
    branches: [codex/hls-aac-fd-observer-proof-20261009]
permissions: {contents: read}
jobs:
  contracts:
    name: Captured-input and sampler contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with: {fetch-depth: 0, persist-credentials: false}
      - run: test ! -e .gates-disabled
      - name: Install pinned public-media codecs
        timeout-minutes: 9
        run: |
          curl --fail --location --proto '=https' --max-time 120 --output "$RUNNER_TEMP/hls-ffmpeg.deb" https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v8.1.2-5/jellyfin-ffmpeg8_8.1.2-5-noble_amd64.deb
          printf '%s  %s\n' b4e72894ad26c809ed0104805f5415a97be75212b9fcf9d60b89ad25bb3d43e3 "$RUNNER_TEMP/hls-ffmpeg.deb" | sha256sum --check
          apt_options=(-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=0)
          if ! timeout --kill-after=5s 90s sudo apt-get "${apt_options[@]}" update --error-on=any; then
            python3 - "$RUNNER_TEMP/hls-ubuntu.sources" <<'PY'
          import pathlib, sys
          source = pathlib.Path('/etc/apt/sources.list.d/ubuntu.sources')
          with source.open('rb') as stream:
              data = stream.read(65537)
          assert len(data) <= 65536, 'runner_ubuntu_sources_bound'
          lines = data.decode().splitlines(keepends=True)
          changed = False
          for index, line in enumerate(lines):
              if line.rstrip('\r\n') in ['URIs: http://azure.archive.ubuntu.com/ubuntu/', 'URIs: http://azure.archive.ubuntu.com/ubuntu']:
                  lines[index] = 'URIs: https://archive.ubuntu.com/ubuntu/\n'
                  changed = True
          assert changed, 'runner_ubuntu_mirror_not_supported'
          pathlib.Path(sys.argv[1]).write_text(''.join(lines))
          PY
            sudo install -m 0644 "$RUNNER_TEMP/hls-ubuntu.sources" /etc/apt/sources.list.d/ubuntu.sources
            timeout --kill-after=5s 90s sudo apt-get "${apt_options[@]}" update --error-on=any
          fi
          timeout --kill-after=5s 180s sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "$RUNNER_TEMP/hls-ffmpeg.deb"
          echo /usr/lib/jellyfin-ffmpeg >> "$GITHUB_PATH"
      - name: Retain source-file cap
        run: make max-loc
      - name: Captured-input and sampler contracts
        id: contracts
        timeout-minutes: 4
        run: |
          mkdir -p .verification/hls-aac-fd-observer
          set -o pipefail
          observer_status=0
          python3 -m unittest discover -v -s apps/player/scripts -p 'test_hls_aac_v2_*invocations.py' 2>&1 | tee .verification/hls-aac-fd-observer/contracts.txt || observer_status=1
          python3 -m unittest discover -v -s apps/player/scripts -p 'test_hls_aac_v2_fd_sampler.py' 2>&1 | tee -a .verification/hls-aac-fd-observer/contracts.txt || observer_status=1
          timeout --signal=TERM --kill-after=30s 150s python3 -m unittest discover -v -s apps/player/scripts -p 'test_hls_aac_v2_fd_live.py' 2>&1 | tee -a .verification/hls-aac-fd-observer/contracts.txt || observer_status=1
          exit "$observer_status"
      - name: Preserve exact-source contract outcome
        if: always()
        env:
          CONTRACT_OUTCOME: ${{ steps.contracts.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('.verification/hls-aac-fd-observer')
          root.mkdir(parents=True, exist_ok=True)
          data = {'revision': os.environ['GITHUB_SHA'], 'tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(), 'contractOutcome': os.environ['CONTRACT_OUTCOME'], 'productionAcceptance': False, 'publicGETAcceptance': False}
          receipt = root / 'receipt.json'
          receipt.write_text(json.dumps(data, sort_keys=True) + '\n')
          (root / 'SHA256SUMS').write_text(''.join(hashlib.sha256(path.read_bytes()).hexdigest()+'  '+path.name+'\n' for path in [receipt, root/'contracts.txt', root/'live-receipt.json'] if path.exists()))
          print(receipt.read_text())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        timeout-minutes: 2
        with:
          name: aac-fd-observer-${{ github.sha }}
          path: |
            .verification/hls-aac-fd-observer/receipt.json
            .verification/hls-aac-fd-observer/live-receipt.json
            .verification/hls-aac-fd-observer/contracts.txt
            .verification/hls-aac-fd-observer/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
