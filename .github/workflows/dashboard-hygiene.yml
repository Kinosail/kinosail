name: Dashboard Hygiene

on:
  pull_request:
    paths:
      - "apps/dashboard/**"
      - "packages/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/dashboard-hygiene.yml"
      - ".github/workflows/dashboard-release.yml"
      - "scripts/ci/**"
      - "scripts/tooling/**"
      - ".containerignore"
      - ".dockerignore"
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "packages/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/dashboard-hygiene.yml"
      - ".github/workflows/dashboard-release.yml"
      - "scripts/ci/**"
      - "scripts/tooling/**"
      - ".containerignore"
      - ".dockerignore"
  workflow_dispatch:

concurrency:
  group: dashboard-hygiene-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # Gitleaks reads pull-request metadata.

jobs:
  gates:
    name: Check temporary gate pause
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.state.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: state
        run: |
          if [ -f .gates-disabled ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  static:
    needs: gates
    if: needs.gates.outputs.enabled == 'true'
    name: Dashboard static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/dashboard/go.mod
          cache-dependency-path: apps/dashboard/go.sum
      - name: Check shared Player-baseline packages
        working-directory: packages
        run: make tidy-check coverage test-race
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          working-directory: apps/dashboard
          args: --timeout=5m --new-from-rev=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'HEAD~1' }}
      - name: Check module, coverage, size, and container boundary
        run: make max-loc single-container tidy-check coverage
      - name: Check shell scripts and workflows with verified tools
        working-directory: .
        run: ./scripts/ci/check-source-tools.sh
      - name: Check monorepo workflow boundaries
        working-directory: .
        run: ./scripts/ci/validate-workflows.sh

  race:
    needs: gates
    if: needs.gates.outputs.enabled == 'true'
    name: Dashboard race tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/dashboard/go.mod
          cache-dependency-path: apps/dashboard/go.sum
      - run: go test -race ./...

  security:
    needs: gates
    if: needs.gates.outputs.enabled == 'true'
    name: Dashboard security checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/dashboard/go.mod
          cache-dependency-path: apps/dashboard/go.sum
      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Scan secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    needs: gates
    if: needs.gates.outputs.enabled == 'true'
    name: Build Dashboard container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/dashboard/Containerfile
          push: false
          tags: localhost/kinosail-dashboard:${{ github.sha }}
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
