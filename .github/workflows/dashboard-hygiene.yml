name: Dashboard Hygiene

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

concurrency:
  group: dashboard-hygiene-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read # Gitleaks reads pull-request metadata.

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      full: ${{ inputs.full || false }}

  static:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).dashboard
    timeout-minutes: 20
    name: Dashboard static checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/dashboard/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          working-directory: apps/dashboard
          args: --timeout=5m --new-from-rev=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'HEAD~1' }}
      - name: Check module and container boundary
        run: make single-container tidy-check

  race:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).dashboard
    timeout-minutes: 20
    name: Dashboard race tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/dashboard/go.mod
          cache-dependency-path: "**/go.sum"
      - run: ../../scripts/ci/test-go.sh dashboard

  security:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).dashboard
    timeout-minutes: 20
    name: Dashboard security checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/dashboard/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  system:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).dashboard
    timeout-minutes: 20
    name: Dashboard runtime and browser checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: apps/dashboard/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm --dir apps/dashboard/e2e install --frozen-lockfile
      - run: |
          read -ra browsers <<< "$BROWSERS"
          pnpm --dir apps/dashboard/e2e exec playwright install --with-deps "${browsers[@]}"
        env:
          BROWSERS: ${{ fromJSON(needs.changes.outputs.plan).dashboard_browsers && 'chromium firefox webkit' || 'chromium' }}
      - run: make -C apps/dashboard container-test
        env:
          CONTAINER_ENGINE: docker
      - run: |
          args=()
          [[ "$PROJECT" == full ]] || args+=(--project=chromium)
          pnpm --dir apps/dashboard/e2e exec playwright test "${args[@]}"
        env:
          CI: "1"
          PROJECT: ${{ fromJSON(needs.changes.outputs.plan).dashboard_browsers && 'full' || 'chromium' }}
      - name: Build ARM64 when build inputs change
        if: fromJSON(needs.changes.outputs.plan).dashboard_arm
        run: docker build --platform linux/arm64 -f apps/dashboard/Containerfile .
        env:
          CONTAINER_ENGINE: docker

  required:
    name: Dashboard checks
    if: always()
    needs: [changes, static, race, security, system]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/required.py dashboard
