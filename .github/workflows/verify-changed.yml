name: Literal affected-app verification

on:
  workflow_dispatch:
    inputs:
      app:
        description: Run the literal affected-app target against freshly fetched main
        type: choice
        options: [both, player, subtitles]
        default: both

permissions:
  contents: read

concurrency:
  group: verify-changed-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_SELECTION: ${{ inputs.app }}
      CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit closed selection before tool and app effects
        run: bash scripts/ci/run-verify-changed.sh "$APP_SELECTION" --admit-only
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.22.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install existing pinned verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools ffmpeg
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          tools="$RUNNER_TEMP/verify-tools"
          mkdir "$tools"
          curl --proto '=https' --tlsv1.2 --fail --location --max-time 120 --max-filesize 16777216 --output "$tools/shellcheck.tar.gz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          curl --proto '=https' --tlsv1.2 --fail --location --max-time 120 --max-filesize 16777216 --output "$tools/actionlint.tar.gz" https://github.com/kjanat/actionlint/releases/download/v1.17.0/actionlint_1.17.0_linux_amd64.tar.gz
          printf '%s  %s\n' b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 "$tools/shellcheck.tar.gz" 620abd485a12b6ab1125b844a876414e1d5bd2af8a3125b27f82b01d0d9d6e5a "$tools/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$tools/shellcheck.tar.gz" -C "$tools" shellcheck-v0.11.0/shellcheck
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          printf '%s\n' "$tools/shellcheck-v0.11.0" "$tools" >> "$GITHUB_PATH"
          for app in player subtitles; do
            if [ "$APP_SELECTION" = both ] || [ "$APP_SELECTION" = "$app" ]; then
              pnpm --dir "apps/$app/e2e" install --frozen-lockfile
            fi
          done
      - name: Run selected literal targets serially
        run: bash scripts/ci/run-verify-changed.sh "$APP_SELECTION"
      - name: Keep revision and actual verification stage logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: literal-verify-changed-${{ github.sha }}
          path: |
            .verification/verify-changed/receipt.json
            .verification/verify-changed/revisions.txt
            .verification/verify-changed/results.txt
            .verification/verify-changed/fetch.log
            .verification/verify-changed/player.log
            .verification/verify-changed/player-stages.tar.gz
            .verification/verify-changed/subtitles.log
            .verification/verify-changed/subtitles-stages.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
