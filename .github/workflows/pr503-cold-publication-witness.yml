name: PR503 cold publication witness

on:
  pull_request:
    paths:
      - .github/workflows/pr503-cold-publication-witness.yml
      - apps/player/internal/server/hls_copied_recovery_enclosing_test.go
      - apps/player/internal/server/hls_copied_recovery_publication_test.go
      - apps/player/internal/server/hls_copied_recovery_cold_counterfactual_test.go

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  cold-publication:
    name: Cold publication repeat witness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - id: repeat
        name: Repeat the unchanged ordinary publication assertion
        working-directory: apps/player
        run: |
          mkdir -p .verification/pr503-cold-publication
          git rev-parse HEAD > .verification/pr503-cold-publication/revision.txt
          git rev-parse 'HEAD^{tree}' > .verification/pr503-cold-publication/tree.txt
          go test -json -count=100 -run '^TestCopiedRecoveryEnclosingOrdinaryPublication$' ./internal/server | tee .verification/pr503-cold-publication/ordinary.jsonl
      - name: Repeat the unchanged retained boundary assertions
        if: always() && steps.repeat.outcome != 'skipped'
        working-directory: apps/player
        run: go test -json -count=10 -run '^TestCopiedRecoveryEnclosing(RefillPreservesMaster|EarlyFailurePreservesMaster|CancellationJoins|ReplacementGeneration)$' ./internal/server | tee .verification/pr503-cold-publication/boundary.jsonl
      - name: Capture controlled initialization counterfactuals
        if: always() && steps.repeat.outcome != 'skipped'
        working-directory: apps/player
        run: go test -json -count=10 -run '^TestCopiedRecoveryOrdinaryPublicationInitializationCounterfactual$' ./internal/server | tee .verification/pr503-cold-publication/counterfactual.jsonl
      - name: Preserve all source-bound witness results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr503-cold-publication-witness
          path: apps/player/.verification/pr503-cold-publication/
          retention-days: 14
          if-no-files-found: error
