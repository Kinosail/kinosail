name: Version release

on:
  push:
    tags: ["player-v*", "subtitles-v*", "dashboard-v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Require verified main commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      app: ${{ steps.tag.outputs.app }}
      version: ${{ steps.tag.outputs.version }}
      container_version: ${{ steps.tag.outputs.container_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: test ! -e .gates-disabled
      - id: tag
        run: python3 scripts/ci/release_tag.py
      - name: Require successful CI for the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          git merge-base --is-ancestor "$commit" origin/main
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$commit" --event push --limit 1 --json conclusion --jq '.[0].conclusion')"
          [[ "$conclusion" == success ]]

  images:
    name: Build and scan ${{ needs.preflight.outputs.app }} (${{ matrix.arch }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/${{ needs.preflight.outputs.app }}/Containerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/kinosail/kinosail-${{ needs.preflight.outputs.app }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.preflight.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ needs.preflight.outputs.app }}-linux/${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ needs.preflight.outputs.app }}-linux/${{ matrix.arch }}
          sbom: true
          provenance: mode=max
      - name: Test production image by digest
        env:
          APP: ${{ needs.preflight.outputs.app }}
          IMAGE: ghcr.io/kinosail/kinosail-${{ needs.preflight.outputs.app }}@${{ steps.build.outputs.digest }}
        run: ./scripts/ci/test-image.sh "$APP" "$IMAGE"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/kinosail/kinosail-${{ needs.preflight.outputs.app }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Export verified digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1
          if-no-files-found: error

  release:
    name: Publish signed ${{ needs.preflight.outputs.app }} version
    needs: [preflight, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      APP: ${{ needs.preflight.outputs.app }}
      IMAGE: ghcr.io/kinosail/kinosail-${{ needs.preflight.outputs.app }}
      APP_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-digest-*
          path: digests
          merge-multiple: true
      - id: manifest
        name: Assemble both tested architectures
        run: |
          sources=()
          for digest in digests/*; do
            digest="${digest##*/}"
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          [[ ${#sources[@]} -eq 2 ]]
          candidate="$IMAGE:candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools create --tag "$candidate" "${sources[@]}"
          docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' manifest.json
          digest="$(jq -r .digest manifest.json)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: 'v3.1.3'
      - name: Sign the version image
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          COSIGN_REPOSITORY: ghcr.io/kinosail/kinosail-signatures
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          anonymous_docker_config="$(mktemp -d)"
          for attempt in {1..24}; do
            if DOCKER_CONFIG="$anonymous_docker_config" cosign verify --certificate-identity "https://github.com/Kinosail/kinosail/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE@$DIGEST" >/dev/null 2>"$RUNNER_TEMP/cosign-verify-error"; then
              break
            fi
            if (( attempt == 24 )); then cat "$RUNNER_TEMP/cosign-verify-error" >&2; exit 1; fi
            sleep 5
          done
      - name: Attest image provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: false
      - name: Verify GitHub provenance
        if: ${{ !github.event.repository.private }}
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: gh attestation verify "oci://$IMAGE@$DIGEST" --repo Kinosail/kinosail --signer-workflow Kinosail/kinosail/.github/workflows/release.yml --source-ref "$GITHUB_REF" >/dev/null
      - name: Package signed installers
        if: needs.preflight.outputs.app != 'dashboard'
        run: ./scripts/ci/package-release.sh "$APP" "$APP_VERSION"
      - name: Attest installer provenance
        if: needs.preflight.outputs.app != 'dashboard' && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: apps/${{ needs.preflight.outputs.app }}/kinosail-${{ needs.preflight.outputs.app }}-install.tar.gz
      - name: Promote exact version tag
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          CONTAINER_VERSION: ${{ needs.preflight.outputs.container_version }}
        run: docker buildx imagetools create --tag "$IMAGE:$CONTAINER_VERSION" "$IMAGE@$DIGEST"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          title="Kinosail ${APP^} $APP_VERSION"
          assets=()
          if [[ "$APP" != dashboard ]]; then
            assets=("apps/$APP/kinosail-$APP-install.tar.gz" "apps/$APP/kinosail-$APP-install.tar.gz.sha256" \
              "apps/$APP/kinosail-$APP-install.tar.gz.sigstore.json" apps/"$APP"/native-release/*)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$title" "${assets[@]}"
