name: Repository Quality

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  static:
    name: Repository policy and CI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: test ! -e .gates-disabled
      - run: make max-loc
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - run: ./scripts/ci/validate-workflows.sh
      - run: ./scripts/ci/check-source-tools.sh

  web:
    name: Browser script checks
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm --dir scripts/quality install --frozen-lockfile
      - run: ./scripts/quality/check-script-lint.sh

  tooling:
    name: Repository tooling checks
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          package-manager-cache: false
      - run: make tooling-check

  packages:
    name: Shared package tests, lint, and dependencies
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: packages/go.mod
          cache-dependency-path: "**/go.sum"
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.13.1
          working-directory: packages
          args: --timeout=5m --new-from-rev=${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
      - run: make -C packages tidy-check
      - run: ./scripts/ci/test-go.sh packages
      - run: go -C packages run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go -C apps/subtitles mod download && python3 scripts/quality/check-dependency-integrity.py

  required:
    name: Repository checks
    if: always()
    needs: [changes, static, tooling, packages, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/required.py repository

  delivery:
    name: Ship verified containers
    needs: [changes, required]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (fromJSON(needs.changes.outputs.plan).player || fromJSON(needs.changes.outputs.plan).subtitles || fromJSON(needs.changes.outputs.plan).dashboard)
    uses: ./.github/workflows/delivery.yml
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      plan: ${{ needs.changes.outputs.plan }}
