name: Prepared HLS timeline

on:
  pull_request:
    paths:
      - "apps/player/internal/server/**"
      - "apps/player/scripts/*hls*"
      - "packages/playback/**"
      - "packages/hlsmanifest/**"
      - ".github/workflows/hls-prepared-timeline.yml"
  push:
    branches: [main]
    paths:
      - "apps/player/internal/server/**"
      - "apps/player/scripts/*hls*"
      - "packages/playback/**"
      - "packages/hlsmanifest/**"
      - ".github/workflows/hls-prepared-timeline.yml"

permissions:
  contents: read

jobs:
  prepared-timeline:
    name: Prepared copied-video timeline and continuation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: apps/player/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Install startup fixture codecs
        run: |
          curl --fail --location --proto '=https' --max-time 120 --output "$RUNNER_TEMP/startup-ffmpeg.deb" https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v8.1.2-5/jellyfin-ffmpeg8_8.1.2-5-noble_amd64.deb
          printf '%s  %s\n' b4e72894ad26c809ed0104805f5415a97be75212b9fcf9d60b89ad25bb3d43e3 "$RUNNER_TEMP/startup-ffmpeg.deb" | sha256sum --check
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "$RUNNER_TEMP/startup-ffmpeg.deb"
          echo /usr/lib/jellyfin-ffmpeg >> "$GITHUB_PATH"
      - name: Verify prepared copied-video timeline
        env:
          GOMAXPROCS: "2"
        run: python3 apps/player/scripts/test-hls-prepared-timeline.py
      - name: Keep safe prepared timeline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: player-prepared-timeline-evidence
          include-hidden-files: true
          path: |
            .verification/hls-prepared-timeline/*/receipt.json
            .verification/hls-prepared-timeline/*/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
