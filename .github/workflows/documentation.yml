name: Documentation

on:
  pull_request:
    paths:
      - engineering/documentation/**
      - apps/player/docs/**
      - packages/webassets/static/fonts/**
      - .github/workflows/documentation.yml
  push:
    branches: [main]
    paths:
      - engineering/documentation/**
      - apps/player/docs/**
      - packages/webassets/static/fonts/**
      - .github/workflows/documentation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: engineering/documentation
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Test documentation interactions
        run: |
          npm ci --prefix engineering/documentation --ignore-scripts
          npm test --prefix engineering/documentation
      - name: Test deployment validation
        run: python3 -m unittest discover -s engineering/documentation -p 'test_*.py'
      - name: Build documentation
        run: python3 engineering/documentation/build.py --output "$RUNNER_TEMP/kinosail-docs"
      - name: Check every rendered page
        run: python3 engineering/documentation/check.py "$RUNNER_TEMP/kinosail-docs"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/kinosail-docs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
