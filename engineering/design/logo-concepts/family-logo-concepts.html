<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kinosail family logo concepts</title>
<style>
  :root{color-scheme:dark;--bg:#090a08;--surface:#12140f;--text:#f6f8ef;--muted:#9ca391;--line:#292d24;--signal:#c8f169}
  *{box-sizing:border-box}
  html,body{margin:0;background:#050604;color:var(--text);font-family:Arial,Helvetica,sans-serif}
  body{display:grid;gap:48px;padding:48px}
  .sheet{width:720px;background:var(--surface);overflow:hidden}
  .sheet::before{display:block;height:10px;background:var(--signal);content:""}
  header{padding:42px 48px 34px;background:var(--bg)}
  .eyebrow{margin:0 0 12px;color:var(--signal);font-size:18px;font-weight:800;letter-spacing:4px}
  h1{margin:0;font-size:52px;line-height:1;letter-spacing:-2px}
  header p:last-child{margin:15px 0 0;color:var(--muted);font-size:22px}
  .concept{display:grid;grid-template-columns:220px 1fr;gap:30px;align-items:center;min-height:330px;padding:30px 48px;border-bottom:1px solid var(--line)}
  .icon{display:block;width:210px;height:210px}
  .number{margin:0 0 7px;color:var(--signal);font:700 19px Menlo,Monaco,monospace;letter-spacing:2px}
  h2{margin:0;font-size:36px;line-height:1.05;letter-spacing:-1px}
  .detail{max-width:340px;margin:13px 0 0;color:var(--muted);font-size:22px;line-height:1.32}
  .tests{display:flex;align-items:center;gap:12px;margin-top:19px;color:#737a68;font:700 14px Menlo,Monaco,monospace;letter-spacing:1px}
  .mini64{width:52px;height:52px;margin-right:12px}.mini32{width:30px;height:30px}
  footer{padding:28px 48px 34px;background:var(--bg);color:var(--muted);font-size:18px;line-height:1.4}
  footer strong{display:block;margin-top:7px;color:#737a68;font:700 13px Menlo,Monaco,monospace;letter-spacing:2px}
</style>
<body>
